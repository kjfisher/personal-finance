<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Midterm Showdown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: projected 5×5 money board, team scoreboard strip below; clue opens full-screen.
   Deliberate single dark "vault" look to match Future Millionaire. */
:root {
  --vault: #0b1f1a; --tile: #164036; --tile-hi: #1d5245; --line: #2c574a; --panel: #123129;
  --ink: #eef5f0; --muted: #9fb8ad; --gold: #e2b350; --gold-ink: #2a1f05; --good: #6fd3a2; --bad: #ee7462;
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--vault); color: var(--ink); font-family: var(--body); font-size: 17px;
  background-image: repeating-radial-gradient(circle at 88% 0%, transparent 0 14px, rgba(226,179,80,.035) 14px 15px); }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 16px 30px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 3.4vw, 40px); margin: 0; }
h1 span { color: var(--gold); }
.tag { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; color: var(--muted); }
.ghost:hover { color: var(--ink); }
.primary { background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.boardwrap { overflow-x: auto; }
.board { display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr)); gap: 8px; min-width: 680px; }
.cat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; min-height: 74px; display: flex; flex-direction: column; justify-content: center; }
.cat b { font-family: var(--display); font-size: clamp(16px, 1.6vw, 21px); line-height: 1.1; }
.cat small { font-family: var(--mono); font-size: 11px; color: var(--gold); letter-spacing: .1em; text-transform: uppercase; margin-top: 3px; }
.cell { background: var(--tile); border: 1px solid var(--line); border-radius: 12px; min-height: clamp(62px, 9vh, 92px);
  font-family: var(--mono); font-weight: 700; font-size: clamp(24px, 3vw, 38px); color: var(--gold); transition: background .15s, transform .15s; }
.cell:hover:not(:disabled) { background: var(--tile-hi); transform: translateY(-2px); }
.cell:disabled { background: transparent; border-style: dashed; color: transparent; cursor: default; }

.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 14px; }
.team { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.team.lead { border-color: var(--gold); }
.team .name { font-family: var(--display); font-weight: 600; font-size: 19px; border-radius: 6px; padding: 0 4px; outline: none; }
.team .name:focus { background: var(--vault); }
.team .pts { font-family: var(--mono); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.team .adj { display: flex; gap: 6px; }
.team .adj button { flex: 1; background: var(--vault); border: 1px solid var(--line); border-radius: 8px; padding: 4px; font-family: var(--mono); font-size: 14px; }

.overlay { position: fixed; inset: 0; background: rgba(5,15,12,.94); display: grid; place-items: center; padding: 20px; z-index: 20; }
.clue { width: min(1000px, 100%); max-height: 92vh; overflow: auto; background: var(--panel); border: 1px solid var(--gold); border-radius: 22px; padding: clamp(18px, 3vw, 34px); display: flex; flex-direction: column; gap: 16px; }
.clue .meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-family: var(--mono); color: var(--gold); text-transform: uppercase; letter-spacing: .1em; font-size: 14px; }
.clue .q { font-family: var(--display); font-weight: 600; font-size: clamp(24px, 3.4vw, 42px); line-height: 1.2; text-wrap: balance; }
.clue .a { border-top: 1px dashed var(--line); padding-top: 14px; font-size: clamp(19px, 2.2vw, 26px); line-height: 1.4; }
.clue .a b { color: var(--good); }
.double { font-family: var(--display); font-weight: 800; color: var(--gold); font-size: clamp(30px, 5vw, 56px); text-align: center; animation: pulse 1s ease-in-out 2; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.award { display: flex; flex-wrap: wrap; gap: 8px; }
.award .t { background: var(--vault); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: flex; gap: 6px; align-items: center; }
.award .t span { min-width: 6em; }
.award .t button { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); width: 40px; height: 34px; font-weight: 700; }
.award .t button.y { color: var(--good); } .award .t button.n { color: var(--bad); }
.award .t button.on { background: var(--ink); color: var(--vault); }
.wager { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.wager label { display: flex; flex-direction: column; gap: 4px; background: var(--vault); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.wager input { font: inherit; font-family: var(--mono); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.muted { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div><h1>Midterm <span>Showdown</span></h1><div class="tag">Personal Finance · Units 2–5 · #FutureMillionaires</div></div>
    <div class="row">
      <button class="ghost" id="addTeam">+ Team</button>
      <button class="ghost" id="rmTeam">− Team</button>
      <button class="ghost" id="finalBtn">Final Round</button>
      <button class="ghost" id="resetBtn">New game</button>
    </div>
  </header>
  <div class="boardwrap"><div class="board" id="board"></div></div>
  <div class="teams" id="teams"></div>
  <p class="muted" style="font-size:14px">Click a value to open a question. Read it aloud, give teams time, then click <b>Show answer</b> and mark each team ✓ or ✗. Click a team name to rename it. One tile is hidden Double Points.</p>
</div>

<div class="overlay" id="ov" hidden><div class="clue" id="clue"></div></div>

<script>
const CATS = [{"name": "Your Paycheck", "unit": "Unit 2", "qs": [["Your job offer says $54,000 a year. Is that gross or net pay?", "<b>Gross</b>: what you earn before taxes and deductions."], ["Name the two FICA taxes and their rates.", "<b>Social Security 6.2%</b> + <b>Medicare 1.45%</b> = 7.65%."], ["$61,200 a year. Gross monthly pay?", "$61,200 ÷ 12 = <b>$5,100</b>"], ["Gross pay is $4,000 a month. How much is Illinois income tax (4.95%)?", "$4,000 × 0.0495 = <b>$198</b>"], ["$3,500 a month. You put 6% in your 401(k) and your employer matches 100% up to 6%. Total going in each month?", "You $210 + match $210 = <b>$420</b>"]]}, {"name": "Pay Stubs & Overtime", "unit": "Unit 2", "qs": [["What does YTD stand for?", "<b>Year to date</b>: January 1 through this pay period."], ["Overtime rate for $26 an hour?", "$26 × 1.5 = <b>$39</b>"], ["$18 an hour, 44 hours. Total pay?", "40 × $18 = $720 + 4 × $27 = $108 → <b>$828</b>"], ["Paid monthly. Period 6/1–6/30, pay date 7/1. Months in YTD?", "<b>6</b>: count by the pay period, not the pay date."], ["Gross pay $2,600. Social Security + Medicare together?", "$161.20 + $37.70 = <b>$198.90</b>"]]}, {"name": "Budgeting", "unit": "Unit 3", "qs": [["Need or want: concert tickets?", "<b>Want.</b>"], ["Fixed or variable: groceries?", "<b>Variable</b>: they change week to week."], ["50/30/20: savings on a $3,500 take-home pay?", "20% of $3,500 = <b>$700</b>"], ["$70 a week on groceries. Monthly cost?", "$70 × 52 = $3,640 ÷ 12 = <b>$303.33</b>"], ["Take-home $2,950, expenses $2,575. Savings ability? How many months to a $2,250 emergency fund?", "$375 a month → <b>6 months</b>"]]}, {"name": "Federal Taxes", "unit": "Unit 4", "qs": [["Which form do you fill out at a new job to set withholding?", "<b>W-4</b>"], ["When are federal taxes usually due?", "<b>April 15</b>"], ["Box 1 is $26,500. Taxable income? (2026 standard deduction $16,100)", "$26,500 − $16,100 = <b>$10,400</b>"], ["Taxable income is $10,400. Federal tax?", "All in the 10% bracket: <b>$1,040</b>"], ["Withheld $1,300. Tax owed $1,040. Refund or owe, and how much?", "<b>Refund of $260</b>"]]}, {"name": "Banking", "unit": "Unit 5", "qs": [["The FDIC insures deposits up to how much?", "<b>$250,000</b> per depositor, per bank."], ["Why can online banks pay more interest on an HYSA?", "<b>No branches</b> = lower costs."], ["What usually happens if you take money out of a CD early?", "You pay a <b>penalty</b>."], ["$5,000 in an HYSA at 4% for one year. Interest earned?", "$5,000 × 0.04 = <b>$200</b>"], ["$1,200 in a CD at 5% for 2 years, compounded annually. Ending amount?", "$1,260 → <b>$1,323</b>"]]}];
const FINAL = {"q": "Gross pay is $4,500 a month in Illinois. How much comes out for FICA (7.65%) plus Illinois income tax (4.95%) together each month?", "a": "FICA $344.25 + Illinois $222.75 = <b>$567 a month</b>."};
const VALUES = [100, 200, 300, 400, 500];
const KEY = "midterm-showdown-v2";
const $ = id => document.getElementById(id);
let S;

function fresh(n = 4) { return { teams: Array.from({ length: n }, (_, i) => ({ name: "Team " + (i + 1), pts: 0 })), used: [], dbl: [Math.floor(Math.random() * 5), 2 + Math.floor(Math.random() * 3)] }; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function load() { try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.teams) return v; } catch {} return fresh(); }
S = load();

function drawBoard() {
  let h = CATS.map(c => `<div class="cat"><b>${c.name}</b><small>${c.unit}</small></div>`).join("");
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    const id = c + "-" + r, used = S.used.includes(id);
    h += `<button class="cell" data-c="${c}" data-r="${r}" ${used ? "disabled aria-label='used'" : `aria-label="${CATS[c].name} for ${VALUES[r]}"`}>${VALUES[r]}</button>`;
  }
  $("board").innerHTML = h;
  $("board").querySelectorAll(".cell:not(:disabled)").forEach(b => b.onclick = () => openClue(+b.dataset.c, +b.dataset.r));
}
function drawTeams() {
  const max = Math.max(...S.teams.map(t => t.pts));
  $("teams").innerHTML = S.teams.map((t, i) => `<div class="team ${t.pts === max && max > 0 ? "lead" : ""}">
    <div class="name" contenteditable="true" spellcheck="false" data-i="${i}">${t.name.replace(/</g, "&lt;")}</div>
    <div class="pts">${t.pts.toLocaleString()}</div>
    <div class="adj"><button data-i="${i}" data-d="-100">−100</button><button data-i="${i}" data-d="100">+100</button></div></div>`).join("");
  $("teams").querySelectorAll(".name").forEach(el => {
    el.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } });
    el.addEventListener("blur", () => { S.teams[+el.dataset.i].name = el.textContent.trim().slice(0, 24) || "Team " + (+el.dataset.i + 1); save(); drawTeams(); });
  });
  $("teams").querySelectorAll(".adj button").forEach(b => b.onclick = () => { S.teams[+b.dataset.i].pts += +b.dataset.d; save(); drawTeams(); });
}

function openClue(c, r) {
  const isDbl = S.dbl[0] === c && S.dbl[1] === r, val = VALUES[r] * (isDbl ? 2 : 1);
  const [q, a] = CATS[c].qs[r], marks = {};
  const body = () => `
    ${isDbl ? `<div class="double">DOUBLE POINTS!</div>` : ""}
    <div class="meta"><span>${CATS[c].name} · ${CATS[c].unit}</span><span>${val} points</span></div>
    <div class="q">${q}</div>
    <div class="a" id="ansBox" hidden>${a}</div>
    <div class="award" id="award" hidden>${S.teams.map((t, i) => `<div class="t"><span>${t.name.replace(/</g, "&lt;")}</span><button class="y" data-i="${i}" data-v="1" aria-label="${t.name} correct">✓</button><button class="n" data-i="${i}" data-v="-1" aria-label="${t.name} wrong">✗</button></div>`).join("")}</div>
    <div class="row"><button class="primary" id="showA">Show answer</button><button class="primary" id="done" hidden>Back to board</button><span style="flex:1"></span><button class="ghost" id="cancel">Close without scoring</button></div>
    <p class="muted" id="awardHelp" hidden style="margin:0;font-size:15px">✓ adds ${val} · ✗ is 0 (or click ✗ twice to subtract ${val}, for buzz-in games).</p>`;
  $("clue").innerHTML = body(); $("ov").hidden = false; $("showA").focus();
  $("showA").onclick = () => { $("ansBox").hidden = false; $("award").hidden = false; $("awardHelp").hidden = false; $("showA").hidden = true; $("done").hidden = false; };
  $("award").querySelectorAll("button").forEach(b => b.onclick = () => {
    // states: "none" 0 pts · "right" +val · "wrong" 0 pts · "minus" −val
    const i = +b.dataset.i, v = +b.dataset.v, prev = marks[i] || "none";
    const next = v === 1 ? (prev === "right" ? "none" : "right") : (prev === "wrong" ? "minus" : prev === "minus" ? "none" : "wrong");
    const pts = s => s === "right" ? val : s === "minus" ? -val : 0;
    S.teams[i].pts += pts(next) - pts(prev);
    marks[i] = next;
    const row = b.parentElement.querySelectorAll("button");
    row[0].classList.toggle("on", next === "right"); row[1].classList.toggle("on", next === "wrong" || next === "minus");
    row[1].textContent = next === "minus" ? "−" + val : "✗";
    row[1].style.width = next === "minus" ? "auto" : "";
    save(); drawTeams();
  });
  const close = used => { $("ov").hidden = true; if (used) { S.used.push(c + "-" + r); save(); drawBoard(); } };
  $("done").onclick = () => close(true);
  $("cancel").onclick = () => close(false);
}

function openFinal() {
  $("clue").innerHTML = `<div class="meta"><span>Final Round · All units</span><span>Wager up to your score</span></div>
    <div class="q" style="font-size:clamp(22px,2.6vw,32px)">Category: <span style="color:var(--gold)">Paycheck → Savings → Retirement</span>. Each team writes a secret wager first.</div>
    <div class="wager">${S.teams.map((t, i) => `<label for="w${i}">${t.name.replace(/</g, "&lt;")} wager<input id="w${i}" type="number" min="0" max="${Math.max(t.pts, 0)}" value="0"></label>`).join("")}</div>
    <div class="row"><button class="primary" id="showQ">Show the question</button><span style="flex:1"></span><button class="ghost" id="cancel">Back to board</button></div>
    <div class="q" id="fq" hidden>${FINAL.q}</div>
    <div class="a" id="fa" hidden>${FINAL.a}</div>
    <div class="award" id="faward" hidden>${S.teams.map((t, i) => `<div class="t"><span>${t.name.replace(/</g, "&lt;")}</span><button class="y" data-i="${i}" data-v="1">✓</button><button class="n" data-i="${i}" data-v="-1">✗</button></div>`).join("")}</div>
    <div class="row"><button class="primary" id="showFA" hidden>Show answer</button><button class="primary" id="fdone" hidden>See final scores</button></div>`;
  $("ov").hidden = false;
  $("cancel").onclick = () => $("ov").hidden = true;
  $("showQ").onclick = () => { $("fq").hidden = false; $("showQ").hidden = true; $("showFA").hidden = false; };
  $("showFA").onclick = () => { $("fa").hidden = false; $("faward").hidden = false; $("showFA").hidden = true; $("fdone").hidden = false; };
  const done = new Set();
  $("faward").querySelectorAll("button").forEach(b => b.onclick = () => {
    const i = +b.dataset.i; if (done.has(i)) return; done.add(i);
    const w = Math.max(0, Math.min(+$("w" + i).value || 0, Math.max(S.teams[i].pts, 0)));
    S.teams[i].pts += w * +b.dataset.v; b.classList.add("on"); save(); drawTeams();
  });
  $("fdone").onclick = () => {
    const ranked = S.teams.map(t => t).sort((a, b) => b.pts - a.pts);
    $("clue").innerHTML = `<div class="meta"><span>Final scores</span><span>#FutureMillionaires</span></div>
      <div class="q">${ranked[0].name.replace(/</g, "&lt;")} wins with ${ranked[0].pts.toLocaleString()} points!</div>
      <ol style="font-size:22px;line-height:1.6;margin:0">${ranked.map(t => `<li>${t.name.replace(/</g, "&lt;")} — <span style="font-family:var(--mono)">${t.pts.toLocaleString()}</span></li>`).join("")}</ol>
      <div class="row"><button class="primary" id="closeEnd">Close</button></div>`;
    $("closeEnd").onclick = () => $("ov").hidden = true;
  };
}

$("finalBtn").onclick = openFinal;
$("addTeam").onclick = () => { if (S.teams.length < 6) { S.teams.push({ name: "Team " + (S.teams.length + 1), pts: 0 }); save(); drawTeams(); } };
$("rmTeam").onclick = () => { if (S.teams.length > 2) { S.teams.pop(); save(); drawTeams(); } };
let armed = false;
$("resetBtn").onclick = () => {
  if (!armed) { armed = true; $("resetBtn").textContent = "Click again to clear"; setTimeout(() => { armed = false; $("resetBtn").textContent = "New game"; }, 3000); return; }
  armed = false; $("resetBtn").textContent = "New game"; S = fresh(S.teams.length); save(); drawBoard(); drawTeams();
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("ov").hidden) $("ov").hidden = true; });
drawBoard(); drawTeams();
</script>

<script src="/fm-home.js" defer></script>
</body></html>
