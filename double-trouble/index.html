<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: question card on the left; a "doubling timeline" statement on the right shows the debt stacking up after each answer. Stacks on narrow screens.
   Arcade palette: navy + gold + money green, with a warning red for debt. */
:root {
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6780; --line:#CBD3DF;
  --paper:#FFFDF6; --paper-line:#D9D2BC; --stamp:#0F8B6C; --stamp-soft:#DDF1EA;
  --gold:#E0A800; --bad:#C23B3B; --bad-soft:#FBE7E7; --hero:#14213D; --hero-ink:#F3F5F8; --debt:#C23B3B; --save:#0F8B6C;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0D1424; --surface:#16203A; --ink:#E8EDF5; --muted:#93A0B8; --line:#2A3A5E;
  --paper:#1B2540; --paper-line:#3A4870; --stamp:#3CCB9F; --stamp-soft:#123A32;
  --gold:#F5C542; --bad:#F07070; --bad-soft:#3A1C24; --hero:#101A30; --debt:#F07070; --save:#3CCB9F; color-scheme:dark } }
:root[data-theme="dark"] {
  --bg:#0D1424; --surface:#16203A; --ink:#E8EDF5; --muted:#93A0B8; --line:#2A3A5E;
  --paper:#1B2540; --paper-line:#3A4870; --stamp:#3CCB9F; --stamp-soft:#123A32;
  --gold:#F5C542; --bad:#F07070; --bad-soft:#3A1C24; --hero:#101A30; --debt:#F07070; --save:#3CCB9F; color-scheme:dark }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden] { display:none !important; }
body { background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; margin:0; }
.bar { background:var(--hero); color:var(--hero-ink); }
.bar .inner { max-width:1180px; margin:0 auto; padding-block:14px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; justify-content:space-between; }
.bar h1 { font-family:var(--display); font-weight:800; font-size:clamp(24px, 3.4vw, 34px); margin:0; line-height:1; }
.bar h1 span { color:var(--gold); }
.bar .stats { display:flex; gap:16px; font-family:var(--mono); font-size:15px; align-items:center; flex-wrap:wrap; }
.bar .stats b { color:var(--gold); }
.wrap { max-width:1180px; margin:0 auto; padding-block:20px 40px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.game { display:grid; grid-template-columns:minmax(0, 1.15fr) minmax(0, 1fr); gap:20px; align-items:start; }
@media (max-width:820px) { .game { grid-template-columns:minmax(0,1fr); } }
.work, .panel { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:clamp(18px, 3vw, 30px); display:grid; gap:16px; min-width:0; }
.progress { height:8px; background:var(--line); border-radius:99px; overflow:hidden; }
.progress i { display:block; height:100%; background:var(--debt); transition:width .3s; }
.eyebrow { font-family:var(--mono); font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.prompt { font-family:var(--display); font-weight:600; font-size:clamp(22px, 3vw, 30px); line-height:1.22; margin:0; text-wrap:balance; }
.formula { font-family:var(--mono); font-size:15px; background:var(--bg); border-radius:10px; padding:10px 12px; line-height:1.5; overflow-wrap:anywhere; }
.answer-row { display:flex; gap:10px; flex-wrap:wrap; }
.field { flex:1 1 200px; display:flex; align-items:center; border:2px solid var(--line); border-radius:12px; background:var(--bg); padding:0 12px; min-width:0; }
.field:focus-within { border-color:var(--gold); }
.field span { font-family:var(--mono); font-size:22px; color:var(--muted); white-space:nowrap; }
.field input { flex:1; min-width:0; width:100%; border:none; background:transparent; color:var(--ink); font-family:var(--mono); font-size:26px; padding:12px 8px; outline:none; }
.btn { font:inherit; font-weight:700; padding:12px 20px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; min-height:48px; }
.btn.go { background:var(--stamp); color:#fff; border-color:var(--stamp); }
.btn.gold { background:var(--gold); color:#14213D; border-color:var(--gold); }
.bar .btn { color:var(--hero-ink); background:transparent; border-color:rgba(255,255,255,.3); min-height:40px; padding:8px 14px; }
.field input:focus-visible { outline:none; }
.btn:focus-visible, .choice:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
.choices { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px; }
.choice { font:inherit; text-align:left; padding:14px; border-radius:14px; border:2px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; display:grid; gap:4px; min-height:64px; }
.choice:hover:not(:disabled) { border-color:var(--gold); }
.choice b { font-family:var(--display); font-size:19px; }
.choice .r { font-family:var(--mono); font-size:22px; color:var(--debt); font-weight:600; }
.choice .s { font-size:14px; color:var(--muted); }
.choice.right { border-color:var(--stamp); background:var(--stamp-soft); }
.choice.wrong { border-color:var(--bad); background:var(--bad-soft); }
.choice:disabled { cursor:default; }
.fb { border-radius:12px; padding:12px 14px; line-height:1.45; }
.fb.ok { background:var(--stamp-soft); } .fb.no { background:var(--bad-soft); }
.fb b { font-family:var(--display); }
.fb .steps { font-family:var(--mono); font-size:15px; margin-top:6px; }
.tip { color:var(--muted); font-size:15px; margin:0; }

/* statement / timeline */
.stmt { background:var(--paper); border:1px solid var(--paper-line); border-radius:6px; padding:18px 18px 20px; font-family:var(--mono); font-size:14px; position:relative; min-width:0; box-shadow:0 8px 22px rgba(20,33,61,.08); display:grid; gap:12px; }
.stmt::before { content:""; position:absolute; left:0; right:0; top:-1px; height:8px; background:radial-gradient(circle at 6px 0, var(--bg) 4px, transparent 4.5px) 0 0/12px 8px repeat-x; }
.stmt .co { color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
.stmt h2 { font-family:var(--display); font-size:21px; margin:0; }
.rule { font-family:var(--display); font-weight:800; font-size:clamp(30px, 4vw, 40px); line-height:1.05; }
.rule em { font-style:normal; color:var(--gold); }
.tl { display:grid; gap:6px; }
.tl .row { display:grid; grid-template-columns:4.6em minmax(0,1fr) auto; gap:8px; align-items:center; font-variant-numeric:tabular-nums; }
.tl .yr { color:var(--muted); font-size:13px; }
.tl .track { height:22px; background:var(--bg); border-radius:6px; overflow:hidden; }
.tl .fill { height:100%; background:var(--debt); border-radius:6px; transform-origin:left; animation:grow .5s ease-out both; }
.tl .fill.save { background:var(--save); }
.tl .amt { font-weight:600; min-width:6.5em; text-align:right; }
.tl .amt.debt { color:var(--debt); } .tl .amt.save { color:var(--save); }
.tl .lbl { font-size:12px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:6px; }
@keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
.note { color:var(--muted); font-size:13px; line-height:1.45; margin:0; font-family:var(--body); }
.cheat { display:grid; grid-template-columns:repeat(auto-fit, minmax(110px,1fr)); gap:8px; }
.cheat div { background:var(--bg); border-radius:8px; padding:8px 10px; }
.cheat b { display:block; font-size:18px; color:var(--debt); }

.panel h2 { font-family:var(--display); font-weight:800; font-size:clamp(28px, 4vw, 44px); margin:0; line-height:1.05; text-wrap:balance; }
.panel p { margin:0; line-height:1.45; max-width:65ch; }
.big { font-family:var(--display); font-weight:800; font-size:clamp(40px, 7vw, 72px); line-height:1; color:var(--stamp); font-variant-numeric:tabular-nums; }
.skills { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; }
.skill { border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--bg); display:grid; gap:4px; }
.skill .n { font-size:14px; color:var(--muted); }
.chip { justify-self:start; font-size:13px; font-weight:700; padding:2px 10px; border-radius:99px; border:1px solid currentColor; }
.chip.g { color:var(--stamp); } .chip.a { color:var(--gold); } .chip.s { color:var(--bad); }
.review { margin:0; padding-left:20px; line-height:1.5; }
.btnrow { display:flex; flex-wrap:wrap; gap:10px; }
@media (prefers-reduced-motion: reduce) { .progress i { transition:none; } .tl .fill { animation:none; } }
</style>

<header class="bar"><div class="inner">
  <h1>Double <span>Trouble</span></h1>
  <div class="stats" id="stats"></div>
</div></header>
<div class="wrap" id="root"></div>

<script src="/fm-roster.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b,st=1)=>a+st*Math.floor(Math.random()*(Math.floor((b-a)/st)+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const usd=x=>"$"+x.toLocaleString("en-US",{minimumFractionDigits:x%1?2:0,maximumFractionDigits:2});
const num=s=>{s=String(s).replace(/[$,%\s]|years?|yrs?|months?|times?/gi,"");return s===""||isNaN(s)?NaN:+s;};
const NAMES=window.fmNames?fmNames(12,["Jordan","Maya","Leo","Amara","Diego","Priya","Owen","Zoe","Mateo","Lena","Kai","Ruby"]):["Jordan","Maya","Leo","Amara","Diego","Priya","Owen","Zoe","Mateo","Lena","Kai","Ruby"];
// Rates that divide 72 evenly, so every answer is a whole number
const CARD_RATES=[12,18,24,36]; // years 6,4,3,2

const SKILLS={years:"Years to double", rate:"Find the rate", grow:"Debt after years", count:"Count the doublings", worst:"Pay this first", payday:"Payday loans", vs:"Saving vs. owing", idea:"Big idea"};

/* Each round: {skill, prompt, formula, unit:{pre,post}, answer, tol, steps, miss:[[value,msg]], tl:{...} } or a choice round {choices,correct} */
const GEN={
  years(){ const n=pick(NAMES), r=pick(CARD_RATES), d=72/r, bal=rnd(600,2400,100);
    return {skill:"years", prompt:`${n} has a ${usd(bal)} credit card balance at ${r}% interest and stops making payments. About how many years until the debt doubles to ${usd(bal*2)}?`,
      formula:`Years to double = 72 ÷ interest rate`, unit:{pre:"",post:"years"}, answer:d, tol:.05,
      steps:`72 ÷ ${r} = ${d} years`, miss:[[r/72,"Flip it: 72 ÷ rate, not rate ÷ 72."],[72*r,"Divide 72 by the rate — don't multiply."],[100/r,"Use 72, not 100."]],
      tl:{p:bal, r, d, n:Math.min(3,Math.floor(12/d))} }; },
  rate(){ const d=pick([3,4,6,8]), r=72/d, n=pick(NAMES);
    return {skill:"rate", prompt:`${n}'s unpaid debt doubled in ${d} years. Using the Rule of 72, about what interest rate was ${n} paying?`,
      formula:`Rate = 72 ÷ years to double`, unit:{pre:"",post:"%"}, answer:r, tol:.05,
      steps:`72 ÷ ${d} = ${r}%`, miss:[[d/72*100,"Use 72 ÷ years. The answer is a percent like 18%."],[72*d,"Divide 72 by the years — don't multiply."],[d*2,"The rule is 72 ÷ years."]],
      tl:{p:1000, r, d, n:Math.min(3,Math.floor(12/d))} }; },
  grow(){ const r=pick([18,24,36]), d=72/r, k=pick([2,3]), yrs=d*k, p=rnd(500,2000,250), ans=p*2**k, n=pick(NAMES);
    return {skill:"grow", prompt:`${n} owes ${usd(p)} on a card at ${r}% and makes no payments for ${yrs} years. Using the Rule of 72, about how much will ${n} owe?`,
      formula:`1) 72 ÷ ${r} = years per double · 2) ${yrs} years ÷ that = number of doubles · 3) double the debt that many times`,
      unit:{pre:"$",post:""}, answer:ans, tol:1,
      steps:`72 ÷ ${r} = ${d} years per double · ${yrs} ÷ ${d} = ${k} doubles · ${usd(p)} → ${Array.from({length:k},(_,i)=>usd(p*2**(i+1))).join(" → ")}`,
      miss:[[p*2,"That's only one double. Count how many times it doubles in "+yrs+" years."],[p*2*k,"Doubling twice isn't ×4 by adding — each double is twice the last balance."],[p*(k+1),"Debt doesn't grow by the same amount each time. Each double is twice the last balance."],[p*2**(k+1),"One double too many. Count: "+yrs+" ÷ "+d+" = "+k+"."],[p*2**(k-1),"One double too few. Count: "+yrs+" ÷ "+d+" = "+k+"."]],
      tl:{p, r, d, n:k} }; },
  count(){ const r=pick([12,18,24]), d=72/r, yrs=d*pick([2,3,4]);
    return {skill:"count", prompt:`A debt at ${r}% sits unpaid for ${yrs} years. How many times does it double?`,
      formula:`Years ÷ (72 ÷ rate)`, unit:{pre:"",post:"times"}, answer:yrs/d, tol:.05,
      steps:`72 ÷ ${r} = ${d} years per double · ${yrs} ÷ ${d} = ${yrs/d} doubles`, miss:[[d,"That's the years per double. Now divide the "+yrs+" years by it."],[yrs/r,"First find years per double: 72 ÷ "+r+"."]],
      tl:{p:1000, r, d, n:yrs/d} }; },
  worst(){ const opts=shuffle([
      {b:"Store credit card", r:pick([24,27,30]), s:"Retail card"},
      {b:"Car loan", r:pick([6,8]), s:"Installment loan"},
      {b:"Private student loan", r:pick([9,12]), s:"Paying for school"}]);
    const worstI=opts.reduce((m,o,i)=>o.r>opts[m].r?i:m,0);
    return {skill:"worst", type:"choice", prompt:`You have extra money to pay toward ONE debt. Which debt doubles the fastest if you ignore it — and should get paid first?`,
      choices:opts.map(o=>({h:`<b>${o.b}</b><span class="r">${o.r}%</span><span class="s">${o.s}</span>`, after:`72 ÷ ${o.r} ≈ ${r2(72/o.r)} yrs`})), correct:worstI,
      steps:opts.map(o=>`${o.b}: 72 ÷ ${o.r} ≈ ${r2(72/o.r)} years`).join(" · ")+` → the highest rate doubles fastest.`,
      tl:{cmp:opts.map(o=>({lbl:o.b, r:o.r}))} }; },
  payday(){ const apr=pick([300,360,400]), yrs=72/apr, mo=r2(yrs*12);
    return {skill:"payday", prompt:`Payday loans can charge about ${apr}% APR. Using the Rule of 72, about how many MONTHS until that debt doubles? (Round to one decimal.)`,
      formula:`72 ÷ ${apr} = years · then × 12 = months`, unit:{pre:"",post:"months"}, answer:mo, tol:.15,
      steps:`72 ÷ ${apr} = ${r2(yrs)} years · ${r2(yrs)} × 12 = ${mo} months`, miss:[[r2(yrs),"That's in years. Multiply by 12 to get months."],[r2(72/apr*52),"That's weeks. Multiply years by 12 for months."]],
      tl:{p:500, r:apr, d:yrs, n:3, months:true} }; },
  vs(){ const sr=pick([6,8]), sd=72/sr, dr=sr*3, dd=72/dr, yrs=sd*2, p=1000, owe=p*2**(yrs/dd), save=p*2**(yrs/sd);
    return {skill:"vs", prompt:`Same $1,000, same ${yrs} years. Saved at ${sr}% it doubles every ${sd} years. Owed on a card at ${dr}%, how much will you OWE after ${yrs} years?`,
      formula:`72 ÷ ${dr} = years per double · ${yrs} ÷ that = doubles`, unit:{pre:"$",post:""}, answer:owe, tol:1,
      steps:`72 ÷ ${dr} = ${dd} years · ${yrs} ÷ ${dd} = ${yrs/dd} doubles · $1,000 → ${usd(owe)}. Your savings only reached ${usd(save)}.`,
      miss:[[save,"That's what the SAVINGS grow to. The card at "+dr+"% doubles much faster."],[p*2,"That's only one double."],[p*(yrs/dd)*2,"Each double is twice the last balance — keep doubling."]],
      tl:{vs:{p, sr, sd, dr, dd, yrs}} }; },
  idea(){ const q=pick([
      {p:"True or false: the Rule of 72 only works for savings and investing.", c:["True","False"], k:1, s:"False. It works for anything growing at a compound rate — including debt. When you owe, it tells you how fast your balance doubles against you."},
      {p:"A higher interest rate on a debt means it doubles…", c:["Faster","Slower","At the same speed"], k:0, s:"Faster. 72 ÷ a bigger rate = fewer years. 36% doubles in 2 years; 12% takes 6."},
      {p:"What stops the Rule of 72 from working against you on a credit card?", c:["Paying the full balance every month","Paying only the minimum","Opening another card"], k:0, s:"Paying in full each month. No balance carried = no interest, so there's nothing to double."},
      {p:"Which money move has the Rule of 72 working FOR you?", c:["Investing in a 401(k) with an employer match","Carrying a credit card balance","Taking a payday loan"], k:0, s:"Investing. Your money doubles for you — and the match adds free money on top."}]);
    const order=shuffle(q.c.map((t,i)=>i));
    return {skill:"idea", type:"choice", prompt:q.p, choices:order.map(i=>({h:`<b>${esc(q.c[i])}</b>`})), correct:order.indexOf(q.k), steps:q.s, tl:{cheat:true}}; }
};
const PLAN=["years","years","rate","grow","grow","count","worst","payday","vs","idea"];

let S=null, best=0;
try{ best=+localStorage.getItem("double-trouble-best")||0; }catch(e){}

function stats(){
  const el=$("stats");
  if(!S||S.phase==="start"){ el.innerHTML=`<span>Unit 1 · Compounding works against you too</span>${best?`<span>Best <b>${best}</b></span>`:""}`; return; }
  el.innerHTML=`<span>Round <b>${Math.min(S.i+1,S.rounds.length)}</b>/${S.rounds.length}</span><span>Score <b>${S.score}</b></span>${S.phase==="play"?`<button class="btn" id="quit">Start over</button>`:""}`;
  $("quit")&&($("quit").onclick=start);
}

function start(){
  S={phase:"start"}; stats();
  $("root").innerHTML=`<div class="game">
    <section class="panel">
      <div class="eyebrow">Solo game · about 10 minutes</div>
      <h2>The Rule of 72 works for you when you save. It works <span style="color:var(--debt)">against</span> you when you owe.</h2>
      <p><b>72 ÷ interest rate ≈ years for money to double.</b> At 8%, savings double in about 9 years. But an unpaid credit card at 24% doubles in about 3 — and keeps going.</p>
      <p>Play 10 rounds. Every game has new numbers. First try = 10 points, second try = 5. Miss twice and you'll see the steps.</p>
      <div class="btnrow"><button class="btn go" id="go">Start</button></div>
    </section>
    ${cheatCard()}
  </div>`;
  $("go").onclick=begin;
}

function begin(){
  const order=[PLAN[0], ...shuffle(PLAN.slice(1))];
  S={phase:"play", rounds:order.map(k=>GEN[k]()), i:0, tries:0, score:0, locked:false, fb:null, bySkill:{}, review:[], picked:null};
  draw();
}

function cheatCard(){
  return `<aside class="stmt"><div class="co">The Rule of 72</div>
    <div class="rule"><em>72</em> ÷ rate = years to double</div>
    <div class="cheat">${[[6,"car loan"],[9,"private student loan"],[18,"credit card"],[24,"credit card"],[36,"high-rate card"]].map(([r,l])=>`<div>${r}% ${l}<b>${72/r} yrs</b></div>`).join("")}</div>
    <p class="note">Works backward too: 72 ÷ years to double = rate. It's an estimate, and it's least accurate at very high rates like payday loans.</p></aside>`;
}

function timeline(tl, reveal){
  if(!tl||tl.cheat) return cheatCard();
  if(tl.cmp){
    const max=Math.max(...tl.cmp.map(c=>72/c.r));
    return `<aside class="stmt"><div class="co">Which doubles first?</div><h2>Years to double each debt</h2>
      <div class="tl">${tl.cmp.map(c=>`<div class="row"><span class="yr">${c.r}%</span><div class="track"><div class="fill" style="width:${reveal?(72/c.r/max*100):0}%"></div></div><span class="amt debt">${reveal?r2(72/c.r)+" yrs":"?"}</span></div>`).join("")}</div>
      <p class="note">${reveal?"Shorter bar = doubles sooner = more dangerous. Pay the highest rate first.":"Answer to reveal how fast each one doubles."}</p></aside>`;
  }
  if(tl.vs){
    const {p,sr,sd,dr,dd,yrs}=tl.vs, pts=[]; for(let y=0;y<=yrs;y+=dd) pts.push(y);
    const owe=y=>p*2**(y/dd), save=y=>p*2**(y/sd), max=owe(yrs);
    return `<aside class="stmt"><div class="co">Same $1,000 · ${yrs} years</div><h2>Saving at ${sr}% vs. owing at ${dr}%</h2>
      <div class="tl"><div class="lbl">Owed on a card (${dr}%)</div>${(reveal?pts:[0]).map(y=>`<div class="row"><span class="yr">Year ${y}</span><div class="track"><div class="fill" style="width:${(reveal||y===0)?Math.max(2,owe(y)/max*100):0}%"></div></div><span class="amt debt">${(reveal||y===0)?usd(owe(y)):"?"}</span></div>`).join("")}
      <div class="lbl">Saved (${sr}%)</div>${[0,sd,yrs].map(y=>`<div class="row"><span class="yr">Year ${y}</span><div class="track"><div class="fill save" style="width:${Math.max(2,save(y)/max*100)}%"></div></div><span class="amt save">${usd(save(y))}</span></div>`).join("")}</div></aside>`;
  }
  const {p,r,d,n,months}=tl, rows=[];
  for(let k=0;k<=n;k++) rows.push({t:k*d, v:p*2**k});
  const max=rows[rows.length-1].v, lab=t=>months?(t===0?"Today":r2(t*12)+" mo"):(t===0?"Today":"Year "+r2(t));
  return `<aside class="stmt"><div class="co">Unpaid balance · ${r}% interest</div><h2>${reveal?`Doubles every ${months?r2(d*12)+" months":r2(d)+" years"}`:"How fast does it double?"}</h2>
    <div class="tl">${(reveal?rows:rows.slice(0,1)).map((x,k)=>`<div class="row"><span class="yr">${reveal||k===0?lab(x.t):"?"}</span><div class="track"><div class="fill" style="width:${reveal||k===0?Math.max(2,x.v/max*100):0}%"></div></div><span class="amt debt">${reveal||k===0?usd(x.v):"?"}</span></div>`).join("")}</div>
    <p class="note">${reveal?"Each bar is twice the one before it. That's compound interest working against you.":"Answer to see the balance grow."}</p></aside>`;
}

function draw(){
  stats();
  if(S.phase==="start") return start();
  if(S.phase==="end") return end();
  const q=S.rounds[S.i], n=S.rounds.length;
  let fb="";
  if(S.fb){ const f=S.fb;
    fb= f.t==="ok" ? `<div class="fb ok" role="status"><b>+${f.pts} points.</b><div class="steps">${esc(q.steps)}</div></div>`
      : f.t==="retry" ? `<div class="fb no" role="status"><b>Not quite.</b> ${esc(f.msg)} Try once more.</div>`
      : `<div class="fb no" role="status"><b>Here's how it works.</b> ${f.msg?esc(f.msg):""}<div class="steps">${esc(q.steps)}</div></div>`; }
  let input;
  if(q.type==="choice"){
    input=`<div class="choices">${q.choices.map((c,i)=>{
      const cls=S.locked?(i===q.correct?"right":(S.picked&&S.picked.includes(i)?"wrong":"")):(S.picked&&S.picked.includes(i)?"wrong":"");
      return `<button class="choice ${cls}" data-i="${i}" ${S.locked||(S.picked&&S.picked.includes(i))?"disabled":""}>${c.h}${S.locked&&c.after?`<span class="s">${c.after}</span>`:""}</button>`;}).join("")}</div>
      ${S.locked?`<div class="btnrow"><button class="btn go" id="next">${S.i+1<n?"Next round":"See results"}</button></div>`:""}`;
  } else {
    input=`<div class="formula">${esc(q.formula)}</div>
      <form id="ansForm" class="answer-row" novalidate>
        <label class="field" for="ans">${q.unit.pre?`<span>${q.unit.pre}</span>`:""}<input id="ans" inputmode="decimal" autocomplete="off" aria-label="Your answer" ${S.locked?"disabled":""}>${q.unit.post?`<span>${q.unit.post}</span>`:""}</label>
        ${S.locked?`<button class="btn go" id="next" type="button">${S.i+1<n?"Next round":"See results"}</button>`:`<button class="btn go" type="submit">Check</button>`}
      </form>`;
  }
  $("root").innerHTML=`<div class="game">
    <section class="work" aria-live="polite">
      <div class="progress" aria-hidden="true"><i style="width:${S.i/n*100}%"></i></div>
      <div class="eyebrow">Round ${S.i+1} of ${n} · ${SKILLS[q.skill]}</div>
      <p class="prompt">${esc(q.prompt)}</p>
      ${input}
      ${fb}
      ${q.type==="choice"?"":`<p class="tip">Type a number. Units and commas are fine.</p>`}
    </section>
    ${timeline(q.tl, S.locked)}
  </div>`;
  if(S.locked){ $("next").onclick=advance; $("next").focus({preventScroll:true}); return; }
  if(q.type==="choice") document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  else { const a=$("ans"); a.focus({preventScroll:true}); $("ansForm").onsubmit=e=>{e.preventDefault(); check(a.value);}; }
}

function record(ok){ const k=S.rounds[S.i].skill, s=S.bySkill[k]||(S.bySkill[k]=[0,0]); s[1]++; if(ok) s[0]++; }
function win(){ const pts=S.tries===0?10:5; S.score+=pts; record(S.tries===0); S.fb={t:"ok",pts}; S.locked=true; draw(); }
function lose(msg){ S.tries++; if(S.tries<2){ S.fb={t:"retry",msg}; return draw(); }
  record(false); S.review.push(SKILLS[S.rounds[S.i].skill]+": "+S.rounds[S.i].steps); S.fb={t:"show",msg:""}; S.locked=true; draw(); }

function choose(i){ const q=S.rounds[S.i]; S.picked=S.picked||[];
  if(i===q.correct) return win();
  S.picked.push(i); const left=q.choices.length-S.picked.length;
  if(left<=1){ S.tries=1; return lose(""); }
  lose(q.skill==="worst"?"Find which one doubles in the fewest years: 72 ÷ rate.":"Think about which way interest is working.");
}
function check(raw){ const q=S.rounds[S.i], v=num(raw);
  if(isNaN(v)){ S.fb={t:"retry",msg:"Type a number, like 4 or 3200."}; return draw(); }
  if(Math.abs(v-q.answer)<=q.tol) return win();
  const hit=q.miss.find(([x])=>Math.abs(v-r2(x))<=Math.max(.02,q.tol) && Math.abs(r2(x)-q.answer)>q.tol);
  lose(hit?hit[1]:"Check your math against the formula.");
}
function advance(){ S.i++; S.tries=0; S.fb=null; S.locked=false; S.picked=null;
  if(S.i>=S.rounds.length){ S.phase="end"; if(S.score>best){ best=S.score; try{ localStorage.setItem("double-trouble-best",best); }catch(e){} } }
  draw(); }

function end(){
  const max=S.rounds.length*10;
  const groups=[["years","rate","count"],["grow","vs","payday"],["worst","idea"]];
  const gNames=["Use the Rule of 72","Watch debt grow","Make the smart move"];
  const cards=groups.map((g,i)=>{ let c=0,t=0; g.forEach(k=>{ if(S.bySkill[k]){ c+=S.bySkill[k][0]; t+=S.bySkill[k][1]; } });
    const p=t?c/t:1, chip=p>=.8?`<span class="chip g">Got it</span>`:p>=.6?`<span class="chip a">Almost</span>`:`<span class="chip s">Study this</span>`;
    return `<div class="skill"><span class="n">${gNames[i]}</span><b>${c}/${t} first try</b>${chip}</div>`; }).join("");
  $("root").innerHTML=`<div class="game">
    <section class="panel">
      <div class="eyebrow">Game over · ${S.score} of ${max} points${S.score>=best&&S.score>0?" · new best!":""}</div>
      <h2>${S.score>=90?"Debt-proof!":S.score>=70?"Nice work — you see the trap.":"Keep practicing the 72 ÷ rate move."}</h2>
      <div class="big">${S.score}</div>
      <div class="skills">${cards}</div>
      <p><b>Remember:</b> the same math that grows a 401(k) grows a credit card balance. Pay cards in full every month, pay the highest rate first, and stay away from payday loans.</p>
      ${S.review.length?`<div><b>Write these in your notes:</b><ul class="review">${S.review.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`:`<p><b>Perfect game.</b> Every round right on the first try.</p>`}
      <div class="btnrow"><button class="btn go" id="again">Play again (new numbers)</button></div>
    </section>
    ${cheatCard()}
  </div>`;
  $("again").onclick=begin; stats();
}

function boot(d){ if(d&&d.S&&d.S.phase&&d.S.phase!=="start"){ S=d.S; draw(); } else start(); }
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
