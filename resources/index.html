<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

--good:#6CCB8A;--good-bg:#17301F;--bad:#F09A72;--bad-bg:#3A1F18;--warn:#F5C542;--warn-bg:#3A3015;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B111D;--surface:#151E33;--ink:#E8EDF5;--muted:#97A3B9;--line:#26334F;--hero:#101A30;--gold:#F5C542;--money:#3CCB9F;--money-ink:#06261D;--good:#6CCB8A;--good-bg:#17301F;--bad:#F09A72;--bad-bg:#3A1F18;--warn:#F5C542;--warn-bg:#3A3015;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.top{background:var(--hero);color:var(--hero-ink)}
.top .in{max-width:980px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.eyebrow{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,44px);line-height:1;margin:4px 0 0}

.top nav a{color:var(--hero-ink);text-decoration:none;border:1px solid rgba(255,255,255,.3);padding:8px 12px;border-radius:10px;font-weight:700;font-size:15px}
main{max-width:980px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}

<main>
<section class="panel"><h2>Videos, calculators and trusted sites for every unit</h2>

<div id="list" style="display:grid;gap:16px"></div>

<script>
const FMP=(()=>{const K="fm-passport";
 function get(){try{const p=JSON.parse(localStorage.getItem(K));if(p&&p.s&&p.b)return p;}catch(e){}return {s:{},b:{},x:{}};}
 function save(p){try{localStorage.setItem(K,JSON.stringify(p));}catch(e){}}
 return {get,
  stamp(slug,score){const p=get();const s=p.s[slug]||{n:0,best:null};s.n++;if(score!=null&&(s.best==null||score>s.best))s.best=score;s.t=Date.now();p.s[slug]=s;save(p);},
  badge(id,name){const p=get();if(p.b[id])return false;p.b[id]=Date.now();save(p);if(name)fmToast("🏅 Passport badge earned: "+name);return true;},
  count(key){const p=get();p.x=p.x||{};p.x[key]=(p.x[key]||0)+1;save(p);return p.x[key];}};})();
function fmToast(t){let el=document.getElementById("fmToast");if(!el){el=document.createElement("div");el.id="fmToast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}
 el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),3800);}

le ways to build a budget you'll actually stick to.", "Which budgeting method from the video would work best for you?"], ["Use", "MyBudgetCoach", "Free $0 plan · needs an account", "https://www.mybudgetcoach.com/", "The budget app from class. Only use the free plan, and never connect a real bank account for class.", "Build a zero-based budget: does income − expenses − savings = $0?"], ["Watch", "FinCap Friday", "Next Gen Personal Finance · 2-min videos", "https://www.ngpf.org/fincap-friday/", "Short weekly money stories with a quick quiz.", "Pick one and share the most surprising number."]]], ["u4", "Unit 4: Federal Taxes", [["Watch", "How Do Tax Brackets Actually Work?", "PBS Two Cents · 6m 34s", "https://www.pbs.org/video/how-do-tax-brackets-actually-work-uxonke/", "Why a raise into a higher bracket never lowers your take-home pay.", "Explain the 22% bracket myth in one sentence."], ["Use", "Tax Withholding Estimator", "IRS · free, no login", "https://www.irs.gov/individuals/tax-withholding-estimator", "Estimate your withholding and print a filled-in W-4.", "For a $40,000 job, does a big refund mean you're withholding too much?"], ["Read", "2026 Tax Brackets & Standard Deduction", "IRS news release", "https://www.irs.gov/newsroom/irs-releases-tax-inflation-adjustments-for-tax-year-2026-including-amendments-from-the-one-big-beautiful-bill", "The official 2026 numbers we use in class: $16,100 standard deduction (single).", "Find the top of the 12% bracket for a single filer."], ["Read", "About Form W-4", "IRS", "https://www.irs.gov/forms-pubs/about-form-w-4", "The form you fill out on your first day of work.", "What does the W-4 tell your employer?"], ["Use", "IRS Free File", "IRS · opens in January", "https://www.irs.gov/filing/irs-free-file-do-your-taxes-for-free", "File your own return free (guided software if income is $95,000 or less).", "When does filing season open, and when are taxes due?"]]], ["u5", "Unit 5: Banking", [["Watch", "Is the Savings Account Dead inance.gov/consumer-tools/credit-reports-and-scores/", "How to get your reports, fix errors and build credit.", "Name 2 ways to start building credit."], ["Use", "IdentityTheft.gov · FTC Scams", "FTC", "https://consumer.ftc.gov/scams", "Spot and report scams. If identity theft happens: identitytheft.gov.", "Name one red flag that a text is a scam."]]], ["u7", "Unit 7: Big Purchases: Housing & Cars", [["Watch", "How Cars Can Keep You Poor", "PBS Two Cents · 4m 35s", "https://www.pbs.org/video/how-cars-can-keep-you-poor-eymzdq/", "The true cost of owning a car, beyond the monthly payment.", "List 3 car costs besides the payment."], ["Watch", "Is It Okay to Rent?", "PBS Two Cents · 6m 13s", "https://www.pbs.org/video/is-it-okay-to-rent-lqnqed/", "Why renting isn't “throwing money away.”", "Give one reason to rent at 22 and one reason to buy later."], ["Use", "Kelley Blue Book", "kbb.com · free, has ads", "https://www.kbb.com/", "Look up fair prices for new and used cars.", "Find a used car under $15,000. What's the fair purchase price?"], ["Read", "Auto Loans", "CFPB", "https://www.consumerfinance.gov/consumer-tools/auto-loans/", "How to shop for a car loan, plus a loan comparison sheet.", "Why get pre-approved before the dealership?"], ["Read", "Buying a House", "CFPB", "https://www.consumerfinance.gov/owning-a-home/", "Step-by-step homebuying guide and checklists.", "What are the first 3 steps to buying a home?"], ["Use", "Explore Interest Rates", "CFPB · rate data from April 2025", "https://www.consumerfinance.gov/owning-a-home/explore-rates/", "See how your credit score and down payment change your mortgage rate.", "Compare a 650 vs. a 780 credit score. How much does the rate change?"]]], ["u8", "Unit 8: Insurance", [["Watch", "I'm Young & Healthy, Can I Skip Health Insurance?", "PBS Two Cents · 5m 27s", "https://www.pbs.org/video/im-young-healthy-can-i-skip-health-insurance-h5oetd/", "Why skipping coverage is a big risk.", "What's one expensive surprise health insurance protects you from?"], ["Watch", "10 Ways to Lower Your Car Insurance Premiums", "PBS Two Cents · 6m 37s", "https://www.pbs.org/video/10-ways-to-lower-your-car-insurance-premiums-nim8a3/", "What changes the price of car insurance.", "Pick 2 tips you could use as a new driver."], ["Read", "Health Insurance Glossary", "HealthCare.gov", "https://www.healthcare.gov/glossary/", "Premium, deductible, copay, coinsurance and out-of-pocket max, defined.", "Define deductible and out-of-pocket maximum in your own words."], ["Read", "Auto Insurance Shopping Guide", "Illinois Department of Insurance", "https://idoi.illinois.gov/consumers/consumerinsurance/auto-insurance-shopping-guide.html", "Coverage types and Illinois minimum liability limits (25/50/20).", "What do the numbers 25/50/20 mean?"], ["Read", "Consumer Insurance Help", "Illinois Department of Insurance", "https://idoi.illinois.gov/consumers/consumerinsurance.html", "Illinois guides for auto, health, renters and life insurance.", "What does renters insurance cover?"]]], ["u9", "Unit 9: Investing, Retirement & Estate Planning", [["Watch", "What the Heck Is an Index Fund?", "PBS Two Cents · 6m 16s", "https://www.pbs.org/video/what-the-heck-is-an-index-fund-nuh0mk/", "Why index funds are a simple, low-cost way to invest.", "Why do index funds usually have lower fees?"], ["Use", "Investment Calculator", "Calculator.net · free, has ads", "https://www.calculator.net/investment-calculator.html", "See contributions vs. growth year by year.", "How much of your final balance came from growth, not deposits?"], ["Use", "FINRA Fund Analyzer", "FINRA · free", "https://tools.finra.org/fund_analyzer/", "Compare the fees of real mutual funds and ETFs.", "Find an S&P 500 index fund. What's its expense ratio?"], ["Use", "Social Security Quick Calculator", "SSA · free", "https://www.ssa.gov/OACT/quickcalc/", "Estimate a future Social Security benefit.", "Is Social Security alone enough to live on? Why or why not?"], ["Use", "Build Your Stax", "NGPF · investing game", "https://www.buildyourstax.com/", "Grow a portfolio over 20 years and see how choices pay off.", "What strategy gave you the biggest balance?"], ["Read", "Introduction to Investing", "Investor.gov (SEC)", "https://www.investor.gov/introduction-investing", "Stocks, bonds, funds, diversification and retirement accounts.", "Explain diversification to a friend in one sentence."]]], ["u10", "Unit 10: Final Case Study & Posters", [["Read", "Classroom poster guide", "Our class · poster guide + rubric (PDF)", "/units/unit-10/", "Options, checklist, rubric and gallery-walk slips.", "Which poster option will you pick, and why?"], ["Use", "Occupational Outlook Handbook", "BLS", "https://www.bls.gov/ooh/", "Check your career's real salary for your plan.", "Does your plan's salary match the BLS median?"], ["Use", "Life at 22", "Future Millionaires Arcade", "/life-at-22/", "Build your monthly plan with live 30% and 50/30/20 checks.", "Is your rent under 30% of take-home pay?"], ["Use", "Compound Interest Calculator", "Investor.gov", "https://www.investor.gov/financial-tools-calculators/calculators/compound-interest-calculator", "Show what your monthly investing could grow to by 65.", "What will your plan's investing be worth at 65?"]]], ["all", "Anytime", [["Watch", "Two Cents (all episodes)", "PBS · free", "https://www.pbs.org/show/two-cents/", "Short, fun personal finance videos on almost every topic.", "Pick one episode and teach its big idea to a partner."], ["Watch", "Financial Literacy course", "Khan Academy · free", "https://www.khanacademy.org/college-careers-more/financial-literacy", "Lessons and practice on every unit.", "Do one practice set for the unit you're on."], ["Watch", "NGPF Video Library", "Next Gen Personal Finance", "https://www.ngpf.org/video-library/", "Short videos, many with built-in questions on Edpuzzle.", "Watch one and write down 2 new facts."]]]];

const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let f=(location.hash||"").slice(1)||"all-units";
function render(){
  $("chips").innerHTML=[["all-units","All units"],...D.map(u=>[u[0],u[1].split(":")[0]])].map(([k,n])=>`<button class="chip" data-f="${k}" aria-pressed="${k===f}">${esc(n)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{f=c.dataset.f;history.replaceState(null,"","#"+f);render();});
  $("list").innerHTML=D.filter(u=>f==="all-units"||u[0]===f||u[0]==="all").map(([k,name,items])=>`<section class="panel res" id="${k}"><h2>${esc(name)}</h2>${items.map(([kind,t,src,url,d,tr])=>`<div class="item"><span class="kind k-${kind}">${kind}</span><a href="${url}" target="_blank" rel="noopener">${esc(t)} ↗</a><span class="src">${esc(src)}</span><span>${esc(d)}</span><span class="try" style="grid-column:2"><b>Try this:</b> ${esc(tr)}</span></div>`).join("")}</section>`).join("");
}
window.addEventListener("hashchange",()=>{f=(location.hash||"").slice(1)||"all-units";render();});
render();
</script></body></html>
