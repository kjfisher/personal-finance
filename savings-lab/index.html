<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: a bank "offer card" on the left (CD terms, account rules, or a bank comparison chart); the work sheet on the right asks for each step. Choice questions use big tap buttons. */
:root {
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6780; --line:#CBD3DF;
  --hero:#14213D; --hero-ink:#F3F5F8; --gold:#E0A800; --ok:#0F8B6C; --ok-soft:#DDF1EA; --bad:#C23B3B; --bad-soft:#FBE7E7;
  --card:#E9F3EE; --card-line:#9CC3B0; --card-ink:#173B30; --punch:#0F6E54;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0D1424; --surface:#16203A; --ink:#E8EDF5; --muted:#93A0B8; --line:#2A3A5E;
  --hero:#101A30; --gold:#F5C542; --ok:#3CCB9F; --ok-soft:#123A32; --bad:#F07070; --bad-soft:#3A1C24;
  --card:#15302A; --card-line:#2F5A4D; --card-ink:#DDF1EA; --punch:#3CCB9F; color-scheme:dark } }
:root[data-theme="dark"] {
  --bg:#0D1424; --surface:#16203A; --ink:#E8EDF5; --muted:#93A0B8; --line:#2A3A5E;
  --hero:#101A30; --gold:#F5C542; --ok:#3CCB9F; --ok-soft:#123A32; --bad:#F07070; --bad-soft:#3A1C24;
  --card:#15302A; --card-line:#2F5A4D; --card-ink:#DDF1EA; --punch:#3CCB9F; color-scheme:dark }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden] { display:none !important; }
body { background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; margin:0; }
.bar { background:var(--hero); color:var(--hero-ink); }
.bar .inner { max-width:1180px; margin:0 auto; padding-block:14px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; justify-content:space-between; }
.bar h1 { font-family:var(--display); font-weight:800; font-size:clamp(24px, 3.4vw, 34px); margin:0; line-height:1; }
.bar h1 span { color:var(--gold); }
.bar .stats { display:flex; gap:16px; font-family:var(--mono); font-size:15px; flex-wrap:wrap; align-items:center; }
.bar .stats b { color:var(--gold); font-variant-numeric:tabular-nums; }
.wrap { max-width:1180px; margin:0 auto; padding-block:20px 40px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.game { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.1fr); gap:20px; align-items:start; }
@media (max-width:820px) { .game { grid-template-columns:1fr; } }
.progress { height:8px; background:var(--line); border-radius:99px; overflow:hidden; grid-column:1/-1; }
.progress i { display:block; height:100%; background:var(--ok); transition:width .3s; }
/* timecard */
.tc { background:var(--card); color:var(--card-ink); border:1px solid var(--card-line); border-radius:6px; padding:18px; font-family:var(--mono); font-size:15px; display:grid; gap:10px; min-width:0; position:relative; }
.tc .tag { font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.08em; padding:3px 10px; border-radius:99px; justify-self:start; background:var(--punch); color:var(--card); }
.choices { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px; }
.ch { font:inherit; font-weight:700; padding:10px 16px; border-radius:10px; border:2px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
.ch.sel { border-color:var(--gold); background:rgba(224,168,0,.16); }
.ch.right { border-color:var(--ok); background:var(--ok-soft); }
.ch:disabled { cursor:default; }
.field.wide { grid-template-columns:1fr; }
.tc::before { content:""; }
.tc .kind { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--punch); font-weight:600; }
.tc h2 { font-family:var(--display); font-size:24px; margin:0; line-height:1.1; color:var(--card-ink); }
.tc .who { display:flex; flex-wrap:wrap; gap:4px 16px; }
.tc .who b { font-weight:600; }
.tc table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
.tc th, .tc td { border-bottom:1px dashed var(--card-line); padding:5px 4px; text-align:left; }
.tc td:last-child, .tc th:last-child { text-align:right; }
.tc th { font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; }
.tc .stamp { color:var(--punch); font-weight:600; }
.tc .rule { border:1px solid var(--card-line); border-radius:6px; padding:8px 10px; font-size:14px; line-height:1.4; font-family:var(--body); }
.tc .story { font-family:var(--body); font-size:17px; line-height:1.45; }
/* answer sheet */
.sheet { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:clamp(16px, 2.6vw, 26px); display:grid; gap:12px; min-width:0; }
.sheet .eyebrow { font-family:var(--mono); font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.field { display:grid; grid-template-columns:minmax(0, 1fr) minmax(120px, 190px); gap:10px; align-items:center; padding:8px 10px; border-radius:12px; border:2px solid transparent; }
.field.ok { background:var(--ok-soft); border-color:var(--ok); }
.field.no { background:var(--bad-soft); border-color:var(--bad); }
.field.shown { background:var(--bad-soft); }
.field .q { line-height:1.3; }
.field .q small { display:block; color:var(--muted); font-family:var(--mono); font-size:13px; margin-top:2px; }
.field .msg { grid-column:1/-1; font-size:15px; line-height:1.35; }
.inp { display:flex; align-items:center; border:2px solid var(--line); border-radius:10px; background:var(--bg); padding:0 10px; min-width:0; }
.inp:focus-within { border-color:var(--gold); }
.inp span { font-family:var(--mono); color:var(--muted); }
.inp input { flex:1; min-width:0; border:none; background:transparent; color:var(--ink); font-family:var(--mono); font-size:20px; padding:9px 6px; outline:none; }
.inp input:disabled { color:var(--ink); }
.row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.btn { font:inherit; font-weight:700; padding:12px 20px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
.btn.go { background:var(--ok); color:#fff; border-color:var(--ok); }
.btn.gold { background:var(--gold); color:#14213D; border-color:var(--gold); }
.bar .btn { color:var(--hero-ink); background:transparent; border-color:rgba(255,255,255,.3); padding:8px 14px; }
.btn:focus-visible, input:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
.note { color:var(--muted); font-size:15px; margin:0; }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:clamp(18px, 3vw, 30px); display:grid; gap:14px; }
.panel h2 { font-family:var(--display); font-weight:800; font-size:clamp(28px, 4vw, 44px); margin:0; line-height:1.05; text-wrap:balance; }
.panel p { margin:0; line-height:1.45; max-width:65ch; }
.steps { margin:0; padding-left:22px; line-height:1.6; }
.big { font-family:var(--display); font-weight:800; font-size:clamp(40px, 7vw, 68px); line-height:1; color:var(--ok); font-variant-numeric:tabular-nums; }
.skills { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px; }
.skill { border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:4px; }
.skill b { font-family:var(--display); font-size:18px; }
.skill .v { font-family:var(--mono); font-size:15px; }
.pill { justify-self:start; font-size:13px; font-weight:700; padding:2px 10px; border-radius:99px; }
.pill.g { background:var(--ok-soft); color:var(--ok); } .pill.a { background:rgba(224,168,0,.18); color:var(--ink); } .pill.r { background:var(--bad-soft); color:var(--bad); }
@media (prefers-reduced-motion: reduce) { .progress i { transition:none; } }
</style>

<header class="bar"><div class="inner"><h1>Savings <span>Lab</span></h1><div class="stats" id="stats"></div></div></header>
<div class="wrap" id="root"></div>

<script>
const AVOID=["2500|2|2","5000|2.75|3","10000|3.5|4","15000|1.9|5","3000|3|3","3000|3|2","2500|4|2","10000|2|3","115000|2.5|2"];
const PRIN=[1200,1800,2400,4000,4500,6000,6500,8000,12000,20000];
const RATES=[1.5,2.25,2.5,3.25,3.5,4,4.25,4.5,5];
const NAMES=["Ava","Marcus","Lena","Theo","Imani","Jace","Rosa","Kai","Nora","Luis","Maddie","Ezra"];
const SKILL={cmp:"Compound interest", simp:"Simple interest", vs:"Simple vs. compound", pen:"Early withdrawal", fee:"Minimum balance fees", hysa:"HYSA vs. savings", acct:"Pick the account", bank:"Compare banks"};
const ACCTS=["Checking","Savings","HYSA","CD"];
const SCEN=[["deposit a paycheck and pay bills with a debit card","Checking","Checking is for everyday money: direct deposit, debit card, bills."],
 ["write a check to pay rent","Checking","You write checks from a checking account."],
 ["put away $5,000 they won't touch for 3 years at a locked-in rate","CD","A CD locks your money for a set term at a fixed rate."],
 ["lock in a guaranteed rate for 2 years, saving for a car they'll buy after graduation","CD","Money you won't need for a set time = CD."],
 ["keep an emergency fund that earns the most interest but can come out any time","HYSA","HYSAs pay much more than regular savings and you can withdraw any time. A CD would charge a penalty."],
 ["save for a trip in 6 months and earn as much interest as possible","HYSA","Short-term goal + most interest + easy access = HYSA."],
 ["open a first savings account at the same local branch as their checking, so they can move money in person","Savings","A traditional savings account at a branch is easy to reach in person, even though it pays little interest."],
 ["have a place to send money from each paycheck to spend at the store with a card","Checking","Daily spending = checking."]];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const fmt=x=>"$"+x.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=x=>"$"+x.toLocaleString("en-US");
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const num=s=>{ s=String(s).replace(/[$,\s]/g,"").replace(/months?/ig,""); return s===""||isNaN(s)?NaN:+s; };
function terms(tMin,tMax){ for(;;){ const P=pick(PRIN), r=pick(RATES), t=rnd(tMin,tMax); if(!AVOID.includes(`${P}|${r}|${t}`)) return {P,r,t,d:r/100}; } }
function compound(P,d,t){ const b=[P]; for(let i=1;i<=t;i++) b.push(r2(b[i-1]+r2(b[i-1]*d))); return b; }
const dec=r=>String(r/100);

function mkCompound(){ const {P,r,t,d}=terms(2,3), b=compound(P,d,t), simple=r2(P*(1+d*t));
  const F=[{k:"i1", q:"Interest earned in year 1", sub:`${fmt0(P)} × ${dec(r)}`, a:r2(P*d), miss:[[P*r,"Change the percent to a decimal: "+r+"% = "+dec(r)+"."],[P*d*10,"Decimal slip. "+r+"% = "+dec(r)+"."]]}];
  for(let y=1;y<=t;y++) F.push({k:"b"+y, q:y===t?`Balance at maturity (end of year ${y})`:`Balance after year ${y}`, sub:y===1?"starting amount + year 1 interest":`year ${y-1} balance × ${dec(r)}, then add it`, a:b[y], tol:.03,
    miss:[[P+P*d*y,"That's simple interest. This CD compounds: find interest on the NEW balance each year."],[P*d*y,"That's only the interest. Add it to the balance."],[b[y-1],"Add this year's interest."]]});
  return {type:"cmp", tag:"Compounded annually", P, r, t, F, note:`Simple interest would give ${fmt(simple)}. Compounding earned ${fmt(r2(b[t]-simple))} more.`}; }
function mkSimple(){ const {P,r,t,d}=terms(2,4), I=r2(P*d*t), A=r2(P+I), c=compound(P,d,t)[t];
  return {type:"simp", tag:"Simple interest · A = P(1 + rt)", P, r, t, F:[
    {k:"rt", q:"r × t", sub:`${dec(r)} × ${t}`, unit:" ", a:r2(d*t*1e6)/1e6, tol:.0001, miss:[[r*t,"Use r as a decimal: "+dec(r)+"."]]},
    {k:"I", q:"Interest earned (P × r × t)", sub:`${fmt0(P)} × ${dec(r)} × ${t}`, a:I, miss:[[P*d,"That's one year. Multiply by "+t+" years."],[c-P,"That's compound interest. This one is simple."],[P*r*t,"Decimal slip: "+r+"% = "+dec(r)+"."]]},
    {k:"A", q:"Maturity amount A", sub:"P + interest", a:A, miss:[[I,"Add the principal (starting amount) too."],[c,"That's compounding. Simple interest uses A = P(1 + rt)."]]}]}; }
function mkVs(){ const {P,r,t,d}=terms(3,5), s=r2(P*(1+d*t)), c=compound(P,d,t)[t];
  return {type:"vs", tag:"Same CD, two ways", P, r, t, F:[
    {k:"s", q:"Simple interest: A = P(1 + rt)", a:s, miss:[[c,"That's the compound answer. Simple uses P(1 + rt)."]]},
    {k:"c", q:"Compounded annually: balance at maturity", sub:"year by year", a:c, tol:.03, miss:[[s,"That's the simple answer. Compound year by year."]]},
    {k:"d", q:"How much MORE does compounding earn?", sub:"compound − simple", a:r2(c-s), tol:.03, miss:[]}],
    note:"Compounding earns interest on your interest, so it always wins when the term is longer than 1 year."}; }
function mkPenalty(){ const {P,r,d}=terms(3,3), i1=r2(P*d), pen=r2(i1/2);
  return {type:"pen", tag:"Early withdrawal", P, r, t:3, story:`${pick(NAMES)}'s car breaks down after 1 year, so they cash out this 3-year CD early.`, rule:"Early withdrawal penalty: 6 months of interest (half of one year's interest).", F:[
    {k:"i1", q:"Interest earned in year 1", a:i1, miss:[[P*r,"Use "+r+"% as "+dec(r)+"."]]},
    {k:"pen", q:"Penalty", sub:"half of one year's interest", a:pen, miss:[[i1,"The penalty is HALF a year of interest."],[P/2,"Half of the interest, not half of the deposit."]]},
    {k:"get", q:"Amount they walk away with", sub:"deposit + interest − penalty", a:r2(P+i1-pen), miss:[[P+i1,"Subtract the penalty."],[P-pen,"Add the interest they earned first."]]}],
    note:"Money you might need soon belongs in savings or an HYSA, not a CD."}; }
function mkFee(){ const fee=pick([6,7,9,12,15]), min=pick([300,750,1000,1200]), months=["Jan","Feb","Mar","Apr","May","Jun"];
  const lows=months.map(()=>Math.random()<.45?rnd(Math.round(min*.3),min-1):rnd(min,min*2)); if(!lows.some(x=>x<min)) lows[rnd(0,5)]=min-rnd(5,60); if(lows.every(x=>x<min)) lows[0]=min;
  if(!lows.includes(min)&&Math.random()<.5) lows[lows.findIndex(x=>x>=min)]=min;
  const n=lows.filter(x=>x<min).length;
  return {type:"fee", tag:"Checking account rules", fee, min, months, lows, F:[
    {k:"n", q:"How many months was the fee charged?", unit:"months", a:n, miss:[[lows.filter(x=>x<=min).length,"A balance exactly at the minimum does NOT get charged."],[6-n,"The fee is charged when the balance falls BELOW the minimum."]]},
    {k:"tot", q:"Total maintenance fees for the 6 months", a:n*fee, miss:[[fee*6,"Only charge the months under the minimum."]]}],
    note:"Keep a cushion above the minimum, or pick a bank with no minimum."}; }
function mkHysa(){ const P=pick([1500,2400,3200,4800,6000]), sav=0.05, hy=pick([3.5,3.8,4.0,4.25]);
  const a=r2(P*sav/100), b=r2(P*hy/100);
  return {type:"hysa", tag:"1 year, no deposits or withdrawals", P, sav, hy, F:[
    {k:"a", q:`Interest at the local bank savings (${sav}% APY)`, a, miss:[[P*sav,"0.05% as a decimal is 0.0005."],[P*sav/10,"0.05% as a decimal is 0.0005."]]},
    {k:"b", q:`Interest in the online HYSA (${hy}% APY)`, a:b, miss:[[P*hy,"Change "+hy+"% to "+(hy/100)+"."]]},
    {k:"d", q:"How much more does the HYSA earn?", a:r2(b-a), miss:[]}],
    note:"Both are FDIC insured up to $250,000. The HYSA just pays far more interest."}; }
function mkAcct(){ const S=shuffle(SCEN).slice(0,3), N=shuffle(NAMES);
  return {type:"acct", tag:"Checking · Savings · HYSA · CD", scen:S.map((s,i)=>[N[i],s[0]]), F:S.map((s,i)=>({k:"c"+i, choices:ACCTS, q:`${N[i]} wants to ${s[0]}.`, a:s[1], why:s[2]}))}; }
function mkBank(){ const fA=pick([6,7,9]), minA=pick([400,600,800]), fB=pick([12,14,15]), minB=pick([1200,2000,2500]), apy=pick([3.75,3.9,4.2]), odA=pick([34,35,36]);
  const nm=pick(NAMES);
  return {type:"bank", tag:"Compare banks", chart:{fA,minA,fB,minB,apy,odA}, F:[
    {k:"q1", choices:["Bank A","Bank B","Bank C"], q:"Which bank has NO monthly fee and NO overdraft fee?", a:"Bank C", why:"Bank C, the online bank, has $0 monthly fees and $0 overdraft fees."},
    {k:"q2", choices:["Bank A","Bank B","Bank C"], q:`${nm} wants to walk into a branch for help and can keep at least ${fmt0(minA)} in checking. Best fit?`, a:"Bank A", why:`Bank A is local with branches, and ${fmt0(minA)} waives its fee.`},
    {k:"q3", q:`At Bank B, the balance stays under ${fmt0(minB)} all year. Total monthly fees for the year?`, sub:"fee × 12", a:fB*12, miss:[[fB,"That's one month. Multiply by 12."]]}]}; }
function makeRound(){ return [mkCompound(), ...shuffle([mkSimple(), mkVs(), mkPenalty(), mkFee(), mkHysa(), mkAcct(), mkBank()])]; }

let G=null, best=null;
try{ best=+localStorage.getItem("savings-lab-best")||null; }catch(e){}
function stats(){ const el=$("stats");
  if(!G){ el.innerHTML=`<span>Unit 5: Banking</span>`; return; }
  el.innerHTML=`<span>Card <b>${Math.min(G.i+1,G.cards.length)}</b>/${G.cards.length}</span><span>Score <b>${G.score}</b></span>${G.phase==="play"?`<button class="btn" id="quit">Quit</button>`:""}`;
  $("quit")&&($("quit").onclick=intro); }
function intro(){
  G=null; stats();
  $("root").innerHTML=`<div class="panel">
    <div class="eyebrow" style="font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Unit 5 · Banking: savings &amp; interest</div>
    <h2>Make your money work. Then pick where it lives.</h2>
    <p>Eight cards: CD growth, early-withdrawal penalties, minimum-balance fees, HYSA vs. savings, choosing the right account, and comparing banks. Every CD card tells you which kind of interest to use:</p>
    <ol class="steps"><li><b>Simple interest:</b> A = P(1 + rt). Interest only on the starting amount.</li><li><b>Compounded annually:</b> find each year's interest on the NEW balance, then add it. Round to the cent each year.</li></ol>
    <p>Typed answers: 10 points first try, 5 second. Tap answers: one try. Use a calculator.${best?` <b>Your best: ${best}.</b>`:""}</p>
    <div class="row"><button class="btn go" id="go">Open the lab</button></div></div>`;
  $("go").onclick=()=>{ G={cards:makeRound(), i:0, score:0, phase:"play", by:{}}; prep(); draw(); };
}
function prep(){ const c=G.cards[G.i]; c.st={}; c.tries={}; c.msg={}; c.val={}; c.done=false; }
function card(c){
  const head=(kind,title)=>`<div class="kind">${kind}</div><h2>${title}</h2><span class="tag">${esc(c.tag)}</span>`;
  if(c.type==="cmp"||c.type==="simp"||c.type==="vs"||c.type==="pen") return `<div class="tc">${head("Certificate of Deposit",fmt0(c.P)+" CD")}
    <table><tr><th>Principal (P)</th><td>${fmt0(c.P)}</td></tr><tr><th>Rate (r)</th><td>${c.r}% = ${dec(c.r)}</td></tr><tr><th>Term (t)</th><td>${c.t} years</td></tr></table>
    ${c.story?`<p class="story">${esc(c.story)}</p>`:""}${c.rule?`<div class="rule">${esc(c.rule)}</div>`:""}
    ${c.type==="cmp"?`<div class="rule">Each year: interest = balance × ${dec(c.r)}. New balance = balance + interest.</div>`:""}</div>`;
  if(c.type==="fee") return `<div class="tc">${head("Prairie Federal Bank","Basic Checking")}
    <div class="rule"><b>${fmt0(c.fee)} monthly fee</b>, waived if your balance never drops below <b>${fmt0(c.min)}</b> that month.</div>
    <table><tr><th>Month</th><th>Lowest balance</th></tr>${c.months.map((m,i)=>`<tr><td>${m}</td><td>${fmt0(c.lows[i])}</td></tr>`).join("")}</table></div>`;
  if(c.type==="hysa") return `<div class="tc">${head("Where should savings live?",fmt0(c.P)+" for one year")}
    <table><tr><th>Account</th><th>APY</th></tr><tr><td>Local bank savings</td><td>${c.sav}%</td></tr><tr><td>Online HYSA</td><td>${c.hy}%</td></tr></table>
    <div class="rule">APY already includes compounding, so for 1 year: interest = deposit × APY.</div></div>`;
  if(c.type==="acct") return `<div class="tc">${head("Pick the account","Who needs what?")}
    <table><tr><th>Account</th><th>Best for</th></tr><tr><td>Checking</td><td>Everyday spending, bills, direct deposit</td></tr><tr><td>Savings</td><td>Safe storage, small interest</td></tr><tr><td>HYSA</td><td>Most interest, still easy to reach</td></tr><tr><td>CD</td><td>Locked for a set term; penalty to leave early</td></tr></table></div>`;
  const C=c.chart;
  return `<div class="tc">${head("Bank comparison chart","Which bank fits?")}
    <div style="overflow-x:auto"><table style="min-width:420px"><tr><th>Feature</th><th>Bank A<br>Local</th><th>Bank B<br>National</th><th>Bank C<br>Online</th></tr>
    <tr><td>Monthly fee</td><td>${fmt0(C.fA)}</td><td>${fmt0(C.fB)}</td><td>$0</td></tr>
    <tr><td>Fee waived with</td><td>${fmt0(C.minA)} min.</td><td>${fmt0(C.minB)} min.</td><td>No minimum</td></tr>
    <tr><td>Overdraft fee</td><td>${fmt0(C.odA)}</td><td>$35</td><td>$0</td></tr>
    <tr><td>Savings APY</td><td>0.02%</td><td>0.04%</td><td>${C.apy}% HYSA</td></tr>
    <tr><td>Branches</td><td>Yes, in town</td><td>Yes, nationwide</td><td>No (app only)</td></tr>
    <tr><td>FDIC insured</td><td>Yes</td><td>Yes</td><td>Yes</td></tr></table></div></div>`;
}
function draw(){
  stats();
  if(!G) return intro();
  if(G.phase==="end") return end();
  const c=G.cards[G.i], n=G.cards.length;
  const fields=c.F.map(f=>{ const st=c.st[f.k], dis=st==="ok"||st==="shown";
    if(f.choices) return `<div class="field wide ${st==="ok"?"ok":st==="shown"?"shown":""}"><div class="q">${esc(f.q)}</div>
      <div class="choices" role="group">${f.choices.map(o=>{ let cl="ch"; if(dis&&o===f.a) cl+=" right"; else if(c.val[f.k]===o) cl+=" sel"; return `<button type="button" class="${cl}" data-k="${f.k}" data-o="${esc(o)}" ${dis?"disabled":""}>${esc(o)}</button>`; }).join("")}</div>
      ${c.msg[f.k]?`<div class="msg">${esc(c.msg[f.k])}</div>`:""}</div>`;
    return `<div class="field ${st==="ok"?"ok":st==="shown"?"shown":c.msg[f.k]?"no":""}">
      <label class="q" for="f-${f.k}">${esc(f.q)}${f.sub?`<small>${esc(f.sub)}</small>`:""}</label>
      <div class="inp">${f.unit?"":"<span>$</span>"}<input id="f-${f.k}" inputmode="decimal" autocomplete="off" value="${esc(c.val[f.k]??"")}" ${dis?"disabled":""}>${f.unit&&f.unit.trim()?`<span>${f.unit}</span>`:""}</div>
      ${c.msg[f.k]?`<div class="msg">${esc(c.msg[f.k])}</div>`:""}</div>`; }).join("");
  $("root").innerHTML=`<div class="game">
    <div class="progress" aria-hidden="true"><i style="width:${(G.i+(c.done?1:0))/n*100}%"></i></div>
    ${card(c)}
    <form class="sheet" id="sheet" novalidate>
      <div class="eyebrow">${SKILL[c.type]}</div>
      ${fields}
      ${c.done&&c.note?`<p class="note"><b>${esc(c.note)}</b></p>`:""}
      <div class="row">${c.done?`<button class="btn go" type="button" id="next">${G.i+1<n?"Next card":"See my results"}</button>`:`<button class="btn go" type="submit">Check</button>`}</div>
      <p class="note">Round money to the cent. Commas and $ signs are fine.</p>
    </form></div>`;
  if(c.done){ $("next").onclick=next; $("next").focus({preventScroll:true}); return; }
  const first=c.F.find(f=>!f.choices&&!(c.st[f.k]==="ok"||c.st[f.k]==="shown")); first&&$("f-"+first.k).focus({preventScroll:true});
  $("sheet").onsubmit=e=>{ e.preventDefault(); check(); };
  c.F.forEach(f=>{ if(f.choices) return; const el=$("f-"+f.k); el&&el.addEventListener("input",()=>{ c.val[f.k]=el.value; }); });
  document.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{ c.val[b.dataset.k]=b.dataset.o; draw(); });
}
function check(){
  const c=G.cards[G.i]; const b=G.by[c.type]||(G.by[c.type]=[0,0]);
  c.F.forEach(f=>{ if(c.st[f.k]==="ok"||c.st[f.k]==="shown") return;
    if(f.choices){ const v=c.val[f.k]; if(!v){ c.msg[f.k]="Tap an answer."; return; } b[1]++;
      if(v===f.a){ G.score+=10; b[0]++; c.st[f.k]="ok"; c.msg[f.k]=f.why; } else { c.st[f.k]="shown"; c.msg[f.k]="Best answer: "+f.a+". "+f.why; } return; }
    const v=num(c.val[f.k]??""), tol=f.tol||.015; if(!c.tries[f.k]) b[1]++;
    if(!isNaN(v)&&Math.abs(v-f.a)<=tol){ const pts=c.tries[f.k]?5:10; G.score+=pts; if(!c.tries[f.k]) b[0]++; c.st[f.k]="ok"; c.msg[f.k]=c.tries[f.k]?"Got it on the second try. +5":""; return; }
    c.tries[f.k]=(c.tries[f.k]||0)+1;
    const hit=isNaN(v)?null:(f.miss||[]).find(([x])=>Math.abs(v-r2(x))<=.02&&Math.abs(r2(x)-f.a)>tol);
    const show=f.unit?String(f.a)+(f.unit.trim()?" "+f.unit:""):fmt(f.a);
    if(c.tries[f.k]>=2){ c.st[f.k]="shown"; c.val[f.k]=String(f.a); c.msg[f.k]=(hit?hit[1]+" ":"")+"Answer: "+show+"."; }
    else c.msg[f.k]=isNaN(v)?"Type a number.":(hit?hit[1]:"Not quite. Check the step above.")+" Try again.";
  });
  c.done=c.F.every(f=>c.st[f.k]==="ok"||c.st[f.k]==="shown");
  draw();
}
function next(){ G.i++; if(G.i>=G.cards.length){ G.phase="end"; if(!best||G.score>best){ best=G.score; try{ localStorage.setItem("savings-lab-best",String(best)); }catch(e){} } } else prep(); draw(); }
function end(){
  stats();
  const max=G.cards.reduce((s,c)=>s+c.F.length*10,0);
  const rows=Object.keys(SKILL).filter(k=>G.by[k]).map(k=>{ const [a,t]=G.by[k], p=a/t;
    return `<div class="skill"><b>${SKILL[k]}</b><span class="v">${a} of ${t} first try</span>${p>=.8?`<span class="pill g">Got it</span>`:p>=.6?`<span class="pill a">Almost</span>`:`<span class="pill r">Study this</span>`}</div>`; }).join("");
  $("root").innerHTML=`<div class="panel">
    <div class="eyebrow" style="font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Lab complete</div>
    <div class="big">${G.score} <span style="font-size:.45em;color:var(--muted)">/ ${max}</span></div>
    <div class="skills">${rows}</div>
    <p>Screenshot this screen if your teacher asks for it.</p>
    <div class="row"><button class="btn go" id="again">New cards</button></div></div>`;
  $("again").onclick=intro;
}
function start(d){ if(d&&d.G){ G=d.G; draw(); } else intro(); }
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

<script src="/fm-calc.js" defer></script>
