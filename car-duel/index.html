<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Car Duel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one iPad flat on the desk between two partners. Screen splits in half; the top half is rotated 180° so the partner across the desk reads it right side up. Same question on both halves; first correct tap scores. */
:root {
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6780; --line:#CBD3DF;
  --p1:#0F8B6C; --p1-soft:#DDF1EA; --p2:#B23A26; --p2-soft:#F9E1DC; --gold:#E0A800; --bad:#C23B3B;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0D1424; --surface:#16203A; --ink:#E8EDF5; --muted:#93A0B8; --line:#2A3A5E;
  --p1:#3CCB9F; --p1-soft:#123A32; --p2:#FF7A63; --p2-soft:#3E1F1A; --gold:#F5C542; --bad:#F07070; color-scheme:dark } }
:root[data-theme="dark"] {
  --bg:#0D1424; --surface:#16203A; --ink:#E8EDF5; --muted:#93A0B8; --line:#2A3A5E;
  --p1:#3CCB9F; --p1-soft:#123A32; --p2:#FF7A63; --p2-soft:#3E1F1A; --gold:#F5C542; --bad:#F07070; color-scheme:dark }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden] { display:none !important; }
html, body, #root { height:100%; }
body { background:var(--bg); color:var(--ink); font-family:var(--body); margin:0; touch-action:manipulation; -webkit-user-select:none; user-select:none; overflow:hidden; }
.app { height:100%; display:grid; grid-template-rows:1fr auto 1fr; padding-left:max(10px, env(safe-area-inset-left, 0px)); padding-right:max(10px, env(safe-area-inset-right, 0px)); padding-block:8px; gap:8px; }
.half { border-radius:18px; padding:clamp(10px, 2vh, 22px); display:grid; grid-template-rows:auto 1fr auto; gap:clamp(6px, 1.4vh, 14px); min-height:0; border:3px solid transparent; transition:border-color .2s, background .2s; }
.half.p1 { background:var(--p1-soft); }
.half.p2 { background:var(--p2-soft); transform:rotate(180deg); }
.half.win { border-color:var(--gold); }
.half.lock { opacity:.55; }
.hd { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.who { font-family:var(--display); font-weight:800; font-size:clamp(18px, 2.6vh, 28px); }
.p1 .who { color:var(--p1); } .p2 .who { color:var(--p2); }
.pts { display:flex; gap:5px; align-items:center; }
.pts i { width:clamp(12px, 1.8vh, 18px); height:clamp(12px, 1.8vh, 18px); border-radius:50%; border:2px solid var(--muted); display:block; }
.p1 .pts i.on { background:var(--p1); border-color:var(--p1); } .p2 .pts i.on { background:var(--p2); border-color:var(--p2); }
.q { font-family:var(--display); font-weight:600; font-size:clamp(17px, 3vh, 32px); line-height:1.2; margin:0; align-self:center; text-wrap:balance; }
.opts { display:grid; grid-template-columns:1fr 1fr; gap:clamp(6px, 1.2vh, 12px); }
.opt { font:inherit; font-size:clamp(15px, 2.2vh, 22px); font-weight:700; line-height:1.2; text-align:left; padding:clamp(8px, 1.6vh, 16px) 12px; border-radius:12px; border:2px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; min-height:clamp(46px, 7vh, 72px); }
.opt:active:not(:disabled) { transform:scale(.98); }
.opt:disabled { cursor:default; }
.opt.right { border-color:var(--p1); background:var(--p1); color:#fff; }
.p2 .opt.right { border-color:var(--p2); background:var(--p2); }
.opt.wrong { border-color:var(--bad); color:var(--bad); }
.note { font-size:clamp(14px, 2vh, 19px); line-height:1.35; min-height:1.4em; }
.note b { color:var(--gold); }
.mid { display:flex; justify-content:center; align-items:center; gap:12px; flex-wrap:wrap; text-align:center; }
.mid .t { font-family:var(--display); font-weight:800; font-size:clamp(16px, 2.2vh, 22px); }
.mid .s { color:var(--muted); font-size:14px; }
.btn { font:inherit; font-weight:700; padding:10px 18px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
.btn.go { background:var(--gold); color:#14213D; border-color:var(--gold); }
.btn:focus-visible, .opt:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
.setup { height:100%; overflow:auto; display:grid; place-items:center; padding:20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.card { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:clamp(18px, 3vw, 32px); width:min(560px, 100%); display:grid; gap:14px; }
.card h1 { font-family:var(--display); font-weight:800; font-size:clamp(34px, 6vw, 54px); margin:0; line-height:1; }
.card .unit { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700; }
.card p { margin:0; line-height:1.45; }
.card ol { margin:0; padding-left:20px; line-height:1.5; }
.field { display:grid; gap:4px; font-weight:700; }
.field input, .field select { font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); -webkit-user-select:text; user-select:text; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:420px) { .two { grid-template-columns:1fr; } }
.winner { font-family:var(--display); font-weight:800; font-size:clamp(26px, 4vh, 44px); text-align:center; align-self:center; }
@media (prefers-reduced-motion: reduce) { .half { transition:none; } }
</style>

<div id="root"></div>

<script>
const BANK=[["In a Toyota Tacoma, the MAKE is...", ["Toyota", "Tacoma", "Pickup", "4x4"], "Make = the manufacturer. Model = Tacoma."], ["Our class estimate for tax, title & registration is about...", ["10% of the price", "1%", "25%", "50%"], "Add roughly 10% to the price."], ["$18,500 car + 10% for tax, title & registration =", ["$20,350", "$18,685", "$1,850", "$19,350"], "18,500 × 1.10 = $20,350."], ["A BASIC (bumper-to-bumper) warranty covers...", ["Almost everything except maintenance and damage", "Only the engine", "Oil changes", "Accidents"], "Powertrain = what makes it run."], ["A POWERTRAIN warranty covers...", ["Engine, transmission: what makes the car run", "Paint and scratches", "Wiper blades", "Everything bumper-to-bumper"], "Basic covers the rest."], ["Best place to get pre-approved for the lowest rate?", ["A credit union", "A loan shark", "A hard money lender", "A pawn shop"], "Credit unions usually have the best auto rates."], ["Best time of the MONTH to buy a car?", ["The end", "The beginning", "The middle", "Any time"], "Dealers push to hit monthly goals."], ["Best day of the WEEK to visit a dealership?", ["Midweek", "Saturday", "Sunday", "A holiday weekend"], "Less busy, more attention, better deals."], ["Does a vehicle history report show EVERY accident?", ["No, only reported ones", "Yes, always", "Only for new cars", "Only for trucks"], "Get an inspection too."], ["Quick estimate: about $___ a month for every $5,000 borrowed (5-year loan).", ["$115", "$50", "$500", "$1,000"], "$20,000 ≈ 4 × 115 = $460 a month."], ["Liquid assets are...", ["Cash or things you can quickly turn into cash", "Your car", "Your house", "Your retirement account"], "Have your down payment liquid before you shop."], ["Amount financed =", ["Out-the-door − down payment − trade-in", "Price + interest", "Monthly payment × 12", "Down payment + trade-in"], "That's what you borrow."], ["15% down on a $22,000 car:", ["$3,300", "$330", "$15,000", "$2,200"], "22,000 × 0.15 = $3,300."], ["APR stands for...", ["Annual Percentage Rate", "Auto Payment Rate", "Average Price Ratio", "Annual Payment Record"], "The yearly cost of borrowing."], ["$376.04 a month for 36 months. Total of payments?", ["$13,537.44", "$4,512.48", "$1,537.44", "$376.04"], "376.04 × 36 = $13,537.44."], ["You borrowed $12,000 and pay back $13,537.44 total. Interest?", ["$1,537.44", "$13,537.44", "$12,000", "$376.04"], "Total − amount borrowed."], ["A longer loan (72 vs. 48 months) usually means...", ["Lower payment, more total interest", "Higher payment, less interest", "Same total cost", "No interest"], "Smaller payments, but you pay interest longer."], ["$16,000 at 7%: 48 months costs $2,390.72 interest; 72 months costs $3,640.16. Difference?", ["$1,249.44", "$110.36", "$3,640.16", "$0"], "3,640.16 − 2,390.72."], ["A higher credit score usually gets...", ["A lower interest rate", "A higher interest rate", "No loan", "A bigger down payment"], "Lenders reward lower risk."], ["Which helps lower your car loan rate?", ["A better credit score", "A longer term", "No down payment", "A late payment"], "Good credit = lower APR."], ["Getting pre-approved by a bank or credit union before visiting a dealer helps you...", ["Compare the dealer's rate", "Skip insurance", "Avoid sales tax", "Raise your credit score"], "You know your rate and budget going in."], ["Guideline: car payment + insurance + gas should be at most...", ["10% of gross monthly pay", "50% of pay", "Your whole paycheck", "1% of pay"], "Keep transportation costs around 10% of gross pay."], ["You earn $3,000 a month. 10% for car costs =", ["$300", "$30", "$3,000", "$900"], "3,000 × 0.10."], ["Upside down on a car loan means...", ["You owe more than the car is worth", "The car flipped", "It's paid off", "The rate is 0%"], "Also called negative equity."], ["New cars lose the most value...", ["In the first few years", "After 20 years", "Never", "Only if crashed"], "Depreciation is steepest early."], ["$28,000 new car loses about 20% in year 1. Value after year 1?", ["$22,400", "$5,600", "$27,800", "$20,000"], "28,000 × 0.80."], ["Gas: 900 miles a month at 30 mpg, $3.50/gal =", ["$105", "$94.50", "$31.50", "$945"], "900 ÷ 30 × 3.50."], ["Which car insurance pays for damage YOU cause to others?", ["Liability", "Collision", "Comprehensive", "Gap"], "Liability is required in almost every state."], ["A hailstorm dents your car. Which coverage pays?", ["Comprehensive", "Liability", "Collision", "Medical"], "Weather, theft and animals."], ["You back into a pole. Which coverage fixes YOUR car?", ["Collision", "Liability", "Comprehensive", "Rental"], "Collision covers crashes."], ["A deductible is...", ["What you pay first on a claim", "Your monthly premium", "Your car payment", "A tax refund"], "Insurance pays after the deductible."], ["Raising your deductible usually makes your premium...", ["Go down", "Go up", "Stay the same", "Double"], "You take on more risk, so you pay less monthly."], ["A speeding ticket usually makes insurance...", ["Cost more", "Cost less", "Free", "Unchanged forever"], "Riskier driver = higher premium."], ["Leasing a car means...", ["You rent it for a set time and return it", "You own it at the end automatically", "No payments", "No mileage limits"], "Leases have mileage limits and you own nothing."], ["Lowest total cost over 10 years is usually...", ["Buying a reliable used car", "Leasing new cars", "Buying new every 3 years", "Taking a 84-month loan"], "Used skips the biggest depreciation."], ["The 'four-square' or 'what payment do you want?' sales move pushes you to focus on...", ["The monthly payment instead of total cost", "The safety rating", "The color", "The warranty only"], "Negotiate the out-the-door price, not the payment."], ["A cosigner on a car loan...", ["Must pay if you don't", "Owns the car", "Lowers taxes", "Gets the title"], "Late payments hurt both credit reports."], ["Before buying a used car, it's smart to...", ["Get a vehicle history report and a mechanic's inspection", "Skip the test drive", "Pay cash to a stranger without a title", "Ignore the mileage"], "Check history, title and condition."], ["Total cost of owning a car includes...", ["Payment, insurance, gas, maintenance", "Just the payment", "Just gas", "Only the sticker price"], "Add up everything you pay each month."], ["Why is a bigger down payment smart?", ["You borrow less and pay less interest", "It raises the APR", "It lengthens the loan", "It adds fees"], "Less borrowed, less interest, less chance of being upside down."], ["A car title shows...", ["Who legally owns the car", "The insurance policy", "The loan rate", "The gas mileage"], "The lender often holds it until the loan is paid off."]];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let G=null, timerId=null;
let names=["Player 1","Player 2"], target=7;
try{ const s=JSON.parse(localStorage.getItem("car-duel-names")||"null"); if(s) names=s; }catch(e){}

function setup(){
  G=null; clearTimeout(timerId);
  $("root").innerHTML=`<div class="setup"><div class="card">
    <div class="unit">Unit 7 · Cars & Lending</div>
    <h1>Car Duel</h1>
    <p>Two players, one iPad. Lay it flat on the desk between you. The top half flips so your partner can read it.</p>
    <ol><li>Both of you see the same question.</li><li>Tap the right answer first to score.</li><li>Tap a wrong answer and you're locked out for that question.</li></ol>
    <div class="two"><label class="field" for="n1">Player 1 (bottom)<input id="n1" maxlength="16" value="${esc(names[0])}"></label>
      <label class="field" for="n2">Player 2 (top)<input id="n2" maxlength="16" value="${esc(names[1])}"></label></div>
    <label class="field" for="tg">Play to<select id="tg"><option value="5">5 points (quick)</option><option value="7" selected>7 points</option><option value="10">10 points (long)</option></select></label>
    <button class="btn go" id="start">Start the duel</button></div></div>`;
  $("tg").value=String(target);
  $("start").onclick=()=>{ names=[$("n1").value.trim()||"Player 1", $("n2").value.trim()||"Player 2"]; target=+$("tg").value;
    try{ localStorage.setItem("car-duel-names", JSON.stringify(names)); }catch(e){}
    G={deck:shuffle(BANK.map((_,i)=>i)), qi:0, score:[0,0], phase:"ask", locked:[false,false], winner:null, round:1};
    newQ(); };
}
function newQ(){ if(G.qi>=G.deck.length){ G.deck=shuffle(BANK.map((_,i)=>i)); G.qi=0; }
  const b=BANK[G.deck[G.qi++]]; const order=shuffle([0,1,2,3]);
  G.cur={q:b[0], opts:order.map(i=>b[1][i]), right:order.indexOf(0), why:b[2]}; G.phase="ask"; G.locked=[false,false]; G.taps=[null,null]; G.scorer=null; draw(); }
function half(p){
  const c=G.cur, done=G.phase!=="ask", over=G.phase==="over";
  const dots=Array.from({length:target},(_,i)=>`<i class="${i<G.score[p]?'on':''}"></i>`).join("");
  let body;
  if(over){ body=`<div class="winner">${G.winner===p?"You win!":"Good game!"}</div>`; }
  else body=`<p class="q">${esc(c.q)}</p>
    <div><div class="opts">${c.opts.map((o,k)=>{ let cls=""; if(done&&k===c.right) cls="right"; else if(G.taps[p]===k) cls="wrong";
      return `<button class="opt ${cls}" data-p="${p}" data-k="${k}" ${done||G.locked[p]?"disabled":""}>${esc(o)}</button>`; }).join("")}</div>
    <div class="note">${done?(G.scorer===p?"<b>+1 point!</b> ":G.scorer===null?"No point this time. ":"")+esc(c.why):G.locked[p]?"Locked out. Wait for your partner.":""}</div></div>`;
  return `<section class="half p${p+1} ${(over&&G.winner===p)||(!over&&done&&G.scorer===p)?'win':''} ${G.locked[p]&&!done?'lock':''}" aria-label="${esc(names[p])}">
    <div class="hd"><span class="who">${esc(names[p])}</span><span class="pts" aria-label="${G.score[p]} of ${target} points">${dots}</span></div>
    ${body}${over?"<span></span>":""}</section>`;
}
function draw(){
  const over=G.phase==="over";
  const mid= over ? `<div class="mid"><span class="t">${esc(names[G.winner])} wins ${G.score[G.winner]} to ${G.score[1-G.winner]}!</span><button class="btn go" id="again">Rematch</button><button class="btn" id="home">New players</button></div>`
    : G.phase==="ask" ? `<div class="mid"><span class="t">Question ${G.round}</span><span class="s">First to ${target} wins</span><button class="btn" id="home">Quit</button></div>`
    : G.winner!=null ? `<div class="mid"><span class="t">Game point!</span></div>` : `<div class="mid"><button class="btn go" id="next">Next question</button><button class="btn" id="home">Quit</button></div>`;
  $("root").innerHTML=`<div class="app">${half(1)}${mid}${half(0)}</div>`;
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>tap(+b.dataset.p, +b.dataset.k)));
  $("next")&&($("next").onclick=()=>{ G.round++; newQ(); });
  $("again")&&($("again").onclick=()=>{ G={deck:shuffle(BANK.map((_,i)=>i)), qi:0, score:[0,0], phase:"ask", locked:[false,false], winner:null, round:1}; newQ(); });
  $("home")&&($("home").onclick=setup);
}
function tap(p,k){
  if(G.phase!=="ask"||G.locked[p]) return;
  G.taps[p]=k;
  if(k===G.cur.right){ G.score[p]++; G.scorer=p; G.phase="shown";
    if(G.score[p]>=target){ G.winner=p; draw(); clearTimeout(timerId); timerId=setTimeout(()=>{ G.phase="over"; draw(); },1800); return; } }
  else { G.locked[p]=true; if(G.locked[0]&&G.locked[1]){ G.phase="shown"; G.scorer=null; } }
  draw();
}
function start(d){ if(d&&d.G){ G=d.G; names=d.names||names; target=d.target||target; if(G.phase==="shown"&&G.winner!=null) G.phase="over"; draw(); } else setup(); }
window.claude?.hot?.snapshot?.(()=>({G, names, target}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body></html>
