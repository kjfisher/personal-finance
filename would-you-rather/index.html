<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Would You Rather</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap"><style>
:root{--bg:#F2F4F1;--surface:#FFFFFF;--ink:#14213D;--muted:#5A6478;--line:#D3D9D0;--hero:#14213D;--hero-ink:#F3F5F8;--gold:#E0A800;--money:#0F8B6C;--money-ink:#FFFFFF;
--good:#1F7A45;--good-bg:#E3F4E8;--bad:#B23A26;--bad-bg:#FBE9E5;--warn:#9A6B00;--warn-bg:#FBF1D9;--accent:var(--money);
--display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B111D;--surface:#151E33;--ink:#E8EDF5;--muted:#97A3B9;--line:#26334F;--hero:#101A30;--gold:#F5C542;--money:#3CCB9F;--money-ink:#06261D;
--good:#6CCB8A;--good-bg:#17301F;--bad:#F09A72;--bad-bg:#3A1F18;--warn:#F5C542;--warn-bg:#3A3015;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B111D;--surface:#151E33;--ink:#E8EDF5;--muted:#97A3B9;--line:#26334F;--hero:#101A30;--gold:#F5C542;--money:#3CCB9F;--money-ink:#06261D;--good:#6CCB8A;--good-bg:#17301F;--bad:#F09A72;--bad-bg:#3A1F18;--warn:#F5C542;--warn-bg:#3A3015;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.top{background:var(--hero);color:var(--hero-ink)}
.top .in{max-width:980px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.eyebrow{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,44px);line-height:1;margin:4px 0 0}
.top nav{display:flex;gap:8px;flex-wrap:wrap}
.top nav a{color:var(--hero-ink);text-decoration:none;border:1px solid rgba(255,255,255,.3);padding:8px 12px;border-radius:10px;font-weight:700;font-size:15px}
main{max-width:980px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:12px;min-width:0}
.panel h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.4vw,30px);line-height:1.15;margin:0}
.lede{margin:0;color:var(--muted)}
.label{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{font:700 16px var(--body);border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;border-radius:12px;cursor:pointer;text-align:left}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--money);color:var(--money-ink);border-color:var(--money)}
.btn.gold{background:var(--gold);color:#14213D;border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.choice small{grid-column:1/-1;color:var(--muted);font-weight:400}
.cost{font:600 15px var(--mono)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.stat b{display:block;font:600 22px var(--mono)}
.stat.neg b{color:var(--bad)} .stat.pos b{color:var(--good)}
.note{border-radius:12px;padding:10px 14px;font-weight:700}
.note.ok{background:var(--good-bg);color:var(--good)} .note.no{background:var(--bad-bg);color:var(--bad)} .note.warn{background:var(--warn-bg);color:var(--warn)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(40px,9vw,72px);line-height:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#14213D;font-weight:700;padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:all .3s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)} td.n,th.n{text-align:right;font-family:var(--mono)}
.tw{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

select.btn{min-width:180px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
@media (max-width:700px){.vs{grid-template-columns:1fr}.or{text-align:center}}
.side{font:800 clamp(22px,3.4vw,36px)/1.15 var(--display);color:#fff;border:0;border-radius:20px;padding:26px 22px;display:grid;gap:12px;text-align:left;cursor:pointer;min-height:200px;align-content:start}
#A{background:#2F5FB8} #B{background:#9C3420}
.side.win{outline:6px solid var(--gold);outline-offset:3px}
.ab{font:600 14px var(--mono);letter-spacing:.14em;opacity:.85}
.votes{font:600 18px var(--mono);opacity:.9}
.or{align-self:center;font:800 28px var(--display);color:var(--muted)}
</style></head>
<body><header class="top"><div class="in"><div><div class="eyebrow">All units · Class game · Projector</div><h1>Money Would You Rather</h1></div>
<nav><a href="/passport/">My Passport</a><a href="/">Arcade</a></nav></div></header>
<main>
<section class="panel" id="intro">
  <h2>Money Would You Rather</h2>
  <p class="lede">Project this. Read both choices, everyone votes (hands up, stand on a side of the room, or hold up A/B), then reveal the math.</p>
  <div class="row"><label class="label" for="unitSel">Questions from</label><select id="unitSel" class="btn"></select><button class="btn primary" id="startB">Start</button></div>
</section>
<section id="play" hidden style="display:grid;gap:16px">
  <div class="row" style="justify-content:space-between"><span class="label" id="prog"></span><span class="label" id="unitLbl"></span></div>
  <div class="vs"><button class="side" id="A"><span class="ab">A</span><span id="tA"></span><span class="votes" id="vA"></span></button><div class="or">or</div><button class="side" id="B"><span class="ab">B</span><span id="tB"></span><span class="votes" id="vB"></span></button></div>
  <div class="row" style="justify-content:center"><span class="label">Tap A or B to count votes</span></div>
  <div class="row" style="justify-content:center"><button class="btn gold" id="reveal">Reveal the math</button><button class="btn" id="nextB" hidden>Next question →</button></div>
  <div class="panel" id="ans" hidden></div>
</section>
</main>
<script>
const FMP=(()=>{const K="fm-passport";
 function get(){try{const p=JSON.parse(localStorage.getItem(K));if(p&&p.s&&p.b)return p;}catch(e){}return {s:{},b:{},x:{}};}
 function save(p){try{localStorage.setItem(K,JSON.stringify(p));}catch(e){}}
 return {get,
  stamp(slug,score){const p=get();const s=p.s[slug]||{n:0,best:null};s.n++;if(score!=null&&(s.best==null||score>s.best))s.best=score;s.t=Date.now();p.s[slug]=s;save(p);},
  badge(id,name){const p=get();if(p.b[id])return false;p.b[id]=Date.now();save(p);if(name)fmToast("🏅 Passport badge earned: "+name);return true;},
  count(key){const p=get();p.x=p.x||{};p.x[key]=(p.x[key]||0)+1;save(p);return p.x[key];}};})();
function fmToast(t){let el=document.getElementById("fmToast");if(!el){el=document.createElement("div");el.id="fmToast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}
 el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),3800);}

const Q=[["Unit 1", "$1,000,000 today", "A penny that doubles every day for 30 days", "B", "The penny wins: $0.01 doubled 29 times = $5,368,709.12 on day 30. That's compounding."], ["Unit 1", "Start investing $100 a month at 18", "Start investing $100 a month at 28", "A", "At 8% until age 65: starting at 18 grows to about $621,000. Starting at 28 grows to about $272,000. Ten years cost about $350,000."], ["Unit 1", "Buy a $6 latte 5 days a week for 40 years", "Invest that $30 a week instead (8% a year)", "B", "$30 × 52 = $1,560 a year. Invested for 40 years at 8%, that's about $404,000. (You can still have a latte sometimes!)"], ["Unit 2", "A $50,000 job with a 5% 401(k) match", "A $51,500 job with no match", "A", "If you put in 5%, the match adds $2,500 a year: more than the $1,500 raise, and it grows tax-deferred."], ["Unit 3", "Rent a $1,400 apartment alone", "Pay $900 with a roommate", "B", "$500 a month saved = $6,000 a year. That's a full emergency fund in one year. (Alone has perks too: it's a trade-off.)"], ["Unit 4", "Get a $1,200 tax refund every spring", "Get $100 more in every monthly paycheck", "B", "Same money! A big refund means you lent the IRS $100 a month for free. Adjust your W-4 to keep it all year."], ["Unit 5", "$5,000 in a big bank savings account at 0.01%", "$5,000 in an online HYSA at 4%", "B", "One year: $0.50 vs. $200. Both are FDIC insured up to $250,000."], ["Unit 6", "Pay the minimum on a $2,000 card at 24% APR", "Pay $200 a month on the same card", "B", "Minimum (interest + 1% of the balance): about 143 months and $2,887 in interest. $200 a month: 12 months and about $254 in interest."], ["Unit 7", "A $30,000 new car", "A $20,000 used car + invest the $10,000 difference", "B", "$10,000 at 8% for 30 years grows to about $100,600. The new car loses value the day you drive it home."], ["Unit 7", "A 30-year mortgage on $250,000 at 6.5%", "A 15-year mortgage on $250,000 at 6.5%", "B", "30 years: $1,580/month, about $318,900 in interest. 15 years: $2,178/month, about $142,000 in interest. Lower payment vs. less interest: choose what fits your budget."], ["Unit 8", "The cheapest health plan with an $8,000 deductible", "A plan that costs $140 more a month with a $1,000 deductible", "It depends", "No emergency fund? The $1,000 deductible protects you: one $9,500 broken arm could cost you $8,000+ on the cheap plan. Have savings and rarely see a doctor? The cheaper plan might win."], ["Unit 9", "Put all your savings in one hot stock", "Buy an index fund that owns 500 companies", "B", "Diversify! One company can go to $0. An index fund spreads the risk, and its low fees keep more money growing."], ["Unit 9", "An investment fund with a 1% fee", "An index fund with a 0.05% fee", "B", "On $100,000, that's $1,000 a year vs. $50 a year. Over decades, the fee difference can cost tens of thousands."]];

const $=id=>document.getElementById(id);
const units=["All units",...new Set(Q.map(q=>q[0]))];
$("unitSel").innerHTML=units.map(u=>`<option>${u}</option>`).join("");
let list,i,va,vb;
$("startB").onclick=()=>{const u=$("unitSel").value;list=Q.filter(q=>u==="All units"||q[0]===u);i=0;$("intro").hidden=true;$("play").hidden=false;show();};
function show(){const q=list[i];va=0;vb=0;$("tA").textContent=q[1];$("tB").textContent=q[2];$("vA").textContent="";$("vB").textContent="";
  $("A").classList.remove("win");$("B").classList.remove("win");$("ans").hidden=true;$("reveal").hidden=false;$("nextB").hidden=true;
  $("prog").textContent=`Question ${i+1} of ${list.length}`;$("unitLbl").textContent=q[0];}
$("A").onclick=()=>{va++;$("vA").textContent=va+" vote"+(va===1?"":"s");};
$("B").onclick=()=>{vb++;$("vB").textContent=vb+" vote"+(vb===1?"":"s");};
$("reveal").onclick=()=>{const q=list[i];if(q[3]==="A")$("A").classList.add("win");if(q[3]==="B")$("B").classList.add("win");
  $("ans").hidden=false;$("ans").innerHTML=`<div class="label">${q[3]==="It depends"?"It depends!":"The math says "+q[3]}</div><h2 style="font-size:clamp(20px,2.6vw,28px)">${q[4]}</h2>`;
  $("reveal").hidden=true;$("nextB").hidden=false;$("nextB").textContent=i<list.length-1?"Next question →":"Finish";};
$("nextB").onclick=()=>{i++;if(i>=list.length){FMP.stamp("would-you-rather",list.length);$("play").hidden=true;$("intro").hidden=false;return;}show();};
</script></body></html>
