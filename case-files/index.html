<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: arcade header bar, mode picker, then a card grid (memory) or a scenario card with four target buttons. */
:root{--bg:#EEF1F5;--panel:#FFFFFF;--ink:#16202E;--muted:#5C6676;--line:#D3D9E2;--bar:#14213D;--barInk:#F4F6FA;--gold:#E3A008;--good:#1F7A4D;--bad:#B33A2B;--back:#22355E;--backInk:#F4F6FA;--chip:#E6EBF2;
 --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1522;--panel:#182133;--ink:#E7ECF4;--muted:#9AA6B8;--line:#2C3850;--bar:#0A1020;--barInk:#E7ECF4;--gold:#F2B83A;--good:#4FBF83;--bad:#F07A68;--back:#2B4170;--backInk:#E7ECF4;--chip:#223049;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1522;--panel:#182133;--ink:#E7ECF4;--muted:#9AA6B8;--line:#2C3850;--bar:#0A1020;--barInk:#E7ECF4;--gold:#F2B83A;--good:#4FBF83;--bad:#F07A68;--back:#2B4170;--backInk:#E7ECF4;--chip:#223049;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
header{background:var(--bar);color:var(--barInk);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(22px,3.4vw,34px)}
header h1 span{color:var(--gold)}
.stat{font-family:var(--mono);font-size:14px;display:flex;gap:16px;align-items:center}
.stat b{color:var(--gold)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 16px var(--body);padding:11px 18px;border-radius:12px;cursor:pointer}
.btn.go{background:var(--gold);border-color:var(--gold);color:#1A1406}
header .btn{background:transparent;color:var(--barInk);border-color:rgba(255,255,255,.35);padding:8px 14px;font-size:14px}
.btn:focus-visible,.card:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:14px}
.intro h2{margin:0;font-family:var(--display);font-size:clamp(24px,3.4vw,36px);text-wrap:balance}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.mode{border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;background:var(--chip)}
.mode h3{margin:0;font-family:var(--display);font-size:22px}
.mode p{margin:0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{position:relative;min-height:118px;border-radius:14px;border:0;cursor:pointer;perspective:800px;background:transparent;padding:0;font:inherit;color:inherit}
.inner{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.card.up .inner,.card.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:grid;place-items:center;padding:12px;text-align:center}
.back{background:var(--back);color:var(--backInk);font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em}
.back small{display:block;font:500 11px var(--mono);letter-spacing:.12em;opacity:.7}
.front{background:var(--panel);border:2px solid var(--line);transform:rotateY(180deg);font-weight:600;font-size:15px;line-height:1.3}
.front .num{font:500 12px var(--mono);color:var(--muted);display:block;margin-bottom:4px}
.front.t{border-color:var(--gold)}
.card.done .front{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--panel))}
.card.miss .front{border-color:var(--bad)}
.emoji{font-size:22px;display:block;margin-bottom:2px}
.scen{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:16px}
.scen .q{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,32px);line-height:1.2;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--chip);color:var(--ink);border-radius:14px;padding:14px 16px;font:600 17px var(--body);cursor:pointer;display:grid;gap:2px}
.opt small{font:500 12px var(--mono);color:var(--muted)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.fb{border-radius:12px;padding:12px 14px;background:var(--chip);font-size:16px}
.fb b{font-family:var(--display)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.end{text-align:center;display:grid;gap:12px;justify-items:center}
.big{font-family:var(--display);font-weight:800;font-size:56px;color:var(--gold);line-height:1}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px;text-align:left;width:100%}
.list div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.list b{display:block;font-size:15px}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
<style>
.ev{display:grid;gap:8px}
.evb{text-align:left;border:2px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:12px 14px;font:500 16px var(--body);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.evb .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.evb[aria-pressed="true"]{border-color:var(--gold)}
.evb[aria-pressed="true"] .box{background:var(--gold);border-color:var(--gold);color:#1A1406}
.evb.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.evb.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.evb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.story{font-size:clamp(18px,2.2vw,22px);line-height:1.45;background:var(--chip);border-radius:14px;padding:16px 18px;border-left:6px solid var(--gold)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.lvb{text-align:left;border:2px solid var(--line);background:var(--chip);color:var(--ink);border-radius:14px;padding:14px 16px;font:500 15px var(--body);cursor:pointer;display:grid;gap:4px}
.lvb b{font-family:var(--display);font-size:20px}.lvb small{color:var(--muted)}
.lvb[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--panel))}
.lvb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tag{display:inline-block;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--gold);color:#1A1406;margin-left:6px;vertical-align:middle}
.numrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.numrow input{font:600 20px var(--mono);padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);width:min(220px,100%)}
.numrow input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#14213D;font-weight:700;padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:all .3s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.steps span{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--chip);color:var(--muted)}
.steps span.on{background:var(--gold);color:#1A1406}
.steps span.ok{background:color-mix(in srgb,var(--good) 25%,var(--panel));color:var(--ink)}
.model{background:var(--chip);border-radius:12px;padding:14px 16px;font-size:16px;text-align:left}
.model p{margin:4px 0}
.units{display:flex;flex-wrap:wrap;gap:6px}
.units .btn{padding:8px 12px;font-size:14px}
.units .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>

<script>
const C=[
 {u:1,n:"Dev, 18",t:"$50 a month, starting now",s:"Dev just started his first job. He sets up an automatic $50 a month into a Roth IRA index fund. His friend says, \"$50 is nothing, wait until you're 30 and making real money.\" Dev keeps investing anyway.",smart:true,
  ev:[["Starting at 18 gives his money about 44 years to grow before retirement.",1],["His growth will start earning growth of its own (compounding).",1],["Stocks go up every single year, so he can't lose.",0],["$50 is too small to make any difference.",0],["He picked a blue theme in his investing app.",0]],
  re:["Because time does the heavy lifting, small early contributions can grow into much more than he puts in.","Because starting early guarantees he'll be a millionaire.","Because investing means he never needs a budget."],r:0},
 {u:2,n:"Sofia, 22",t:"Rent based on her salary",s:"Sofia accepts a job paying $52,000 a year. She divides by 12, gets $4,333 a month, and signs a lease for $1,600 rent, figuring she'll still have $2,733 left for everything else.",smart:false,
  ev:[["$4,333 is gross pay: federal and state tax, Social Security and Medicare (7.65%) come out first.",1],["Her net pay will be much lower, so $1,600 is a bigger share of what she actually takes home.",1],["The apartment has a pool and a gym.",0],["Social Security and Medicare are optional deductions.",0],["She'll be paid every two weeks.",0]],
  re:["She should budget from net pay, not gross, or she could come up short every month.","Rent should always be exactly half of gross pay.","Taxes only come out in April, so her paychecks will be full."],r:0},
 {u:2,n:"Malik, 17",t:"The pay stub looks fine",s:"Malik earns $18 an hour and worked 46 hours this week. His pay stub shows $828 gross pay. He figures the computer did the math, so he doesn't check it.",smart:false,
  ev:[["Overtime pays 1.5 × $18 = $27 an hour for the 6 hours over 40.",1],["Correct gross pay is $720 + $162 = $882, so the stub is $54 short.",1],["YTD stands for year to date.",0],["Overtime is paid at double time for everyone.",0],["Pay stubs are never wrong because payroll is automatic.",0]],
  re:["Checking every stub catches payroll mistakes, so he gets the $54 he earned.","He should ignore it because overtime doesn't count until next year.","He should quit because the employer stole from him on purpose."],r:0},
 {u:5,n:"Ana, 21",t:"Where the emergency fund lives",s:"Ana keeps her $3,000 emergency fund in a high-yield savings account at an FDIC-insured online bank. Her paycheck goes by direct deposit into checking, which she uses for everyday spending.",smart:true,
  ev:[["A high-yield savings account earns more interest than a regular savings account.",1],["FDIC insurance protects up to $250,000 per depositor, per bank.",1],["A 5-year CD is the best place for money you might need tomorrow.",0],["Online banks never charge any fees at all.",0],["Her debit card is purple.",0]],
  re:["Her emergency money is safe, easy to reach and still earning interest.","Her money is locked away so she can never spend it.","Checking accounts earn the most interest, so she should move it all there."],r:0},
 {u:6,n:"Erik, 19",t:"Four store cards in a month",s:"Erik opens four store cards in one month to get discounts. He maxes out one of them and pays the minimum \"when I remember.\" He says his score doesn't matter until he buys a house.",smart:false,
  ev:[["Late or missed payments hurt payment history, the biggest part of a score (35%).",1],["Maxing a card raises utilization, which hurts amounts owed (30%).",1],["Store cards have fun logos.",0],["Checking your own credit score lowers it.",0],["Credit Karma is one of the three credit bureaus.",0]],
  re:["His score will drop, so car loans and apartments will cost more or he could be denied.","His score only matters for houses, so it's fine.","Store cards can't affect a credit score."],r:0},
 {u:6,n:"Jada, 18",t:"Building credit the slow way",s:"Jada opens a secured credit card with a $500 limit. She puts only her $40 phone bill on it and sets up autopay to pay the full balance every month.",smart:true,
  ev:[["Paying in full and on time builds payment history (35%).",1],["Using $40 of $500 keeps utilization under 30%, which helps amounts owed.",1],["Secured cards come in many colors.",0],["She should check her score daily because checking it raises it.",0],["Paying the minimum is better than paying in full.",0]],
  re:["She builds a strong score without ever paying interest.","She'll have perfect credit after one month.","Autopay means she never has to read a statement."],r:0},
 {u:7,n:"Priya, 22",t:"Buying a first car",s:"Priya gets pre-approved at her credit union, adds about 10% for tax, title and registration to her budget, chooses a 48-month loan instead of 72, and shops near the end of the month.",smart:true,
  ev:[["Pre-approval gives her a rate to compare, so she can negotiate like a cash buyer.",1],["A 48-month loan costs less total interest than a 72-month loan.",1],["She likes red cars.",0],["Dealer financing is always the cheapest option.",0],["Tax, title and registration are included free at every dealership.",0]],
  re:["She knows the total cost and keeps interest low, so she pays less for the same car.","A shorter loan always has a lower monthly payment.","Shopping at the end of the month makes the car free."],r:0},
 {u:7,n:"Noah, 23",t:"Buying a house this month",s:"Noah started a new job three months ago. He has no savings, plans to put 3% down, opened two store cards for furniture, and wants to skip pre-approval and just make offers.",smart:false,
  ev:[["Lenders look for a stable job (about 2 years) and a safety net of savings.",1],["Under 20% down means no premium pricing and a bigger loan.",1],["The house is a 3/2.",0],["PITI stands for Price, Inspection, Title, Income.",0],["New store cards help you qualify for a mortgage.",0]],
  re:["Without savings or steady income, one surprise could make him miss mortgage payments.","Buying is always better than renting, no matter what.","A realtor will pay his down payment."],r:0},
 {u:9,n:"Lily, 24",t:"All in on one stock",s:"Lily's employer matches 4% in her 401(k), but she skips it to get a bigger paycheck. In her own account she puts everything into one stock her cousin says is \"going to the moon.\"",smart:false,
  ev:[["One stock isn't diversified: if that company struggles, she loses big.",1],["Skipping the match turns down free money from her employer.",1],["A share of stock is part ownership of a company.",0],["Target-date funds are only for teachers.",0],["Her cousin is really nice.",0]],
  re:["She takes on more risk and gets less free money, so she'll likely have less at retirement.","One stock is safer because it's easier to follow.","The match only matters after age 50."],r:0},
 {u:4,n:"Sam, 22",t:"The giant refund",s:"Sam sets his W-4 so a lot of extra tax comes out of every paycheck. He loves getting a $3,000 refund every April and calls it \"free money from the IRS.\"",smart:false,
  ev:[["A big refund means he overpaid tax all year.",1],["It's an interest-free loan to the government; he could have kept about $250 a month.",1],["Taxes are due April 15.",0],["Refunds are bonus money the IRS adds.",0],["The W-2 is the form that sets withholding.",0]],
  re:["Adjusting his W-4 puts more money in each paycheck to save or invest now.","He should stop filing taxes so the IRS keeps it.","A bigger refund lowers his tax bracket."],r:0},
 {u:9,n:"Mia, 25",t:"Protecting her family",s:"Mia uses a 50/30/20 budget, keeps a 3-month emergency fund, pays $15 a month for renters insurance, and has a will that names a guardian for her son.",smart:true,
  ev:[["Renters insurance protects her belongings for a small premium.",1],["A will names who cares for her son and who receives her property.",1],["Estate planning is only for rich people.",0],["Collision insurance covers a stolen laptop.",0],["She likes using budgeting apps.",0]],
  re:["Her plan protects her money and her family from big, unexpected costs.","She'll never have an unexpected expense again.","A will lets her skip paying taxes."],r:0},
 {u:8,n:"Chris, 21",t:"Dropping car insurance",s:"Chris financed a car last month. To save $140 a month, he cancels his insurance and says, \"I'm a good driver, nothing will happen.\"",smart:false,
  ev:[["Lenders require liability plus full coverage (collision and comprehensive) on a financed car.",1],["One accident could cost thousands he can't afford.",1],["His car is blue.",0],["Liability insurance pays to fix your own car.",0],["Insurance premiums never change.",0]],
  re:["Insurance transfers a risk he can't afford to absorb, and driving without it breaks his loan terms.","Good drivers never need insurance.","He can buy insurance after an accident."],r:0},
];
const UN={"1": "Unit 1 · Compounding", "2": "Unit 2 · Your Paycheck", "3": "Unit 3 · Budgeting", "4": "Unit 4 · Taxes", "5": "Unit 5 · Banking", "6": "Unit 6 · Credit", "7": "Unit 7 · Big Purchases", "8": "Unit 8 · Insurance", "9": "Unit 9 · Investing, Retirement & Estate Planning"};
const CH=[{"u": 1, "n": "Jordan, 20", "t": "Pausing during a crash", "smart": false, "need": 3, "s": "Jordan invests $200 a month in an S&P 500 index fund. The market drops 25%. Jordan sells everything and stops investing to \"wait until things calm down,\" planning to start again in 5 years.", "num": {"q": "Rule of 72: at 8% a year, about how many years does it take money to double?", "a": 9, "u": "years", "tol": 0, "why": "72 ÷ 8 = 9 years. Five years out is more than half a doubling lost."}, "ev": [["Selling after a 25% drop locks in the loss instead of waiting for a recovery.", 1], ["Skipping 5 years of investing gives up time, the most powerful part of compounding.", 1], ["Buying during a drop means each $200 buys more shares at lower prices.", 1], ["The index fund owns hundreds of companies.", 0], ["$200 is about 10% of Jordan's take-home pay.", 0], ["The market never drops more than 10%.", 0], ["Selling guarantees Jordan can't lose money later.", 0]], "re": ["Staying invested through drops keeps compounding working; missing years now can cost thousands by retirement.", "Jordan should sell now and buy back once the market is clearly rising again, so he avoids the rest of the drop.", "Jordan should keep investing but switch everything into one company that's doing well right now.", "Pausing is fine because he'll invest more later to catch up, and the amount matters more than the time."], "r": 0}, {"u": 2, "n": "Keisha, 19", "t": "Two job offers", "smart": false, "need": 3, "s": "Job A pays $17 an hour for 40 hours a week, plus 5 overtime hours every week. Job B pays a $39,000 salary. Keisha picks Job B \"because a salary always pays more than hourly.\"", "num": {"q": "What is Job A's yearly gross pay, counting the 5 overtime hours every week?", "a": 41990, "u": "$", "tol": 1, "why": "40 × $17 = $680 + 5 × $25.50 = $127.50 → $807.50 a week × 52 = $41,990."}, "ev": [["Job A pays $41,990 a year, $2,990 more than Job B.", 1], ["Overtime pays 1.5× the hourly rate for hours over 40.", 1], ["Salary isn't automatically higher: you have to compare yearly gross (and benefits).", 1], ["Both jobs take out FICA at 7.65%.", 0], ["Job B's office has a nicer break room.", 0], ["Hourly workers can never get raises.", 0], ["Salaried jobs have no deductions.", 0]], "re": ["Comparing yearly pay (and benefits) before choosing keeps her from leaving thousands on the table.", "Job B is better because salaried jobs always come with better benefits, which outweigh higher pay.", "Job A is better only because overtime is taxed at a lower rate than regular pay.", "It doesn't matter much; the difference disappears once taxes are taken out."], "r": 0}, {"u": 3, "n": "Marcus, 23", "t": "The 50/30/20 check", "smart": false, "need": 3, "s": "Marcus takes home $3,000 a month. Rent $1,300 · car payment $450 · car insurance $150 · utilities $120 · groceries $300 · fun $600 · savings $80. He says his budget is fine because \"it adds up to $3,000.\"", "num": {"q": "Needs = rent + car + insurance + utilities + groceries. What percent of take-home goes to needs? (nearest whole %)", "a": 77, "u": "%", "tol": 1, "why": "$2,320 ÷ $3,000 = 77%, way above the 50% guideline."}, "ev": [["Needs take 77% of his pay, far above the 50% guideline.", 1], ["He saves only $80 (under 3%) instead of about $600 (20%).", 1], ["Rent alone is 43% of take-home, above the 30% warning line.", 1], ["Groceries are a variable expense.", 0], ["He really likes his apartment.", 0], ["50/30/20 is a law he could be fined for breaking.", 0], ["Fun money doesn't count in a budget.", 0]], "re": ["Big housing and car costs crowd out savings; a roommate or cheaper car would let him build an emergency fund.", "His budget works because every dollar is assigned, which is the only goal of budgeting.", "He should cut his $600 fun money to $0; that alone fixes the budget.", "He's fine for now because savings can wait until he earns more."], "r": 0}, {"u": 4, "n": "Elena, 24", "t": "Turning down a raise", "smart": false, "need": 3, "s": "Elena's taxable income is $47,900. Her boss offers a $6,000 raise, which would make it $53,900 and put her in the 22% bracket. She says no: \"Then ALL my pay gets taxed at 22% and I'll take home less.\"", "num": {"q": "With the raise, how many dollars of her taxable income are taxed at 22%? (22% starts above $50,400)", "a": 3500, "u": "$", "tol": 0, "why": "$53,900 − $50,400 = $3,500. Everything below that stays at 10% and 12%."}, "ev": [["Only the $3,500 above $50,400 is taxed at 22%.", 1], ["Federal tax on the $6,000 raise is about $1,070 ($2,500 × 12% + $3,500 × 22%), so she keeps about $4,930 of it before other taxes.", 1], ["Brackets are progressive: a raise never lowers take-home pay.", 1], ["The 2026 standard deduction is $16,100.", 0], ["She files her taxes online.", 0], ["Raises are not taxable income.", 0], ["Moving up a bracket doubles all of your taxes.", 0]], "re": ["Turning down the raise costs her thousands a year; only the top dollars are taxed at the higher rate.", "She should take the raise, but only because she'll get all the 22% back as a refund in April.", "She was right to worry: the raise helps, but the bracket jump cancels out most of it.", "She should take the raise only if her employer stops withholding taxes on it."], "r": 0}, {"u": 5, "n": "Tyler, 20", "t": "The close-by bank", "smart": false, "need": 3, "s": "Tyler's checking account charges $12 a month unless he keeps $1,500 in it. He usually has about $300 and overdrafts twice a month ($35 each) because he doesn't track his balance. An online bank offers free checking, low-balance alerts and a 4% HYSA. He stays put \"because the branch is close.\"", "num": {"q": "Yearly cost of Tyler's current habits: the $12 monthly fee plus two $35 overdrafts every month?", "a": 984, "u": "$", "tol": 0, "why": "$12 × 12 = $144 + $70 × 12 = $840 → $984 a year."}, "ev": [["His fees add up to about $984 a year.", 1], ["The online bank has no monthly fee and offers alerts that help prevent overdrafts.", 1], ["His $300 balance is far below the $1,500 needed to waive the fee.", 1], ["Both banks are FDIC insured up to $250,000.", 0], ["The branch gives out free coffee.", 0], ["Online banks aren't insured.", 0], ["Overdraft fees help build his credit score.", 0]], "re": ["Switching (and tracking his balance) could save him almost $1,000 a year to put toward savings.", "He should stay and just ask the bank to waive fees each time, since banks always refund them.", "He should switch only for the 4% HYSA rate; the fees are a minor issue.", "He should keep his account but move to a credit card for spending so he can't overdraft."], "r": 0}, {"u": 6, "n": "Bri, 21", "t": "Just the minimum", "smart": false, "need": 3, "s": "Bri owes $3,000 on a credit card at 24% APR. She plans to pay the $60 minimum each month, and she just opened a store card to get 15% off a TV.", "num": {"q": "About how much interest does $3,000 at 24% APR add in one month?", "a": 60, "u": "$", "tol": 0, "why": "$3,000 × 0.24 ÷ 12 = $60, the whole minimum payment!"}, "ev": [["Her $60 payment only covers the interest, so the balance barely shrinks.", 1], ["The new store card adds a hard inquiry and more debt, which can lower her score.", 1], ["High balances raise her utilization (amounts owed = 30% of a FICO score).", 1], ["The TV was on sale.", 0], ["She has three credit bureaus watching her report.", 0], ["Paying the minimum lowers the APR.", 0], ["Store cards don't show up on credit reports.", 0]], "re": ["Paying more than the minimum and skipping new cards would cut years of interest and protect her score.", "She's fine as long as she never misses the minimum, because payment history is all that matters.", "She should transfer the balance to the new store card, since store cards have lower rates.", "She should close her oldest card to show lenders she's cutting back."], "r": 0}, {"u": 7, "n": "Omar & Jess, 26", "t": "Ready to buy?", "smart": true, "need": 3, "s": "Omar and Jess take home $7,500 a month together. They're pre-approved, have 6 months of expenses saved, have both been at their jobs 3+ years, and plan to stay at least 7 years. They put 20% down on a $300,000 home. Their full PITI payment is $2,050.", "num": {"q": "What percent of their take-home pay is the PITI payment? (nearest whole %)", "a": 27, "u": "%", "tol": 1, "why": "$2,050 ÷ $7,500 = 27%, under the ~28–30% guideline."}, "ev": [["20% down ($60,000) means no PMI and a smaller loan.", 1], ["PITI is about 27% of take-home, under the ~28–30% guideline.", 1], ["An emergency fund, steady jobs and a 7+ year plan protect them if something goes wrong.", 1], ["Home prices always double every 5 years.", 0], ["Renting is always throwing money away.", 0], ["They love the kitchen.", 0], ["They can skip the home inspection to save money.", 0]], "re": ["They can afford it and have a safety net, so owning can build equity without wrecking their budget.", "It's smart mainly because home values always rise, so they're guaranteed a profit when they sell.", "It's smart because a mortgage payment is always cheaper than rent in the same area.", "It's smart because putting 20% down means they won't have property taxes or insurance."], "r": 0}, {"u": 8, "n": "Leah, 24", "t": "The cheap health plan", "smart": false, "need": 3, "s": "Leah has asthma and expects about $4,000 of care this year. She has $800 saved. Plan A: $90/month, $5,000 deductible, then 20%, $7,000 out-of-pocket max. Plan B: $230/month, $1,000 deductible, then 20%, $3,000 out-of-pocket max. She picks Plan A \"to save money.\"", "num": {"q": "Plan A yearly cost with $4,000 of care: 12 premiums + what she pays (all $4,000 is under the deductible)?", "a": 5080, "u": "$", "tol": 0, "why": "$90 × 12 = $1,080 + $4,000 = $5,080. Plan B: $2,760 + $1,000 + 20% × $3,000 = $4,360."}, "ev": [["For her expected care, Plan A costs about $720 more than Plan B ($5,080 vs. $4,360).", 1], ["Plan A's $5,000 deductible is far more than her $800 in savings.", 1], ["Plan B's $3,000 out-of-pocket max protects her better in an emergency.", 1], ["Both plans use 20% coinsurance.", 0], ["Plan A's website is easier to use.", 0], ["Young people never need health insurance.", 0], ["A lower premium always means a cheaper year.", 0]], "re": ["Choosing by total yearly cost (premium + expected care), not just the premium, would save her money and stress.", "Plan A is fine because she can put the $5,000 deductible on a credit card and pay it off slowly.", "Plan B is better only because it has lower coinsurance.", "She should pick Plan A and switch to Plan B whenever she gets sick."], "r": 0}, {"u": 9, "n": "Grace, 30", "t": "\"My family will get it\"", "smart": false, "need": 3, "s": "Grace has $45,000 in her 401(k) in a fund with a 1.1% fee. Her beneficiary is still her college roommate. She has a 2-year-old, no will, and says, \"If anything happens, my family will just get everything.\"", "num": {"q": "How much more does a 1.1% fee cost per year than a 0.05% index fund on $45,000?", "a": 472.5, "u": "$", "tol": 0.01, "why": "$45,000 × 1.05% = $472.50 a year, and it grows as her balance grows."}, "ev": [["The beneficiary form usually overrides a will, so her roommate would get the 401(k).", 1], ["Without a will, a court (probate) decides who gets her things and who raises her child.", 1], ["The 1.1% fee costs about $472.50 more per year than a low-cost index fund.", 1], ["A 401(k) is a retirement account.", 0], ["Her roommate lives in another state.", 0], ["Families automatically get everything, no matter what forms say.", 0], ["Wills are only for people over 65.", 0]], "re": ["Updating her beneficiary, writing a will that names a guardian, and cutting fees protect her child and her money.", "She only needs a will; it automatically updates every account's beneficiary.", "She should cash out the 401(k) now and put it in her child's name to skip probate.", "The fee is the main problem; beneficiaries can be fixed by her family after she's gone."], "r": 0}];
let lvl="core";
const FMP={get(){try{const p=JSON.parse(localStorage.getItem("fm-passport"));if(p&&p.s&&p.b)return p}catch(e){}return{s:{},b:{},x:{}}},save(p){try{localStorage.setItem("fm-passport",JSON.stringify(p))}catch(e){}},
 stamp(slug,sc){const p=this.get();const s=p.s[slug]||{n:0,best:null};s.n++;if(sc!=null&&(s.best==null||sc>s.best))s.best=sc;s.t=Date.now();p.s[slug]=s;this.save(p)},
 badge(id,name){const p=this.get();if(p.b[id])return;p.b[id]=Date.now();this.save(p);toast("🏅 Passport badge earned: "+name)}};
function toast(t){const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add("show"));setTimeout(()=>el.remove(),4200)}
const BK=()=>lvl==="ch"?"case-files-best-ch":"case-files-best";
function readBest(){try{return localStorage.getItem(BK())}catch(e){return null}}
const app=document.getElementById("app"), stat=document.getElementById("stat");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let best=readBest();
let pickU=new Set();
function home(){
  stat.innerHTML="";best=readBest();const D=lvl==="ch"?CH:C;
  app.innerHTML=`<section class="intro"><div class="eyebrow">Personal Finance · Case Studies · Claim, Evidence, Reasoning</div>
  <h2>Read the case. Make the call. Back it up.</h2>
  <div class="eyebrow">Choose your level</div>
  <div class="lv"><button class="lvb" data-l="core" aria-pressed="${lvl==="core"}"><b>Core</b><span>Claim → pick the 2 strongest facts → reasoning.</span><small>${C.length} cases · 4 points each</small></button>
  <button class="lvb" data-l="ch" aria-pressed="${lvl==="ch"}"><b>Challenge <span class="tag">level up</span></b><span>Claim → run the numbers → pick 3 of 7 facts (some are true but don't prove anything) → 4 close reasoning choices.</span><small>${CH.length} new cases · 6 points each</small></button></div>
  <div class="eyebrow">Choose units (none = all)</div>
  <div class="units">${Object.entries(UN).map(([k,v])=>{const n=D.filter(c=>c.u==k).length;return n?`<button class="btn" data-u="${k}" aria-pressed="${pickU.has(+k)}">${v}</button>`:""}).join("")}</div>
  <div class="row"><button class="btn go" id="g5">5 cases</button><button class="btn" id="gall">Every case</button></div>
  ${best?`<div class="eyebrow">Your best (${lvl==="ch"?"Challenge":"Core"}): ${esc(best)}</div>`:""}</section>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lvl=b.dataset.l;pickU.clear();home()});
  app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const u=+b.dataset.u;pickU.has(u)?pickU.delete(u):pickU.add(u);b.setAttribute("aria-pressed",pickU.has(u))});
  const pool=()=>D.filter(c=>!pickU.size||pickU.has(c.u));
  document.getElementById("g5").onclick=()=>run(shuffle(pool()).slice(0,5));
  document.getElementById("gall").onclick=()=>run(shuffle(pool()));
}
function run(cases){
  let i=0,score=0,log=[];
  const head=(step)=>{stat.innerHTML=`<span>Case <b>${i+1}/${cases.length}</b></span><span>Points <b>${score}</b></span><button class="btn" id="q">Menu</button>`;document.getElementById("q").onclick=home;
    return `<div class="bar"><i style="width:${i/cases.length*100}%"></i></div>
    <div class="steps">${(cases[i].num?["Claim","Numbers","Evidence","Reasoning"]:["Claim","Evidence","Reasoning"]).map((s,k)=>`<span class="${k===step?"on":k<step?"ok":""}">${k+1}. ${s}</span>`).join("")}</div>
    <div class="eyebrow">${UN[cases[i].u]} · ${esc(cases[i].n)}${cases[i].num?" · Challenge":""}</div><div class="q">${esc(cases[i].t)}</div><div class="story">${esc(cases[i].s)}</div>`};
  const claim=()=>{const c=cases[i];let pts={c:0,e:0,r:0};
    app.innerHTML=`<section class="scen">${head(0)}<div class="eyebrow">Claim: is this plan smart?</div>
    <div class="opts"><button class="opt" data-v="1">Smart plan</button><button class="opt" data-v="0">Not a smart plan</button></div><div id="fb"></div></section>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(app.querySelector(".opt[disabled]"))return;const ok=(+b.dataset.v===1)===c.smart;
      app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if((+x.dataset.v===1)===c.smart)x.classList.add("right")});if(!ok)b.classList.add("wrong");
      if(ok){pts.c=1;score++}
      fb(ok?"Right call.":"Look again.",`This plan is ${c.smart?"<b>smart</b>":"<b>not smart</b>"}. ${c.num?"Now prove it with math.":"Now find the evidence."}`,()=>c.num?numbers(pts):evidence(pts))})};
  const numbers=(pts)=>{const c=cases[i],q=c.num;
    app.innerHTML=`<section class="scen">${head(1)}<div class="eyebrow">Run the numbers (calculator OK)</div><div class="q" style="font-size:19px">${esc(q.q)}</div>
    <div class="numrow">${q.u==="$"?'<b style="font-size:20px">$</b>':''}<input id="na" inputmode="decimal" autocomplete="off" aria-label="Your answer">${q.u!=="$"?`<b>${esc(q.u)}</b>`:""}<button class="btn go" id="nc">Check</button></div><div id="fb"></div></section>`;
    const inp=document.getElementById("na"),nc=document.getElementById("nc");inp.focus();
    const go=()=>{const v=parseFloat(inp.value.replace(/[$,%\s]/g,""));if(isNaN(v)){inp.focus();return}
      inp.disabled=true;nc.disabled=true;const ok=Math.abs(v-q.a)<=q.tol+1e-9;if(ok){pts.n=1;score++}
      const ans=q.u==="$"?"$"+q.a.toLocaleString("en-US",{minimumFractionDigits:q.a%1?2:0}):q.a+" "+q.u;
      fb(ok?"Math checks out.":"Not quite.",`Answer: <b>${ans}</b>. ${esc(q.why)}`,()=>evidence(pts))};
    nc.onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()}};
  const evidence=(pts)=>{const c=cases[i];const ev=shuffle(c.ev);let sel=new Set();const N=c.need||2,W=["","1","2","3"][N];
    app.innerHTML=`<section class="scen">${head(c.num?2:1)}<div class="eyebrow">Evidence: pick the ${W} strongest facts that support "${c.smart?"smart":"not smart"}"${c.num?" (watch out: some facts are true but don't prove anything)":""}</div>
    <div class="ev">${ev.map((e,k)=>`<button class="evb" data-k="${k}" aria-pressed="false"><span class="box"></span><span>${esc(e[0])}</span></button>`).join("")}</div>
    <div class="row"><button class="btn go" id="chk" disabled>Check my evidence</button></div><div id="fb"></div></section>`;
    const chk=document.getElementById("chk");
    app.querySelectorAll(".evb").forEach(b=>b.onclick=()=>{if(chk.dataset.done)return;const k=+b.dataset.k;
      if(sel.has(k))sel.delete(k);else{if(sel.size===N)return;sel.add(k)}
      b.setAttribute("aria-pressed",sel.has(k));b.querySelector(".box").textContent=sel.has(k)?"✓":"";chk.disabled=sel.size!==N});
    chk.onclick=()=>{chk.dataset.done=1;chk.disabled=true;let got=0;
      app.querySelectorAll(".evb").forEach(b=>{const k=+b.dataset.k;b.disabled=true;if(ev[k][1])b.classList.add("right");else if(sel.has(k))b.classList.add("wrong");if(sel.has(k)&&ev[k][1])got++});
      pts.e=got;score+=got;
      fb(got===N?"Strong evidence.":got>0?`${got} of ${N}.`:"Not the strongest.",got===N?"Every fact you picked supports the claim.":"The green facts are the strongest. Red ones are either wrong or don't prove the claim.",()=>reason(pts))}};
  const reason=(pts)=>{const c=cases[i];const order=shuffle(c.re.map((_,k)=>k));
    app.innerHTML=`<section class="scen">${head(c.num?3:2)}<div class="eyebrow">Reasoning: why does it matter for their future?</div>
    <div class="opts" style="grid-template-columns:1fr">${order.map(k=>`<button class="opt" data-k="${k}">${esc(c.re[k])}</button>`).join("")}</div><div id="fb"></div></section>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(app.querySelector(".opt[disabled]"))return;const ok=+b.dataset.k===c.r;
      app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===c.r)x.classList.add("right")});if(!ok)b.classList.add("wrong");
      if(ok){pts.r=1;score++}log.push([c,pts.c+pts.e+pts.r+(pts.n||0)]);
      const strong=c.ev.filter(e=>e[1]).map(e=>e[0]);
      document.getElementById("fb").innerHTML=`<div class="model"><div class="eyebrow">Model CER</div><p><b>Claim:</b> ${esc(c.n.split(",")[0])}'s plan is ${c.smart?"smart":"not smart"}.</p><p><b>Evidence:</b> ${strong.map(esc).join(" ")}</p><p><b>Reasoning:</b> ${esc(c.re[c.r])}</p></div>
      <div class="row" style="margin-top:12px"><button class="btn go" id="nx">${i+1<cases.length?"Next case":"See results"}</button></div>`;
      stat.querySelector("span:nth-child(2) b").textContent=score;const nx=document.getElementById("nx");nx.focus();nx.onclick=()=>{i++;i<cases.length?claim():done()}})};
  const fb=(h,t,next)=>{document.getElementById("fb").innerHTML=`<div class="fb"><b>${h}</b> ${t}</div><div class="row" style="margin-top:12px"><button class="btn go" id="nx">Next step</button></div>`;
    stat.querySelector("span:nth-child(2) b").textContent=score;const nx=document.getElementById("nx");nx.focus();nx.onclick=next};
  const done=()=>{const max=cases.reduce((s,c)=>s+(c.num?6:4),0), pct=Math.round(score/max*100);const txt=`${score}/${max} (${pct}%)`;
    let prev=0;try{prev=parseInt((localStorage.getItem(BK())||"0").split("(")[1])||0}catch(e){}
    if(pct>=prev){best=txt;try{localStorage.setItem(BK(),txt)}catch(e){}}
    FMP.stamp(lvl==="ch"?"case-files-challenge":"case-files",pct);
    if(cases.length>=5&&pct>=80)FMP.badge(lvl==="ch"?"case-closer":"cer-pro",lvl==="ch"?"Case Closer":"CER Pro");
    stat.innerHTML=`<button class="btn" id="q">Menu</button>`;document.getElementById("q").onclick=home;
    app.innerHTML=`<section class="intro end"><div class="eyebrow">Case Files · results</div><div class="big">${score}/${max}</div><p>${pct>=90?"Ready for any CER on the quiz.":pct>=70?"Solid. Review the cases below that cost you points.":"Keep practicing: the strongest evidence names a course concept AND what it does."}</p>
    <div class="list">${log.map(([c,p])=>`<div><b>${esc(c.t)} · ${p}/${c.num?6:4}</b>${UN[c.u]}</div>`).join("")}</div>
    <div class="row"><button class="btn go" id="a">New cases</button><button class="btn" id="b">Menu</button></div></section>`;
    document.getElementById("a").onclick=()=>run(shuffle((lvl==="ch"?CH:C).filter(c=>!pickU.size||pickU.has(c.u))).slice(0,5));document.getElementById("b").onclick=home};
  claim();
}
home();
</script>
