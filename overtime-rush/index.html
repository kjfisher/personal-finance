<style>
/* Layout: a punch-clock timecard on the left shows the job, wage and hours; the answer sheet on the right follows the worksheet's 5 overtime steps. A running clock in the top bar makes it a rush. */
:root {
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6780; --line:#CBD3DF;
  --hero:#14213D; --hero-ink:#F3F5F8; --gold:#E0A800; --ok:#0F8B6C; --ok-soft:#DDF1EA; --bad:#C23B3B; --bad-soft:#FBE7E7;
  --card:#F7F1DE; --card-line:#C9B98A; --card-ink:#3B3220; --punch:#B8572F;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0D1424; --surface:#16203A; --ink:#E8EDF5; --muted:#93A0B8; --line:#2A3A5E;
  --hero:#101A30; --gold:#F5C542; --ok:#3CCB9F; --ok-soft:#123A32; --bad:#F07070; --bad-soft:#3A1C24;
  --card:#2A2618; --card-line:#5C5236; --card-ink:#EDE3C8; --punch:#F08A5D; color-scheme:dark } }
:root[data-theme="dark"] {
  --bg:#0D1424; --surface:#16203A; --ink:#E8EDF5; --muted:#93A0B8; --line:#2A3A5E;
  --hero:#101A30; --gold:#F5C542; --ok:#3CCB9F; --ok-soft:#123A32; --bad:#F07070; --bad-soft:#3A1C24;
  --card:#2A2618; --card-line:#5C5236; --card-ink:#EDE3C8; --punch:#F08A5D; color-scheme:dark }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden] { display:none !important; }
body { background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; margin:0; }
.bar { background:var(--hero); color:var(--hero-ink); }
.bar .inner { max-width:1180px; margin:0 auto; padding-block:14px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; justify-content:space-between; }
.bar h1 { font-family:var(--display); font-weight:800; font-size:clamp(24px, 3.4vw, 34px); margin:0; line-height:1; }
.bar h1 span { color:var(--gold); }
.bar .stats { display:flex; gap:16px; font-family:var(--mono); font-size:15px; flex-wrap:wrap; align-items:center; }
.bar .stats b { color:var(--gold); font-variant-numeric:tabular-nums; }
.wrap { max-width:1180px; margin:0 auto; padding-block:20px 40px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.game { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.1fr); gap:20px; align-items:start; }
@media (max-width:820px) { .game { grid-template-columns:1fr; } }
.progress { height:8px; background:var(--line); border-radius:99px; overflow:hidden; grid-column:1/-1; }
.progress i { display:block; height:100%; background:var(--ok); transition:width .3s; }
/* timecard */
.tc { background:var(--card); color:var(--card-ink); border:1px solid var(--card-line); border-radius:6px; padding:18px; font-family:var(--mono); font-size:15px; display:grid; gap:10px; min-width:0; position:relative; }
.tc::before { content:""; position:absolute; top:10px; left:50%; width:44px; height:10px; margin-left:-22px; border-radius:6px; background:var(--bg); border:1px solid var(--card-line); }
.tc .kind { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--punch); font-weight:600; margin-top:8px; }
.tc h2 { font-family:var(--display); font-size:24px; margin:0; line-height:1.1; color:var(--card-ink); }
.tc .who { display:flex; flex-wrap:wrap; gap:4px 16px; }
.tc .who b { font-weight:600; }
.tc table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
.tc th, .tc td { border-bottom:1px dashed var(--card-line); padding:5px 4px; text-align:left; }
.tc td:last-child, .tc th:last-child { text-align:right; }
.tc th { font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; }
.tc .stamp { color:var(--punch); font-weight:600; }
.tc .rule { border:1px solid var(--card-line); border-radius:6px; padding:8px 10px; font-size:14px; line-height:1.4; font-family:var(--body); }
.tc .story { font-family:var(--body); font-size:17px; line-height:1.45; }
/* answer sheet */
.sheet { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:clamp(16px, 2.6vw, 26px); display:grid; gap:12px; min-width:0; }
.sheet .eyebrow { font-family:var(--mono); font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.field { display:grid; grid-template-columns:minmax(0, 1fr) minmax(120px, 190px); gap:10px; align-items:center; padding:8px 10px; border-radius:12px; border:2px solid transparent; }
.field.ok { background:var(--ok-soft); border-color:var(--ok); }
.field.no { background:var(--bad-soft); border-color:var(--bad); }
.field.shown { background:var(--bad-soft); }
.field .q { line-height:1.3; }
.field .q small { display:block; color:var(--muted); font-family:var(--mono); font-size:13px; margin-top:2px; }
.field .msg { grid-column:1/-1; font-size:15px; line-height:1.35; }
.inp { display:flex; align-items:center; border:2px solid var(--line); border-radius:10px; background:var(--bg); padding:0 10px; min-width:0; }
.inp:focus-within { border-color:var(--gold); }
.inp span { font-family:var(--mono); color:var(--muted); }
.inp input { flex:1; min-width:0; border:none; background:transparent; color:var(--ink); font-family:var(--mono); font-size:20px; padding:9px 6px; outline:none; }
.inp input:disabled { color:var(--ink); }
.row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.btn { font:inherit; font-weight:700; padding:12px 20px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
.btn.go { background:var(--ok); color:#fff; border-color:var(--ok); }
.btn.gold { background:var(--gold); color:#14213D; border-color:var(--gold); }
.bar .btn { color:var(--hero-ink); background:transparent; border-color:rgba(255,255,255,.3); padding:8px 14px; }
.btn:focus-visible, input:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
.note { color:var(--muted); font-size:15px; margin:0; }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:clamp(18px, 3vw, 30px); display:grid; gap:14px; }
.panel h2 { font-family:var(--display); font-weight:800; font-size:clamp(28px, 4vw, 44px); margin:0; line-height:1.05; text-wrap:balance; }
.panel p { margin:0; line-height:1.45; max-width:65ch; }
.steps { margin:0; padding-left:22px; line-height:1.6; }
.big { font-family:var(--display); font-weight:800; font-size:clamp(40px, 7vw, 68px); line-height:1; color:var(--ok); font-variant-numeric:tabular-nums; }
.skills { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px; }
.skill { border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:4px; }
.skill b { font-family:var(--display); font-size:18px; }
.skill .v { font-family:var(--mono); font-size:15px; }
.pill { justify-self:start; font-size:13px; font-weight:700; padding:2px 10px; border-radius:99px; }
.pill.g { background:var(--ok-soft); color:var(--ok); } .pill.a { background:rgba(224,168,0,.18); color:var(--ink); } .pill.r { background:var(--bad-soft); color:var(--bad); }
@media (prefers-reduced-motion: reduce) { .progress i { transition:none; } }

<header class="bar"><div class="inner"><h1>Overtime <span>Rush</span></h1><div class="stats" id="stats"></div></div></header>
<div class="wrap" id="root"></div>

<script>
const WAGES=[15.50,17.50,18.40,19.00,20.50,21.00,23.50,24.00,26.50,27.00,28.50,31.00];
const NAMES=["Avery","Jalen","Priya","Marco","Leah","Diego","Tess","Omar","Hana","Ruby","Eli","Nadia","Caleb","Zoe"];
const JOBS=["Warehouse Associate","Line Cook","Retail Associate","Barista","Delivery Driver","Lifeguard","Stock Clerk","Hotel Front Desk","Landscaper","Shift Supervisor","Pharmacy Tech","Dental Assistant"];
const SALES=[["car salesperson","a used SUV",[18000,36000],[3,4,5]],["real estate agent","a house",[240000,560000],[2.5,3]],["insurance agent","a year of policies",[40000,90000],[6,8,10]],["furniture salesperson","a living room set",[2200,6800],[5,6,8]]];
const SKILL={wk:"Weekly overtime", day:"Daily overtime rule", two:"Two-week pay period", com:"Commission", cmp:"Hourly vs. salary"};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const fmt=x=>"$"+x.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const num=s=>{ s=String(s).replace(/[$,\s]/g,"").replace(/hrs?|hours?/ig,""); return s===""||isNaN(s)?NaN:+s; };

function weekDays(total){ // spread total whole hours over Mon–Fri (+Sat if needed)
  const days=total>48?6:5; const base=Math.floor(total/days); const arr=Array(days).fill(base); let left=total-base*days;
  while(left>0){ const i=rnd(0,days-1); if(arr[i]<12){ arr[i]++; left--; } }
  for(let k=0;k<4;k++){ const a=rnd(0,days-1), b=rnd(0,days-1); if(a!==b&&arr[a]>6&&arr[b]<11){ arr[a]--; arr[b]++; } }
  return arr; }
function mkWeekly(forceNoOT){
  const w=pick(WAGES), total=forceNoOT?pick([36,38,40]):rnd(42,52), days=weekDays(total);
  const ot=Math.max(0,total-40), rate=r2(w*1.5), reg=r2(w*Math.min(total,40)), otPay=r2(rate*ot), tot=r2(reg+otPay);
  const F=[
   {k:"hrs", q:"Total hours worked", unit:"hrs", a:total, miss:[[total-days[days.length-1],"Add every day on the timecard."]]},
   {k:"oth", q:"Overtime hours", sub:"hours over 40", unit:"hrs", a:ot, miss:[[total,"Only the hours OVER 40 are overtime."],[ot+8,"Federal overtime is weekly: hours over 40 in the week."]]},
   {k:"reg", q:"Regular pay", sub:"hourly rate × first 40 hours", a:reg, miss:[[w*total,"Regular pay only covers the first 40 hours."],[w*40*1.5,"Regular hours are paid at the regular rate."]]},
   {k:"rate", q:"Overtime rate", sub:"hourly rate × 1.5", a:rate, miss:[[w*.5,"That's only the extra half. Overtime rate is the full rate × 1.5."],[w*2,"Federal overtime is time-and-a-half (1.5×), not double."],[w+1.5,"Multiply by 1.5. Don't add 1.5."]]},
   {k:"otp", q:"Overtime pay", sub:"overtime rate × overtime hours", a:otPay, miss:[[w*ot,"You used the regular rate. Use the overtime rate."],[rate*total,"Only the overtime hours get the overtime rate."]]},
   {k:"tot", q:"Total pay for the week", sub:"regular pay + overtime pay", a:tot, miss:[[w*total,"That pays every hour at the regular rate. Add the overtime extra."],[rate*total,"Only hours over 40 get overtime. The first 40 are regular."],[reg,"Add the overtime pay too."]]}];
  return {type:"wk", name:pick(NAMES), job:pick(JOBS), w, days, F};
}
function mkDaily(){
  const w=pick(WAGES), h=rnd(9,12), ot=h-8, rate=r2(w*1.5), tot=r2(w*8+rate*ot);
  return {type:"day", name:pick(NAMES), job:pick(JOBS), w, shift:h, F:[
   {k:"oth", q:"Overtime hours this shift", sub:"hours over 8", unit:"hrs", a:ot, miss:[[0,"This employer pays overtime after 8 hours in a DAY."],[h,"Only the hours after 8 are overtime."]]},
   {k:"rate", q:"Overtime rate", sub:"hourly rate × 1.5", a:rate, miss:[[w*.5,"That's only the extra half. Use the full rate × 1.5."],[w*2,"Time-and-a-half is 1.5×, not double."]]},
   {k:"tot", q:"Gross pay for the shift", sub:"(rate × 8) + (OT rate × OT hours)", a:tot, miss:[[w*h,"That pays every hour at the regular rate."],[rate*h,"The first 8 hours are paid at the regular rate."],[w*8,"Add the overtime hours too."]]}]};
}
function mkTwo(){
  const w=pick(WAGES), a=rnd(32,39), b=rnd(43,48), otB=b-40, rate=r2(w*1.5), tot=r2(w*(a+40)+rate*otB);
  return {type:"two", name:pick(NAMES), job:pick(JOBS), w, wk:[a,b], F:[
   {k:"ot1", q:"Overtime hours in Week 1", unit:"hrs", a:0, miss:[[a-40,"You can't have negative overtime. Under 40 hours = 0 overtime."]]},
   {k:"ot2", q:"Overtime hours in Week 2", unit:"hrs", a:otB, miss:[[Math.max(0,a+b-80),"Overtime is counted week by week, not across two weeks."],[b,"Only the hours over 40 are overtime."]]},
   {k:"tot", q:"Gross pay for the two weeks", sub:"all regular hours + Week 2 overtime", a:tot, miss:[[w*(a+b),"Week 2's extra hours earn overtime. Pay them at 1.5×."],[w*(a+b)+rate*Math.max(0,a+b-80),"Count overtime week by week."],[rate*otB+w*40,"Don't forget Week 1's pay."]]}]};
}
function mkCom(withBase){
  if(withBase){ const base=pick([400,450,500,550]), sales=rnd(60,180)*100, pct=pick([3,4,5,6]), com=r2(sales*pct/100), tot=r2(base+com);
    return {type:"com", name:pick(NAMES), base, sales, pct, F:[
      {k:"com", q:"Commission earned", sub:"sales × rate as a decimal", a:com, miss:[[sales*pct/10,"Decimal slip: "+pct+"% = 0."+String(pct).padStart(2,"0")+"."],[sales*pct,"Change the percent to a decimal first."]]},
      {k:"tot", q:"Total pay for the week", sub:"base pay + commission", a:tot, miss:[[com,"Add the base pay too."],[base,"Add the commission too."]]}]}; }
  const s=pick(SALES), price=s[0]==="real estate agent"?rnd(s[2][0]/1000,s[2][1]/1000)*1000:rnd(s[2][0]/50,s[2][1]/50)*50, pct=pick(s[3]), com=r2(price*pct/100);
  const dec=String(pct/100);
  return {type:"com", name:pick(NAMES), role:s[0], item:s[1], price, pct, F:[
   {k:"com", q:"Commission earned", sub:`price × ${dec}`, a:com, miss:[[price*pct/10,"Decimal slip: "+pct+"% = "+dec+"."],[price*pct,"Change the percent to a decimal first."],[price-com,"That's the price minus commission. Just find the commission."]]}]};
}
function mkCmp(){
  const w=pick([17.50,19.00,20.50,21.00,23.50,24.50]), hourlyYr=r2(w*40*52), sal=rnd(Math.round(hourlyYr/1000)-6, Math.round(hourlyYr/1000)+6)*1000, diff=r2(Math.abs(hourlyYr-sal));
  return {type:"cmp", w, sal, F:[
   {k:"yr", q:"Job B's yearly pay", sub:"hourly × 40 × 52", a:hourlyYr, miss:[[w*40,"That's one week. Multiply by 52 weeks too."],[w*40*12,"There are 52 weeks in a year, not 12."],[w*2080/12,"That's monthly. Find the yearly pay."]]},
   {k:"diff", q:"How much MORE per year does the higher-paying job pay?", sub:"bigger − smaller", a:diff, miss:[[sal+hourlyYr,"Subtract to find the difference."]]}],
   note: hourlyYr>sal?"Job B (hourly) pays more, and it can earn overtime on top of that.":hourlyYr<sal?"Job A (salary) pays more. Job B could catch up with overtime hours.":"They pay the same. Now benefits and overtime decide."};
}
function makeRound(){
  const list=[mkWeekly(false), mkWeekly(false), Math.random()<.5?mkWeekly(true):mkWeekly(false), mkDaily(), mkTwo(), mkCom(false), mkCom(true), mkCmp()];
  return [list[0], ...shuffle(list.slice(1))];
}

let G=null, tick=null, best=null;
try{ best=JSON.parse(localStorage.getItem("overtime-rush-best")||"null"); }catch(e){}
const clock=ms=>{ const s=Math.floor(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
function elapsed(){ return G? (G.end||Date.now())-G.t0 : 0; }
function stats(){ const el=$("stats");
  if(!G){ el.innerHTML=`<span>Unit 2: Reading a Pay Stub</span>`; return; }
  el.innerHTML=`<span>Card <b>${Math.min(G.i+1,G.cards.length)}</b>/${G.cards.length}</span><span>Score <b>${G.score}</b></span><span>Time <b id="clk">${clock(elapsed())}</b></span>${G.phase==="play"?`<button class="btn" id="quit">Quit</button>`:""}`;
  $("quit")&&($("quit").onclick=intro); }
function intro(){
  G=null; clearInterval(tick); stats();
  $("root").innerHTML=`<div class="panel">
    <div class="eyebrow" style="font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Unit 2 · Your Paycheck: overtime &amp; pay stubs</div>
    <h2>Clock in. Work the overtime. Beat the clock.</h2>
    <p>Eight timecards: weekly overtime, a daily overtime rule, a two-week pay period, commission and a salary-vs-hourly job offer. Use the federal rule: hours over 40 in a workweek are paid at 1.5× the hourly rate.</p>
    <ol class="steps"><li>Overtime hours = hours over 40</li><li>Regular pay = hourly rate × 40</li><li>Overtime rate = hourly rate × 1.5</li><li>Overtime pay = overtime rate × overtime hours</li><li>Total pay = regular pay + overtime pay</li></ol>
    <p>Right on the first try = 10 points. Second try = 5. Use a calculator.${best?` <b>Your best: ${best.score} points in ${clock(best.ms)}.</b>`:""}</p>
    <div class="row"><button class="btn go" id="go">Clock in</button></div></div>`;
  $("go").onclick=()=>{ G={cards:makeRound(), i:0, score:0, t0:Date.now(), phase:"play", by:{}}; prep(); clearInterval(tick); tick=setInterval(()=>{ const c=$("clk"); if(c&&G&&G.phase==="play") c.textContent=clock(elapsed()); },1000); draw(); };
}
function prep(){ const c=G.cards[G.i]; c.st={}; c.tries={}; c.msg={}; c.val={}; c.done=false; }
function card(c){
  const head=(kind,title)=>`<div class="kind">${kind}</div><h2>${title}</h2>`;
  if(c.type==="wk"){ const D=["Mon","Tue","Wed","Thu","Fri","Sat"];
    return `<div class="tc">${head("Weekly timecard",esc(c.name)+" · "+esc(c.job))}
      <div class="who"><span>Rate <b>${fmt(c.w)}/hr</b></span><span>Overtime after <b>40 hrs/week</b></span></div>
      <table><tr><th>Day</th><th>In–Out</th><th>Hours</th></tr>${c.days.map((h,i)=>`<tr><td>${D[i]}</td><td class="stamp">${punch(h)}</td><td>${h}</td></tr>`).join("")}</table>
      <div class="rule">Hours exclude a 30-minute unpaid lunch each day.</div></div>`; }
  if(c.type==="day") return `<div class="tc">${head("Single shift",esc(c.name)+" · "+esc(c.job))}
      <div class="who"><span>Rate <b>${fmt(c.w)}/hr</b></span><span>Shift <b>${c.shift} hours</b></span></div>
      <div class="rule"><b>Employer policy:</b> regular pay for the first 8 hours of a shift, then 1.5× for every hour after 8.</div>
      <p class="story">${esc(c.name)} covered for a coworker and worked a ${c.shift}-hour shift today.</p></div>`;
  if(c.type==="two") return `<div class="tc">${head("Bi-weekly pay period",esc(c.name)+" · "+esc(c.job))}
      <div class="who"><span>Rate <b>${fmt(c.w)}/hr</b></span><span>Overtime after <b>40 hrs/week</b></span></div>
      <table><tr><th>Week</th><th>Hours</th></tr><tr><td>Week 1</td><td>${c.wk[0]}</td></tr><tr><td>Week 2</td><td>${c.wk[1]}</td></tr><tr><td><b>Pay period</b></td><td><b>${c.wk[0]+c.wk[1]}</b></td></tr></table>
      <div class="rule">One paycheck covers both weeks. Overtime is still figured one workweek at a time.</div></div>`;
  if(c.type==="com") return c.base!=null ? `<div class="tc">${head("Base + commission",esc(c.name)+" · Phone store sales")}
      <div class="who"><span>Base pay <b>${fmt(c.base)}/week</b></span><span>Commission <b>${c.pct}%</b></span></div>
      <p class="story">This week ${esc(c.name)} sold <b>${fmt(c.sales)}</b> in phones and plans.</p></div>`
    : `<div class="tc">${head("Commission",esc(c.name)+" · "+esc(c.role))}
      <div class="who"><span>Commission <b>${c.pct}%</b></span></div>
      <p class="story">${esc(c.name)} sold ${esc(c.item)} for <b>${fmt(c.price)}</b>.</p></div>`;
  return `<div class="tc">${head("Job offers","Which pays more?")}
      <table><tr><th>Job A</th><th>Job B</th></tr><tr><td>Salary ${fmt(c.sal)}/yr</td><td>${fmt(c.w)}/hr</td></tr><tr><td>No overtime</td><td>40 hrs/week, 52 weeks</td></tr><tr><td></td><td>Overtime eligible</td></tr></table></div>`;
}
function punch(h){ const total=h*60+30, out=7*60+total; const t=m=>{ let hh=Math.floor(m/60), mm=m%60, ap=hh>=12?"p":"a"; hh=hh%12||12; return hh+":"+String(mm).padStart(2,"0")+ap; }; return t(420)+"–"+t(out); }
function draw(){
  stats();
  if(!G) return intro();
  if(G.phase==="end") return end();
  const c=G.cards[G.i], n=G.cards.length;
  const fields=c.F.map((f,ix)=>{ const st=c.st[f.k]; const dis=st==="ok"||st==="shown";
    return `<div class="field ${st==="ok"?"ok":st==="shown"?"shown":c.msg[f.k]?"no":""}">
      <label class="q" for="f-${f.k}">${esc(f.q)}${f.sub?`<small>${esc(f.sub)}</small>`:""}</label>
      <div class="inp">${f.unit?"":"<span>$</span>"}<input id="f-${f.k}" inputmode="decimal" autocomplete="off" value="${esc(c.val[f.k]??"")}" ${dis?"disabled":""}>${f.unit?`<span>${f.unit}</span>`:""}</div>
      ${c.msg[f.k]?`<div class="msg">${esc(c.msg[f.k])}</div>`:""}</div>`; }).join("");
  $("root").innerHTML=`<div class="game">
    <div class="progress" aria-hidden="true"><i style="width:${(G.i+(c.done?1:0))/n*100}%"></i></div>
    ${card(c)}
    <form class="sheet" id="sheet" novalidate>
      <div class="eyebrow">${SKILL[c.type]}</div>
      ${fields}
      ${c.done&&c.note?`<p class="note"><b>${esc(c.note)}</b></p>`:""}
      <div class="row">${c.done?`<button class="btn go" type="button" id="next">${G.i+1<n?"Next timecard":"Clock out"}</button>`:`<button class="btn go" type="submit">Check</button>`}</div>
      <p class="note">Round to the cent. Leave out $ and commas if you like.</p>
    </form></div>`;
  if(c.done){ $("next").onclick=next; $("next").focus({preventScroll:true}); }
  else { const first=c.F.find(f=>!(c.st[f.k]==="ok"||c.st[f.k]==="shown")); first&&$("f-"+first.k).focus({preventScroll:true});
    $("sheet").onsubmit=e=>{ e.preventDefault(); check(); };
    c.F.forEach(f=>{ const el=$("f-"+f.k); el&&el.addEventListener("input",()=>{ c.val[f.k]=el.value; }); }); }
}
function check(){
  const c=G.cards[G.i]; const b=G.by[c.type]||(G.by[c.type]=[0,0]);
  c.F.forEach(f=>{ if(c.st[f.k]==="ok"||c.st[f.k]==="shown") return;
    const v=num(c.val[f.k]??""); b[1]+=c.tries[f.k]?0:1;
    if(!isNaN(v)&&Math.abs(v-f.a)<=.015){ const pts=c.tries[f.k]?5:10; G.score+=pts; if(!c.tries[f.k]) b[0]++; c.st[f.k]="ok"; c.msg[f.k]=c.tries[f.k]?"Got it on the second try. +5":""; return; }
    c.tries[f.k]=(c.tries[f.k]||0)+1;
    const hit=isNaN(v)?null:f.miss.find(([x])=>Math.abs(v-r2(x))<=.02&&Math.abs(r2(x)-f.a)>.015);
    if(c.tries[f.k]>=2){ c.st[f.k]="shown"; c.val[f.k]=String(f.a); c.msg[f.k]=(hit?hit[1]+" ":"")+"Answer: "+(f.unit?f.a+" "+f.unit:fmt(f.a))+"."; }
    else c.msg[f.k]=isNaN(v)?"Type a number.":(hit?hit[1]:"Not quite. Check the step above.")+" Try again.";
  });
  c.done=c.F.every(f=>c.st[f.k]==="ok"||c.st[f.k]==="shown");
  draw();
}
function next(){ G.i++; if(G.i>=G.cards.length){ G.phase="end"; G.end=Date.now(); const ms=G.end-G.t0;
    if(!best||G.score>best.score||(G.score===best.score&&ms<best.ms)){ best={score:G.score,ms}; try{ localStorage.setItem("overtime-rush-best",JSON.stringify(best)); }catch(e){} }
    clearInterval(tick); } else prep(); draw(); }
function end(){
  stats();
  const max=G.cards.reduce((s,c)=>s+c.F.length*10,0);
  const rows=Object.keys(SKILL).filter(k=>G.by[k]).map(k=>{ const [a,t]=G.by[k], p=a/t;
    return `<div class="skill"><b>${SKILL[k]}</b><span class="v">${a} of ${t} first try</span>${p>=.8?`<span class="pill g">Got it</span>`:p>=.6?`<span class="pill a">Almost</span>`:`<span class="pill r">Study this</span>`}</div>`; }).join("");
  $("root").innerHTML=`<div class="panel">
    <div class="eyebrow" style="font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Clocked out</div>
    <div class="big">${G.score} <span style="font-size:.45em;color:var(--muted)">/ ${max}</span></div>
    <h2>Time: ${clock(G.end-G.t0)}</h2>
    <div class="skills">${rows}</div>
    <p>Best on this iPad: ${best.score} points in ${clock(best.ms)}. Screenshot this screen if your teacher asks for it.</p>
    <div class="row"><button class="btn go" id="again">New timecards</button></div></div>`;
  $("again").onclick=intro;
}
function start(d){ if(d&&d.G){ G=d.G; clearInterval(tick); if(G.phase==="play") tick=setInterval(()=>{ const c=$("clk"); if(c) c.textContent=clock(elapsed()); },1000); draw(); } else intro(); }
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body></html>
