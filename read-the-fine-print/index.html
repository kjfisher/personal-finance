<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Read the Fine Print</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a credit card offer on the left (plastic card + terms table, like worksheet page 4); the work sheet on the right asks rewards, interest and fit questions. Choice questions use big tap buttons. */
:root {
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6780; --line:#CBD3DF;
  --hero:#14213D; --hero-ink:#F3F5F8; --gold:#E0A800; --ok:#0F8B6C; --ok-soft:#DDF1EA; --bad:#C23B3B; --bad-soft:#FBE7E7;
  --card:#F1EDF8; --card-line:#C4B6E2; --card-ink:#2A1F45; --punch:#5B3FA6;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0D1424; --surface:#16203A; --ink:#E8EDF5; --muted:#93A0B8; --line:#2A3A5E;
  --hero:#101A30; --gold:#F5C542; --ok:#3CCB9F; --ok-soft:#123A32; --bad:#F07070; --bad-soft:#3A1C24;
  --card:#211A35; --card-line:#43376A; --card-ink:#E9E3F6; --punch:#A68BEF; color-scheme:dark } }
:root[data-theme="dark"] {
  --bg:#0D1424; --surface:#16203A; --ink:#E8EDF5; --muted:#93A0B8; --line:#2A3A5E;
  --hero:#101A30; --gold:#F5C542; --ok:#3CCB9F; --ok-soft:#123A32; --bad:#F07070; --bad-soft:#3A1C24;
  --card:#211A35; --card-line:#43376A; --card-ink:#E9E3F6; --punch:#A68BEF; color-scheme:dark }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden] { display:none !important; }
body { background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; margin:0; }
.bar { background:var(--hero); color:var(--hero-ink); }
.bar .inner { max-width:1180px; margin:0 auto; padding-block:14px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; justify-content:space-between; }
.bar h1 { font-family:var(--display); font-weight:800; font-size:clamp(24px, 3.4vw, 34px); margin:0; line-height:1; }
.bar h1 span { color:var(--gold); }
.bar .stats { display:flex; gap:16px; font-family:var(--mono); font-size:15px; flex-wrap:wrap; align-items:center; }
.bar .stats b { color:var(--gold); font-variant-numeric:tabular-nums; }
.wrap { max-width:1180px; margin:0 auto; padding-block:20px 40px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.game { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.1fr); gap:20px; align-items:start; }
@media (max-width:820px) { .game { grid-template-columns:1fr; } }
.progress { height:8px; background:var(--line); border-radius:99px; overflow:hidden; grid-column:1/-1; }
.progress i { display:block; height:100%; background:var(--ok); transition:width .3s; }
/* timecard */
.tc { background:var(--card); color:var(--card-ink); border:1px solid var(--card-line); border-radius:6px; padding:18px; font-family:var(--mono); font-size:15px; display:grid; gap:10px; min-width:0; position:relative; }
.tc .tag { font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.08em; padding:3px 10px; border-radius:99px; justify-self:start; background:var(--punch); color:var(--card); }
.choices { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px; }
.ch { font:inherit; font-weight:700; padding:10px 16px; border-radius:10px; border:2px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
.ch.sel { border-color:var(--gold); background:rgba(224,168,0,.16); }
.ch.right { border-color:var(--ok); background:var(--ok-soft); }
.ch:disabled { cursor:default; }
.field.wide { grid-template-columns:1fr; }
.tc::before { content:""; }
.plastic { position:relative; aspect-ratio:1.586; max-width:340px; width:100%; border-radius:14px; color:#fff; padding:14px 16px; display:grid; grid-template-rows:auto 1fr auto auto; font-family:var(--mono); box-shadow:0 10px 24px rgba(20,20,40,.25); background:linear-gradient(135deg,#3B2A7A,#6B4FB0); }
.plastic.cash { background:linear-gradient(135deg,#0E5E4A,#1F9A78); } .plastic.travel { background:linear-gradient(135deg,#14213D,#2F5FB8); } .plastic.student { background:linear-gradient(135deg,#8C5A12,#D19A2E); } .plastic.secured { background:linear-gradient(135deg,#3A3F4B,#6B7280); }
.plastic .pn { font-family:var(--display); font-weight:800; font-size:18px; }
.plastic .chip { width:40px; height:30px; border-radius:6px; background:linear-gradient(135deg,#E8C766,#B8912E); align-self:center; }
.plastic .num { font-size:17px; letter-spacing:.12em; }
.plastic .holder { font-size:12px; letter-spacing:.1em; opacity:.85; }
.tc .kind { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--punch); font-weight:600; }
.tc h2 { font-family:var(--display); font-size:24px; margin:0; line-height:1.1; color:var(--card-ink); }
.tc .who { display:flex; flex-wrap:wrap; gap:4px 16px; }
.tc .who b { font-weight:600; }
.tc table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
.tc th, .tc td { border-bottom:1px dashed var(--card-line); padding:5px 4px; text-align:left; }
.tc td:last-child, .tc th:last-child { text-align:right; }
.tc th { font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; }
.tc .stamp { color:var(--punch); font-weight:600; }
.tc .rule { border:1px solid var(--card-line); border-radius:6px; padding:8px 10px; font-size:14px; line-height:1.4; font-family:var(--body); }
.tc .story { font-family:var(--body); font-size:17px; line-height:1.45; }
/* answer sheet */
.sheet { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:clamp(16px, 2.6vw, 26px); display:grid; gap:12px; min-width:0; }
.sheet .eyebrow { font-family:var(--mono); font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.field { display:grid; grid-template-columns:minmax(0, 1fr) minmax(120px, 190px); gap:10px; align-items:center; padding:8px 10px; border-radius:12px; border:2px solid transparent; }
.field.ok { background:var(--ok-soft); border-color:var(--ok); }
.field.no { background:var(--bad-soft); border-color:var(--bad); }
.field.shown { background:var(--bad-soft); }
.field .q { line-height:1.3; }
.field .q small { display:block; color:var(--muted); font-family:var(--mono); font-size:13px; margin-top:2px; }
.field .msg { grid-column:1/-1; font-size:15px; line-height:1.35; }
.inp { display:flex; align-items:center; border:2px solid var(--line); border-radius:10px; background:var(--bg); padding:0 10px; min-width:0; }
.inp:focus-within { border-color:var(--gold); }
.inp span { font-family:var(--mono); color:var(--muted); }
.inp input { flex:1; min-width:0; border:none; background:transparent; color:var(--ink); font-family:var(--mono); font-size:20px; padding:9px 6px; outline:none; }
.inp input:disabled { color:var(--ink); }
.row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.btn { font:inherit; font-weight:700; padding:12px 20px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
.btn.go { background:var(--ok); color:#fff; border-color:var(--ok); }
.btn.gold { background:var(--gold); color:#14213D; border-color:var(--gold); }
.bar .btn { color:var(--hero-ink); background:transparent; border-color:rgba(255,255,255,.3); padding:8px 14px; }
.btn:focus-visible, input:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
.note { color:var(--muted); font-size:15px; margin:0; }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:clamp(18px, 3vw, 30px); display:grid; gap:14px; }
.panel h2 { font-family:var(--display); font-weight:800; font-size:clamp(28px, 4vw, 44px); margin:0; line-height:1.05; text-wrap:balance; }
.panel p { margin:0; line-height:1.45; max-width:65ch; }
.steps { margin:0; padding-left:22px; line-height:1.6; }
.big { font-family:var(--display); font-weight:800; font-size:clamp(40px, 7vw, 68px); line-height:1; color:var(--ok); font-variant-numeric:tabular-nums; }
.skills { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px; }
.skill { border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:4px; }
.skill b { font-family:var(--display); font-size:18px; }
.skill .v { font-family:var(--mono); font-size:15px; }
.pill { justify-self:start; font-size:13px; font-weight:700; padding:2px 10px; border-radius:99px; }
.pill.g { background:var(--ok-soft); color:var(--ok); } .pill.a { background:rgba(224,168,0,.18); color:var(--ink); } .pill.r { background:var(--bad-soft); color:var(--bad); }
@media (prefers-reduced-motion: reduce) { .progress i { transition:none; } }
</style>

<header class="bar"><div class="inner"><h1>Read the <span>Fine Print</span></h1><div class="stats" id="stats"></div></div></header>
<div class="wrap" id="root"></div>

<script>
const SKILL={rew:"Rewards math", int:"Interest cost", fit:"Who it's for", fee:"Fees & terms"};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const fmt=x=>"$"+x.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=x=>"$"+x.toLocaleString("en-US");
const n0=x=>x.toLocaleString("en-US");
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const num=s=>{ s=String(s).replace(/[$,\s]/g,"").replace(/points?|pts/ig,""); return s===""||isNaN(s)?NaN:+s; };
const FOR=["College students and people new to credit","Frequent travelers who spend a lot","People who eat out and pay in full","People with no credit history yet","People who carry a balance"];
function late(o){ return {k:"late", type:"fee", choices:["A late fee (up to "+fmt0(o.lateFee)+")","The annual fee","The cash advance APR","A sign-up bonus"], q:"You pay 3 days after the due date. What cost hits you?", a:"A late fee (up to "+fmt0(o.lateFee)+")", why:"Late payments bring a late fee, and they can hurt your payment history (35% of your score)."}; }
function interest(o){ const B=pick([400,650,800,1200,1500]); return {k:"int", type:"int", q:`You carry a ${fmt0(B)} balance past the due date. Estimate one month of interest.`, sub:`balance × APR ÷ 12 = ${fmt0(B)} × ${(o.apr/100).toFixed(4)} ÷ 12`, a:r2(B*o.apr/1200), tol:.02,
  miss:[[B*o.apr/100,"That's a whole year of interest. Divide by 12."],[B*o.apr/12,"Change the APR to a decimal first."]]}; }
function qualify(o){ const above=Math.random()<.5, s=above?o.score+rnd(8,60):o.score-rnd(12,70);
  return {k:"qual", type:"fit", choices:["Likely yes","Likely no"], q:`Would someone with a ${s} credit score likely qualify? (Recommended: ${o.score}+)`, a:above?"Likely yes":"Likely no", why:above?`${s} is above the recommended ${o.score}.`:`${s} is below the recommended ${o.score}. Try a secured or student card first and build credit.`}; }
function forWho(o){ return {k:"for", type:"fit", choices:shuffle([o.for, ...shuffle(FOR.filter(f=>f!==o.for&&f!=="People who carry a balance")).slice(0,2)]), q:"Who is this card mostly designed for?", a:o.for, why:o.forWhy}; }
function mkPoints(){ const o={kind:"points", name:pick(["Lakeshore Rewards","Bluestem Everyday","Ember Points"]), apr:pick([19.99,22.49,24.24]), lateFee:pick([30,39,41]), cash:pick([28.99,29.49]), grace:pick([21,23,25]), score:pick([660,680,690]), fee:0,
   bonusPts:pick([15000,25000,30000]), bonusSpend:pick([750,1500,2000]), for:"People who pay in full every month", forWhy:"Points and no annual fee help most when you never pay interest."};
  o.for="People who eat out and pay in full"; const gro=rnd(9,30)*10, gas=rnd(4,12)*10, oth=rnd(8,40)*10;
  o.lines=[["2X points","groceries and gas"],["1X point","everything else"],[n0(o.bonusPts)+" bonus points",`after you spend ${fmt0(o.bonusSpend)} in 3 months`]];
  o.F=[{k:"pts", type:"rew", unit:"points", q:`This month: ${fmt0(gro)} groceries, ${fmt0(gas)} gas, ${fmt0(oth)} other. How many points?`, sub:"2 × (groceries + gas) + 1 × other", a:2*(gro+gas)+oth, miss:[[gro+gas+oth,"Groceries and gas earn 2X."],[2*(gro+gas+oth),"Only groceries and gas earn 2X."]]},
       {k:"bonus", type:"rew", q:"How much must you spend in the first 3 months to earn the bonus?", a:o.bonusSpend, miss:[[o.bonusPts,"That's the number of points. How many dollars must you spend?"]]}, pick([interest(o), qualify(o)])];
  return o; }
function mkCash(){ const o={kind:"cash", name:pick(["Riverbend Cash Back","Northgate Cash+","Harbor Dining Card"]), apr:pick([20.24,23.99,25.49]), lateFee:pick([32,40]), cash:pick([29.24,29.99]), grace:pick([22,25]), score:pick([670,700]), fee:0,
   bonusCash:pick([150,200]), bonusSpend:pick([500,1000]), for:"People who eat out and pay in full", forWhy:"3% back on dining with no annual fee is best when you pay in full and don't pay interest."};
  const din=rnd(6,22)*10, oth=rnd(15,60)*10;
  o.lines=[["3% cash back","restaurants and takeout"],["1% cash back","everything else"],[fmt0(o.bonusCash)+" bonus",`after you spend ${fmt0(o.bonusSpend)} in 3 months`]];
  o.F=[{k:"cb", type:"rew", q:`This month: ${fmt0(din)} on dining and ${fmt0(oth)} on everything else. Cash back earned?`, sub:"(dining × 0.03) + (other × 0.01)", a:r2(din*.03+oth*.01), miss:[[(din+oth)*.01,"Dining earns 3%."],[(din+oth)*.03,"Only dining earns 3%."],[din*3+oth,"Change the percents to decimals."]]},
       forWho(o), late(o)];
  return o; }
function mkTravel(){ const o={kind:"travel", name:pick(["Northstar Travel","Skyway Miles Card"]), apr:pick([21.49,24.99]), lateFee:40, cash:29.99, grace:25, score:pick([720,740]), fee:95,
   for:"Frequent travelers who spend a lot", forWhy:"Big travel rewards, a big bonus and a $95 fee only pay off for people who travel and spend a lot."};
  const spend=pick([6000,9000,12000,15000]), travel=pick([1000,1500,2000]), pts=3*travel+(spend-travel), val=r2(pts*.01);
  o.lines=[["3X miles","flights and hotels"],["1X mile","everything else"],["1 mile = 1¢","toward travel"]];
  o.F=[{k:"val", type:"rew", q:`In a year you spend ${fmt0(spend)} total, including ${fmt0(travel)} on travel. What are the miles worth (1¢ each)?`, sub:"(3 × travel + 1 × the rest) × $0.01", a:val, miss:[[spend*.01,"Travel spending earns 3X."],[pts,"Miles are worth 1¢ each. Multiply by 0.01."]]},
       {k:"net", type:"fee", q:"After paying the $95 annual fee, how much are those rewards really worth?", sub:"rewards value − annual fee", a:r2(val-95), miss:[[val,"Subtract the $95 annual fee."]]}, qualify(o)];
  return o; }
function mkStudent(){ const o={kind:"student", name:"Prairie Student Card", apr:pick([26.99,27.74]), lateFee:pick([29,35]), cash:29.99, grace:23, score:580, fee:0,
   for:"College students and people new to credit", forWhy:"Low limits, no annual fee and approval with fair or new credit make it a starter card."};
  o.lines=[["1% cash back","on everything"],["No annual fee",""],["Starting limit","$500"]];
  o.F=[forWho(o), interest(o), {k:"util", type:"fit", q:`With the $500 limit, what is the MOST you should owe to stay at 30% utilization?`, a:150, miss:[[500*.3*10,"30% of $500 is 500 × 0.30."],[350,"That's 70%. Keep the balance at or under 30%."]]}];
  return o; }
function mkSecured(){ const dep=pick([300,500]); const o={kind:"secured", name:"Harbor Secured Card", apr:pick([27.99,28.49]), lateFee:pick([25,30]), cash:29.99, grace:21, score:0, fee:0, dep,
   for:"People with no credit history yet", forWhy:"A secured card uses your own cash deposit as collateral, so it's built for people starting from zero."};
  o.lines=[["Refundable deposit",`${fmt0(dep)} = your credit limit`],["No credit history needed",""],["Reports to all 3 bureaus","Experian, Equifax, TransUnion"]];
  o.F=[forWho(o), {k:"lim", type:"fit", q:"You put down the deposit. What is your credit limit?", a:dep, miss:[]}, {k:"why", type:"fit", choices:["It reports your on-time payments to the bureaus","It pays you interest","It has no APR","It raises your income"], q:"Why does a secured card build credit?", a:"It reports your on-time payments to the bureaus", why:"FICO treats a secured card like any credit card. On-time payments build payment history."}];
  return o; }
function mkTerms(){ const o={kind:"terms", name:"Card terms decoder", lines:[], F:[
   {k:"t1", type:"fee", choices:["Low APR","Sign-up bonus","Rewards rate","Card design"], q:"Which feature matters MOST to someone who carries a balance?", a:"Low APR", why:"If you carry a balance, interest is your biggest cost."},
   {k:"t2", type:"fee", choices:["Rewards and no annual fee","Low APR","Cash advance APR","Late fee amount"], q:"Which matters most to someone who pays in full every month?", a:"Rewards and no annual fee", why:"Pay in full and you never pay interest, so the APR barely matters."},
   {k:"t3", type:"fee", choices:["Time to pay new purchases in full with no interest","Extra days after the due date with no late fee","A free month each year","Time to cancel"], q:"What is the grace period?", a:"Time to pay new purchases in full with no interest", why:"Pay the full statement balance within the grace period and you owe $0 interest."}]};
  return o; }
function makeRound(){ return [mkPoints(), ...shuffle([mkCash(), mkTravel(), mkStudent(), mkSecured(), mkTerms()])]; }

let G=null, best=null;
try{ best=+localStorage.getItem("fine-print-best")||null; }catch(e){}
function stats(){ const el=$("stats");
  if(!G){ el.innerHTML=`<span>Unit 6: Credit</span>`; return; }
  el.innerHTML=`<span>Offer <b>${Math.min(G.i+1,G.cards.length)}</b>/${G.cards.length}</span><span>Score <b>${G.score}</b></span>${G.phase==="play"?`<button class="btn" id="quit">Quit</button>`:""}`;
  $("quit")&&($("quit").onclick=intro); }
function intro(){
  G=null; stats();
  $("root").innerHTML=`<div class="panel">
    <div class="eyebrow" style="font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Unit 6 · Credit Card Offer Analysis (worksheet page 4)</div>
    <h2>Every card sounds great. Read the fine print.</h2>
    <p>Six credit card offers: points, cash back, travel, student, secured, and a terms decoder. Work out the rewards, the real cost of carrying a balance, and who each card is built for.</p>
    <ol class="steps"><li><b>APR</b> = yearly interest rate. One month of interest ≈ balance × APR ÷ 12.</li><li><b>Grace period</b>: pay the full balance by the due date and you pay $0 interest.</li><li>Credit cards are a tool to build credit, not a way to borrow money.</li></ol>
    <p>Typed answers: 10 points first try, 5 second. Tap answers: one try.${best?` <b>Your best: ${best}.</b>`:""}</p>
    <div class="row"><button class="btn go" id="go">Open the first offer</button></div></div>`;
  $("go").onclick=()=>{ G={cards:makeRound(), i:0, score:0, phase:"play", by:{}}; prep(); draw(); };
}
function prep(){ const c=G.cards[G.i]; c.st={}; c.tries={}; c.msg={}; c.val={}; c.done=false; }
function card(o){
  if(o.kind==="terms") return `<div class="tc"><div class="kind">Decoder</div><h2>Words on every offer</h2>
    <table><tr><th>APR</th><td>Annual Percentage Rate: the yearly interest rate on a balance you carry</td></tr><tr><th>Annual fee</th><td>Charged once a year just to have the card</td></tr><tr><th>Cash advance APR</th><td>Higher rate for borrowing cash with the card</td></tr><tr><th>Late fee</th><td>Charged when you pay after the due date</td></tr><tr><th>Grace period</th><td>Days between statement and due date</td></tr></table></div>`;
  return `<div class="tc"><div class="plastic ${o.kind}"><span class="pn">${esc(o.name)}</span><span class="chip"></span><span class="num">4000 ${rnd(1000,9999)} ${rnd(1000,9999)} ${rnd(1000,9999)}</span><span class="holder">A. CARDHOLDER</span></div>
    <div class="kind">${o.kind==="secured"?"Secured card":o.kind==="student"?"Student card":"Rewards card"}</div><h2>${esc(o.name)}</h2>
    <table>${o.lines.map(l=>`<tr><th>${esc(l[0])}</th><td>${esc(l[1])}</td></tr>`).join("")}
      <tr><th>APR (variable)</th><td>${o.apr}%</td></tr><tr><th>Annual fee</th><td>${fmt0(o.fee)}</td></tr><tr><th>Late fee</th><td>Up to ${fmt0(o.lateFee)}</td></tr>
      <tr><th>Cash advance APR</th><td>${o.cash}%</td></tr><tr><th>Grace period</th><td>Up to ${o.grace} days on purchases</td></tr>
      <tr><th>Recommended score</th><td>${o.score?o.score+" or higher":"No credit history needed"}</td></tr></table>
    <div class="rule">All issuers and terms are made up for practice.</div></div>`;
}
function draw(){
  stats();
  if(!G) return intro();
  if(G.phase==="end") return end();
  const c=G.cards[G.i], n=G.cards.length;
  const fields=c.F.map(f=>{ const st=c.st[f.k], dis=st==="ok"||st==="shown";
    if(f.choices) return `<div class="field wide ${st==="ok"?"ok":st==="shown"?"shown":""}"><div class="q">${esc(f.q)}</div>
      <div class="choices" role="group">${f.choices.map(o=>{ let cl="ch"; if(dis&&o===f.a) cl+=" right"; else if(c.val[f.k]===o) cl+=" sel"; return `<button type="button" class="${cl}" data-k="${f.k}" data-o="${esc(o)}" ${dis?"disabled":""}>${esc(o)}</button>`; }).join("")}</div>
      ${c.msg[f.k]?`<div class="msg">${esc(c.msg[f.k])}</div>`:""}</div>`;
    return `<div class="field ${st==="ok"?"ok":st==="shown"?"shown":c.msg[f.k]?"no":""}">
      <label class="q" for="f-${f.k}">${esc(f.q)}${f.sub?`<small>${esc(f.sub)}</small>`:""}</label>
      <div class="inp">${f.unit?"":"<span>$</span>"}<input id="f-${f.k}" inputmode="decimal" autocomplete="off" value="${esc(c.val[f.k]??"")}" ${dis?"disabled":""}>${f.unit?`<span>${f.unit}</span>`:""}</div>
      ${c.msg[f.k]?`<div class="msg">${esc(c.msg[f.k])}</div>`:""}</div>`; }).join("");
  $("root").innerHTML=`<div class="game">
    <div class="progress" aria-hidden="true"><i style="width:${(G.i+(c.done?1:0))/n*100}%"></i></div>
    ${card(c)}
    <form class="sheet" id="sheet" novalidate>
      <div class="eyebrow">Offer ${G.i+1} of ${n}</div>
      ${fields}
      <div class="row">${c.done?`<button class="btn go" type="button" id="next">${G.i+1<n?"Next offer":"See my results"}</button>`:`<button class="btn go" type="submit">Check</button>`}</div>
      <p class="note">Round money to the cent. Use a calculator.</p>
    </form></div>`;
  if(c.done){ $("next").onclick=next; $("next").focus({preventScroll:true}); return; }
  $("sheet").onsubmit=e=>{ e.preventDefault(); check(); };
  c.F.forEach(f=>{ if(f.choices) return; const el=$("f-"+f.k); el&&el.addEventListener("input",()=>{ c.val[f.k]=el.value; }); });
  document.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{ c.val[b.dataset.k]=b.dataset.o; draw(); });
}
function check(){
  const c=G.cards[G.i];
  c.F.forEach(f=>{ if(c.st[f.k]==="ok"||c.st[f.k]==="shown") return; const b=G.by[f.type]||(G.by[f.type]=[0,0]);
    if(f.choices){ const v=c.val[f.k]; if(!v){ c.msg[f.k]="Tap an answer."; return; } b[1]++;
      if(v===f.a){ G.score+=10; b[0]++; c.st[f.k]="ok"; c.msg[f.k]=f.why; } else { c.st[f.k]="shown"; c.msg[f.k]="Best answer: "+f.a+". "+f.why; } return; }
    const v=num(c.val[f.k]??""), tol=f.tol||.015; if(!c.tries[f.k]) b[1]++;
    if(!isNaN(v)&&Math.abs(v-f.a)<=tol){ const pts=c.tries[f.k]?5:10; G.score+=pts; if(!c.tries[f.k]) b[0]++; c.st[f.k]="ok"; c.msg[f.k]=c.tries[f.k]?"Got it on the second try. +5":""; return; }
    c.tries[f.k]=(c.tries[f.k]||0)+1;
    const hit=isNaN(v)?null:(f.miss||[]).find(([x])=>Math.abs(v-r2(x))<=.02&&Math.abs(r2(x)-f.a)>tol);
    const show=f.unit?n0(f.a)+" "+f.unit:fmt(f.a);
    if(c.tries[f.k]>=2){ c.st[f.k]="shown"; c.val[f.k]=String(f.a); c.msg[f.k]=(hit?hit[1]+" ":"")+"Answer: "+show+"."; }
    else c.msg[f.k]=isNaN(v)?"Type a number.":(hit?hit[1]:"Not quite. Read the offer again.")+" Try again.";
  });
  c.done=c.F.every(f=>c.st[f.k]==="ok"||c.st[f.k]==="shown");
  draw();
}
function next(){ G.i++; if(G.i>=G.cards.length){ G.phase="end"; if(!best||G.score>best){ best=G.score; try{ localStorage.setItem("fine-print-best",String(best)); }catch(e){} } } else prep(); draw(); }
function end(){
  stats();
  const max=G.cards.reduce((s,c)=>s+c.F.length*10,0);
  const rows=Object.keys(SKILL).filter(k=>G.by[k]).map(k=>{ const [a,t]=G.by[k], p=a/t;
    return `<div class="skill"><b>${SKILL[k]}</b><span class="v">${a} of ${t} first try</span>${p>=.8?`<span class="pill g">Got it</span>`:p>=.6?`<span class="pill a">Almost</span>`:`<span class="pill r">Study this</span>`}</div>`; }).join("");
  $("root").innerHTML=`<div class="panel">
    <div class="eyebrow" style="font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">All offers read</div>
    <div class="big">${G.score} <span style="font-size:.45em;color:var(--muted)">/ ${max}</span></div>
    <div class="skills">${rows}</div>
    <p>Before you pick a card, compare the APR, annual fee, late fee, rewards and the score you need. Then pay in full, on time, every time.</p>
    <div class="row"><button class="btn go" id="again">New offers</button></div></div>`;
  $("again").onclick=intro;
}
function start(d){ if(d&&d.G){ G=d.G; draw(); } else intro(); }
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
