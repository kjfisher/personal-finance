<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swipe It</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap"><style>
:root{--bg:#F2F4F1;--surface:#FFFFFF;--ink:#14213D;--muted:#5A6478;--line:#D3D9D0;--hero:#14213D;--hero-ink:#F3F5F8;--gold:#E0A800;--money:#0F8B6C;--money-ink:#FFFFFF;
--good:#1F7A45;--good-bg:#E3F4E8;--bad:#B23A26;--bad-bg:#FBE9E5;--warn:#9A6B00;--warn-bg:#FBF1D9;--accent:var(--money);
--display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B111D;--surface:#151E33;--ink:#E8EDF5;--muted:#97A3B9;--line:#26334F;--hero:#101A30;--gold:#F5C542;--money:#3CCB9F;--money-ink:#06261D;
--good:#6CCB8A;--good-bg:#17301F;--bad:#F09A72;--bad-bg:#3A1F18;--warn:#F5C542;--warn-bg:#3A3015;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B111D;--surface:#151E33;--ink:#E8EDF5;--muted:#97A3B9;--line:#26334F;--hero:#101A30;--gold:#F5C542;--money:#3CCB9F;--money-ink:#06261D;--good:#6CCB8A;--good-bg:#17301F;--bad:#F09A72;--bad-bg:#3A1F18;--warn:#F5C542;--warn-bg:#3A3015;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.top{background:var(--hero);color:var(--hero-ink)}
.top .in{max-width:980px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.eyebrow{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,44px);line-height:1;margin:4px 0 0}
.top nav{display:flex;gap:8px;flex-wrap:wrap}
.top nav a{color:var(--hero-ink);text-decoration:none;border:1px solid rgba(255,255,255,.3);padding:8px 12px;border-radius:10px;font-weight:700;font-size:15px}
main{max-width:980px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:12px;min-width:0}
.panel h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.4vw,30px);line-height:1.15;margin:0}
.lede{margin:0;color:var(--muted)}
.label{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{font:700 16px var(--body);border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;border-radius:12px;cursor:pointer;text-align:left}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--money);color:var(--money-ink);border-color:var(--money)}
.btn.gold{background:var(--gold);color:#14213D;border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.choice small{grid-column:1/-1;color:var(--muted);font-weight:400}
.cost{font:600 15px var(--mono)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.stat b{display:block;font:600 22px var(--mono)}
.stat.neg b{color:var(--bad)} .stat.pos b{color:var(--good)}
.note{border-radius:12px;padding:10px 14px;font-weight:700}
.note.ok{background:var(--good-bg);color:var(--good)} .note.no{background:var(--bad-bg);color:var(--bad)} .note.warn{background:var(--warn-bg);color:var(--warn)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(40px,9vw,72px);line-height:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#14213D;font-weight:700;padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:all .3s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)} td.n,th.n{text-align:right;font-family:var(--mono)}
.tw{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.arena{display:grid;place-items:center;min-height:300px;touch-action:none}
.swcard{width:min(420px,100%);min-height:260px;background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:0 14px 30px rgba(20,33,61,.15);display:grid;align-content:center;gap:12px;padding:24px;text-align:center;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .2s,border-color .2s}
.swcard .lbl{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.swcard .item{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,38px);line-height:1.15}
.swcard .why{min-height:1.4em;font-weight:700}
.swcard.ok{border-color:var(--good)} .swcard.no{border-color:var(--bad)}
.big2{flex:1 1 45%;text-align:center;font-size:20px;padding:16px}
</style></head>
<body><header class="top"><div class="in"><div><div class="eyebrow">Units 3, 6 & 9 · Solo · 60 seconds</div><h1>Swipe It</h1></div>
<nav><a href="/passport/">My Passport</a><a href="/">Arcade</a></nav></div></header>
<main>
<section class="panel" id="menu">
  <h2>Swipe right, swipe left. Beat the clock.</h2>
  <p class="lede">60 seconds. Swipe each card (or tap the buttons, or use the ← → keys). Build a streak. Miss one and you'll see why.</p>
  <div class="choices" id="decks"></div>
</section>
<section id="game" hidden style="display:grid;gap:16px">
  <div class="stats"><div class="stat"><span class="label">Time</span><b id="time">60</b></div><div class="stat pos"><span class="label">Score</span><b id="score">0</b></div><div class="stat"><span class="label">Streak</span><b id="streak">0</b></div></div>
  <div class="arena"><div class="swcard" id="card"><div class="lbl" id="deckname"></div><div class="item" id="item"></div><div class="why" id="why"></div></div></div>
  <div class="row" style="justify-content:space-between"><button class="btn big2" id="bL">← <span id="tL"></span></button><button class="btn big2" id="bR"><span id="tR"></span> →</button></div>
</section>
<section class="panel" id="end" hidden></section>
</main>
<script>
const FMP=(()=>{const K="fm-passport";
 function get(){try{const p=JSON.parse(localStorage.getItem(K));if(p&&p.s&&p.b)return p;}catch(e){}return {s:{},b:{},x:{}};}
 function save(p){try{localStorage.setItem(K,JSON.stringify(p));}catch(e){}}
 return {get,
  stamp(slug,score){const p=get();const s=p.s[slug]||{n:0,best:null};s.n++;if(score!=null&&(s.best==null||score>s.best))s.best=score;s.t=Date.now();p.s[slug]=s;save(p);},
  badge(id,name){const p=get();if(p.b[id])return false;p.b[id]=Date.now();save(p);if(name)fmToast("🏅 Passport badge earned: "+name);return true;},
  count(key){const p=get();p.x=p.x||{};p.x[key]=(p.x[key]||0)+1;save(p);return p.x[key];}};})();
function fmToast(t){let el=document.getElementById("fmToast");if(!el){el=document.createElement("div");el.id="fmToast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}
 el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),3800);}

const D={"nw": {"name": "Need or Want?", "unit": "Unit 3", "L": "Need", "R": "Want", "items": [["Rent", "L", "Housing is a need."], ["Groceries", "L", "Food is a need (fancy snacks aside)."], ["Electric bill", "L", "Utilities keep your home running."], ["Bus pass to get to work", "L", "Getting to work keeps your paycheck coming."], ["Health insurance", "L", "One illness without it can cost thousands."], ["Basic phone plan", "L", "Most jobs need you to be reachable."], ["Concert tickets", "R", "Fun, but you can live without it."], ["New sneakers when yours are fine", "R", "A want, especially when the old pair works."], ["Streaming service", "R", "Entertainment is a want."], ["Eating out with friends", "R", "Fun and social, but it's a want."], ["New video game", "R", "A want."], ["Designer bag", "R", "A want."], ["Car insurance (you drive)", "L", "Required by law if you drive."], ["Prescription medicine", "L", "Health comes first."], ["Gym membership", "R", "Free workouts exist, so it's a want."], ["Daily coffee shop latte", "R", "$6 a day is about $180 a month."], ["Work boots for your job", "L", "Needed to do your job safely."], ["Spring break trip", "R", "A want: plan and save for it."], ["Water bill", "L", "A basic utility."], ["Newest phone upgrade", "R", "Your current phone still works."]]}, "fv": {"name": "Fixed or Variable?", "unit": "Unit 3", "L": "Fixed", "R": "Variable", "items": [["Rent", "L", "Same amount every month."], ["Car payment", "L", "Same payment every month."], ["Streaming subscription", "L", "Same price each month."], ["Phone plan", "L", "Same monthly bill."], ["Insurance premium", "L", "Same each month."], ["Student loan payment", "L", "Set monthly payment."], ["Gym membership", "L", "Same monthly fee."], ["Groceries", "R", "Changes week to week."], ["Gas for your car", "R", "Depends on driving and gas prices."], ["Electric bill", "R", "Changes with the season."], ["Eating out", "R", "Depends on your choices."], ["Clothes", "R", "Changes month to month."], ["Entertainment", "R", "Changes month to month."], ["Water bill", "R", "Changes with how much you use."], ["Gifts", "R", "Some months more than others."], ["Haircuts", "R", "Depends on how often you go."]]}, "cr": {"name": "Helps or Hurts Your Credit?", "unit": "Unit 6", "L": "Helps", "R": "Hurts", "items": [["Paying every bill on time", "L", "Payment history is 35% of your score."], ["Keeping balances under 30% of your limit", "L", "Low utilization helps (amounts owed = 30%)."], ["Opening 5 new cards in one month", "R", "Lots of hard inquiries and new credit hurt."], ["Missing a payment", "R", "Late payments hurt and stay about 7 years."], ["Closing your oldest card", "R", "It shortens your credit history and raises utilization."], ["Maxing out a card", "R", "High utilization hurts."], ["Becoming an authorized user on a parent's good card", "L", "Their on-time history can help you start."], ["Paying your full balance every month", "L", "On time + low balance = good for your score."], ["Using a secured card responsibly", "L", "A great way to build credit from zero."], ["A bill sent to collections", "R", "Collections hurt badly."], ["A long credit history", "L", "Length of history is 15% of your score."], ["Applying for lots of loans at once", "R", "Hard inquiries add up."], ["Paying a car loan on time", "L", "Installment loans paid on time help your mix and history."], ["Only paying the minimum and carrying a big balance", "R", "High balances raise utilization (and cost interest)."]]}, "sb": {"name": "Stock or Bond?", "unit": "Unit 9", "L": "Stock", "R": "Bond", "items": [["You own a small piece of a company", "L", "A stock is ownership."], ["You lend money to a government", "R", "A bond is a loan."], ["Pays you a fixed interest rate", "R", "Bonds pay set interest."], ["Higher risk, higher possible return", "L", "Stocks swing more."], ["U.S. Treasury", "R", "A loan to the federal government."], ["May pay you dividends", "L", "Companies share profits with shareholders."], ["Shares of a sneaker company", "L", "Shares = stock."], ["Your city borrows to build a school", "R", "Municipal bonds are loans to cities."], ["Value can drop a lot in a market crash", "L", "Stocks are more volatile."], ["Paid back on a set maturity date", "R", "Bonds have a maturity date."], ["You vote at the shareholder meeting", "L", "Shareholders are owners."], ["Lower risk, lower return", "R", "Bonds are usually steadier."]]}};

const $=id=>document.getElementById(id);
let deck,order,idx,score,streak,best,time,timer,lock=false,misses=[];
$("decks").innerHTML=Object.entries(D).map(([k,d])=>`<button class="btn choice" data-d="${k}"><span>${d.name}</span><span class="cost">${d.unit}</span><small>${d.L} ← → ${d.R} · ${d.items.length} cards</small></button>`).join("");
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>start(b.dataset.d));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(k){deck=D[k];deck.k=k;order=shuffle(deck.items.slice());idx=0;score=0;streak=0;best=0;time=60;misses=[];
  $("menu").hidden=true;$("end").hidden=true;$("game").hidden=false;$("deckname").textContent=deck.name;$("tL").textContent=deck.L;$("tR").textContent=deck.R;
  show();clearInterval(timer);timer=setInterval(()=>{time--;$("time").textContent=time;if(time<=0)end();},1000);upd();}
function upd(){$("score").textContent=score;$("streak").textContent=streak;$("time").textContent=time;}
function show(){if(idx>=order.length){order=shuffle(deck.items.slice());idx=0;} const c=$("card");c.className="swcard";c.style.transform="";$("item").textContent=order[idx][0];$("why").textContent="";lock=false;}
function answer(side){if(lock||time<=0)return;lock=true;const it=order[idx],ok=side===it[1],c=$("card");
  c.style.transform=`translateX(${side==="L"?-60:60}px) rotate(${side==="L"?-6:6}deg)`;
  if(ok){score++;streak++;best=Math.max(best,streak);c.classList.add("ok");$("why").textContent="✓ "+(it[1]==="L"?deck.L:deck.R);setTimeout(()=>{idx++;show();},350);}
  else{streak=0;misses.push(it);c.classList.add("no");$("why").textContent=`✗ ${it[1]==="L"?deck.L:deck.R}: ${it[2]}`;setTimeout(()=>{idx++;show();},1600);}
  upd(); if(best>=15) FMP.badge("swipe-master","Swipe Master (15 in a row)");}
$("bL").onclick=()=>answer("L");$("bR").onclick=()=>answer("R");
document.addEventListener("keydown",e=>{if($("game").hidden)return;if(e.key==="ArrowLeft")answer("L");if(e.key==="ArrowRight")answer("R");});
(()=>{const c=$("card");let x0=null;c.addEventListener("pointerdown",e=>{x0=e.clientX;c.setPointerCapture(e.pointerId);});
 c.addEventListener("pointermove",e=>{if(x0===null||lock)return;const dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;});
 c.addEventListener("pointerup",e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>70)answer(dx<0?"L":"R");else if(!lock)c.style.transform="";});})();
function end(){clearInterval(timer);time=0;$("game").hidden=true;$("end").hidden=false;FMP.stamp("swipe-it-"+deck.k,score);const p=FMP.get().s["swipe-it-"+deck.k];
  const m=[...new Map(misses.map(x=>[x[0],x])).values()];
  $("end").innerHTML=`<h2>${deck.name}: ${score} right</h2><div class="stats"><div class="stat"><span class="label">Best streak</span><b>${best}</b></div><div class="stat"><span class="label">Your best score on this iPad</span><b>${p?p.best:score}</b></div></div>
   ${m.length?`<div class="label">Review these</div><ul>${m.map(x=>`<li><b>${x[0]}</b> → ${x[1]==="L"?deck.L:deck.R}. ${x[2]}</li>`).join("")}</ul>`:`<div class="note ok">No misses. Amazing!</div>`}
   <div class="row"><button class="btn primary" id="again">Play again</button><button class="btn" id="menuB">Pick another deck</button></div>`;
  $("again").onclick=()=>start(deck.k);$("menuB").onclick=()=>{$("end").hidden=true;$("menu").hidden=false;};}
</script></body></html>
